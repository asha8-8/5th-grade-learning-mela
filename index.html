1 min 50 sec", "15 min 0 sec", "2 min 50 sec"], "correct": 0, "explain": "Using the Clock Ladder Trick, divide 150 by 60: 150 divided by 60 = 2 remainder 30, so 150 seconds = 2 minutes 30 seconds."}, {"q": "Convert 200 minutes into hours and minutes.", "options": ["3 hours 20 minutes", "2 hours 30 minutes", "3 hours 30 minutes", "2 hours 20 minutes"], "correct": 0, "explain": "Clock Ladder Trick: 200 divided by 60 = 3 remainder 20, so 200 minutes = 3 hours 20 minutes."}, {"q": "A race started at 4:45 pm and finished at 5:10 pm. How long did the race last?", "options": ["25 minutes", "15 minutes", "35 minutes", "45 minutes"], "correct": 0, "explain": "Using the Add the Gap Trick: 15 minutes to reach 5:00 pm, then 10 more minutes to 5:10 pm, giving 15 + 10 = 25 minutes."}, {"q": "Write 3:00 pm in 24-hour format.", "options": ["15:00", "03:00", "13:00", "30:00"], "correct": 0, "explain": "Using the 24-Hour Shift Trick, add 12 to the pm hour: 3 + 12 = 15, so it becomes 15:00."}, {"q": "A train departs at 14:35 and arrives at 17:20. How long is the journey?", "options": ["2 hours 45 minutes", "3 hours 15 minutes", "2 hours 35 minutes", "3 hours 45 minutes"], "correct": 0, "explain": "Using the Add the Gap Trick: 25 minutes to reach 15:00, then 2 hours to 17:00, then 20 more minutes to 17:20. Total: 25 + 120 + 20 = 165 minutes, which is 2 hours 45 minutes."}, {"q": "Convert 7500 seconds into hours, minutes, and seconds.", "options": ["2 hours 5 minutes 0 seconds", "2 hours 15 minutes 0 seconds", "1 hour 55 minutes 0 seconds", "2 hours 5 minutes 30 seconds"], "correct": 0, "explain": "Clock Ladder Trick applied twice: 7500 divided by 3600 = 2 remainder 300, then 300 divided by 60 = 5 remainder 0. So 7500 seconds = 2 hours 5 minutes 0 seconds."}, {"q": "A clock shows 11:50 am. What time will it show after 25 more minutes?", "options": ["12:15 pm", "12:05 pm", "11:75 am", "12:25 pm"], "correct": 0, "explain": "Using the Add the Gap Trick, 10 minutes takes the clock to 12:00 noon, then 15 more minutes makes it 12:15 pm; remember minutes reset at 60, they never count up to 75 or beyond 59."}, {"q": "In a 100 m race, Runner A finishes in 45 seconds and Runner B finishes in 1 minute 2 seconds. By how many seconds is Runner A faster?", "options": ["17 seconds", "22 seconds", "7 seconds", "12 seconds"], "correct": 0, "explain": "First convert Runner B's time using 60 Not 100: 1 minute 2 seconds = 62 seconds. Then subtract: 62 minus 45 = 17 seconds, so Runner A is faster by 17 seconds."}], "practice": [{"q": "Convert 3 minutes into seconds.", "answer": "180 seconds", "solution": "1) Using 60 Not 100, multiply minutes by 60 instead of 100. 2) 3 times 60 = 180. 3) So 3 minutes = 180 seconds."}, {"q": "Convert 90 seconds into minutes and seconds.", "answer": "1 minute 30 seconds", "solution": "1) Using the Clock Ladder Trick, divide 90 by 60. 2) 90 divided by 60 = 1 remainder 30. 3) So 90 seconds = 1 minute 30 seconds."}, {"q": "Convert 2 hours into minutes.", "answer": "120 minutes", "solution": "1) Using 60 Not 100, multiply hours by 60. 2) 2 times 60 = 120. 3) So 2 hours = 120 minutes."}, {"q": "Convert 250 minutes into hours and minutes.", "answer": "4 hours 10 minutes", "solution": "1) Using the Clock Ladder Trick, divide 250 by 60. 2) 250 divided by 60 = 4 remainder 10. 3) So 250 minutes = 4 hours 10 minutes."}, {"q": "A school assembly starts at 8:15 am and ends at 8:50 am. How long does the assembly last?", "answer": "35 minutes", "solution": "1) Since both times are in the same hour, use simple subtraction. 2) 50 minus 15 = 35. 3) So the assembly lasts 35 minutes."}, {"q": "Write 6:30 pm in 24-hour format.", "answer": "18:30", "solution": "1) Using the 24-Hour Shift Trick, add 12 to the pm hour. 2) 6 + 12 = 18. 3) So 6:30 pm becomes 18:30 in 24-hour time."}, {"q": "A train leaves Mumbai at 22:15 and reaches Pune at 00:45 the next day. How long is the journey?", "answer": "2 hours 30 minutes", "solution": "1) Using the Timetable Two-Step Trick, first find the gap to midnight: from 22:15 to 24:00 is 1 hour 45 minutes. 2) Then add the time after midnight: from 00:00 to 00:45 is 45 minutes. 3) Total journey time: 1 hour 45 minutes plus 45 minutes = 2 hours 30 minutes."}, {"q": "In a race, the winner finishes in 2 minutes 5 seconds, and the runner-up finishes 18 seconds after the winner. What is the runner-up's finishing time?", "answer": "2 minutes 23 seconds", "solution": "1) Convert the winner's time fully to seconds using 60 Not 100: 2 minutes 5 seconds = (2 times 60) + 5 = 125 seconds. 2) Add the extra 18 seconds: 125 + 18 = 143 seconds. 3) Convert back using the Clock Ladder Trick: 143 divided by 60 = 2 remainder 23, so the runner-up's time is 2 minutes 23 seconds."}]}, {"id": "ch13", "number": 13, "title": "Animal Jumps", "icon": "🐸", "tagline": "Hop through factors, multiples and prime numbers!", "summary": "Get ready to jump like a frog on a number line! This chapter explores factors, multiples, arrays, and prime and composite numbers, and shows you quick divisibility tricks to check numbers in seconds. You will also discover how two animals jumping in different step sizes can land together, which is the friendly first step towards common multiples.", "concepts": [{"heading": "Factors", "explanation": "Factors of a number are the numbers that divide it exactly, with no remainder left over. For example, the factors of 12 are 1, 2, 3, 4, 6 and 12, because each of these divides 12 exactly, like 12 divided by 3 equals 4.", "trick": {"name": "Pair Up Trick", "howto": "Test division starting from 1 and going upward, writing down each factor pair as you find it. Stop once the two numbers in a pair start to cross over each other, because after that point you would just repeat pairs you already found.", "example": "Find factors of 18: 1x18, 2x9, 3x6 - the next number to test is 4, but 18 is not divisible by 4, and testing further would cross the pair 3x6, so the factors are 1, 2, 3, 6, 9, 18."}}, {"heading": "Multiples", "explanation": "A multiple of a number is what you get when you multiply it by 1, 2, 3 and so on. For example, the multiples of 4 are 4, 8, 12, 16, 20 and so on, going on forever.", "trick": {"name": "Skip Counting Speed", "howto": "Instead of multiplying each time, just keep adding the number to the previous multiple. This skip-counting method is much faster for listing several multiples in a row.", "example": "List the first 5 multiples of 7 by skip counting: 7, then 7+7=14, then 14+7=21, then 21+7=28, then 28+7=35."}}, {"heading": "Arrays as a Model of Multiplication", "explanation": "An array arranges objects into equal rows and columns, showing multiplication visually. For example, 3 rows of 4 mangoes make an array of 12 mangoes, showing that 3 and 4 are both factors of 12.", "trick": {"name": "Rectangle Rule", "howto": "If a number of objects can be arranged into a neat rectangle with more than one row and more than one column, the number of rows and columns are a factor pair of that total. If the only possible arrangement is a single straight line, the number might be prime.", "example": "Try to arrange 7 mangoes into a rectangle: only 1 row of 7 works, no other rectangle fits, which is a clue that 7 is a prime number."}}, {"heading": "Prime and Composite Numbers", "explanation": "A prime number has exactly two factors, 1 and itself, like 5 whose only factors are 1 and 5. A composite number has more than two factors, like 6 whose factors are 1, 2, 3 and 6.", "trick": {"name": "Only Two Friends", "howto": "To check if a number is prime, test whether small numbers like 2, 3, 5, 7 divide it exactly, only up to roughly its square root. If none of them divide the number evenly, it has only two factors and is prime.", "example": "Check if 29 is prime: test 2 (no), 3 (no), 5 (no) - since none divide 29 evenly and we have passed its square root (about 5.4), 29 is prime."}}, {"heading": "Divisibility Rules", "explanation": "Divisibility rules let you check quickly whether a number divides exactly, without doing long division. For example, since 3,450 ends in 0, it is divisible by 10, and also by 2 and 5.", "trick": {"name": "Last Digit and Digit Sum Trick", "howto": "For 2, check if the last digit is even (0,2,4,6,8). For 5, check if the last digit is 0 or 5. For 10, check if the last digit is 0. For 3, add up all the digits of the number, and if that total is divisible by 3, so is the original number.", "example": "Check 471 for divisibility by 3: digit sum is 4+7+1=12, and 12 divided by 3 is 4 exactly, so 471 is divisible by 3."}}, {"heading": "Common Multiples and Number-Line Jumps", "explanation": "Imagine two animals jumping along a number line in different step sizes; the numbers where they land at the same time are common multiples of their step sizes. For example, a frog jumping in steps of 3 lands on 3, 6, 9, 12, 15, 18, while a rabbit jumping in steps of 4 lands on 4, 8, 12, 16, 20, and they meet at 12.", "trick": {"name": "List and Match Trick", "howto": "Write out the multiples of each jump size in two separate lists, then scan both lists to find the smallest number that appears in both. That number is the first place the two jumpers land together.", "example": "Multiples of 5: 5, 10, 15, 20; multiples of 6: 6, 12, 18, 24, 30. The first number appearing in both lists (extend if needed) is 30, so they first meet at 30."}}], "mcqs": [{"q": "What are the factors of 10?", "options": ["1, 2, 5, 10", "1, 2, 4, 5, 10", "1, 5, 10", "2, 5"], "correct": 0, "explain": "Using the Pair Up trick, 1x10 and 2x5 are the only factor pairs of 10, so its factors are 1, 2, 5 and 10."}, {"q": "Which of these numbers is a multiple of 6?", "options": ["16", "18", "20", "22"], "correct": 1, "explain": "Using Skip Counting, the multiples of 6 are 6, 12, 18, 24... and 18 appears in this list, so it is a multiple of 6."}, {"q": "Is 15 a prime number or a composite number?", "options": ["Prime", "Composite", "Neither", "Both"], "correct": 1, "explain": "Using Only Two Friends, 15 has factors 1, 3, 5 and 15, which is more than two factors, so 15 is composite."}, {"q": "Which of these numbers is divisible by 5?", "options": ["342", "455", "468", "234"], "correct": 1, "explain": "Using the Last Digit trick for 5, a number is divisible by 5 if it ends in 0 or 5. Only 455 ends in 5, so it is divisible by 5."}, {"q": "Using the Rectangle Rule, which arrangement shows that 12 is a composite number?", "options": ["3 rows of 4", "1 row of 11", "A single line of 12 with no rows", "13 objects in 1 row"], "correct": 0, "explain": "Arranging 12 objects as 3 rows of 4 forms a neat rectangle other than a single line, showing that 3 and 4 are factor pairs of 12, so 12 is composite."}, {"q": "A frog jumps in steps of 4 (4, 8, 12, 16, 20...) and a rabbit jumps in steps of 6 (6, 12, 18, 24...). At which number do they first land together?", "options": ["6", "12", "18", "24"], "correct": 1, "explain": "Using the List and Match trick, comparing the two lists shows that 12 appears in both, and it is the smallest such number, so they first meet at 12."}, {"q": "Using the Digit Sum trick, is 4,521 divisible by 3?", "options": ["Yes, because the digit sum is 12, which divides by 3", "No, because it ends in 1", "Yes, because it is an even number", "No, because the digit sum is 13"], "correct": 0, "explain": "Adding the digits of 4,521 gives 4+5+2+1=12, and since 12 is divisible by 3, the number 4,521 is also divisible by 3."}, {"q": "Which of these numbers is prime?", "options": ["21", "23", "27", "33"], "correct": 1, "explain": "Using Only Two Friends: 21=3x7, 27=3x9, and 33=3x11 are all composite, but 23 has no factors other than 1 and itself, so it is prime."}, {"q": "Using the Pair Up trick, find all factor pairs of 24. How many total factors does 24 have?", "options": ["6 factors", "7 factors", "8 factors", "9 factors"], "correct": 2, "explain": "The factor pairs of 24 are 1x24, 2x12, 3x8, 4x6, giving the factors 1, 2, 3, 4, 6, 8, 12, 24 - a total of 8 factors."}, {"q": "Two animals start at 0. One jumps in steps of 5, the other in steps of 7. Using the List and Match trick, at what number do they first meet again (other than at 0)?", "options": ["28", "30", "35", "42"], "correct": 2, "explain": "Multiples of 5 are 5,10,15,20,25,30,35 and multiples of 7 are 7,14,21,28,35. The smallest number appearing in both lists is 35, so that is where they first meet."}, {"q": "Which of these numbers is divisible by both 2 and 5 (and therefore by 10)?", "options": ["4,235", "6,780", "3,102", "9,045"], "correct": 1, "explain": "Using the Last Digit trick, a number divisible by both 2 and 5 must end in 0. Only 6,780 ends in 0, so it is the one divisible by 2, 5 and 10."}, {"q": "A gardener wants to plant 36 saplings in equal rows, with more than 1 row and more than 1 sapling per row. Which of these is NOT a possible array?", "options": ["4 rows of 9", "6 rows of 6", "5 rows of 7", "3 rows of 12"], "correct": 2, "explain": "Using the Rectangle Rule, an array is only possible if rows times columns equals 36. Since 5x7=35, not 36, this is not a valid array for 36 saplings, unlike the other three options."}], "practice": [{"q": "List all the factors of 20.", "answer": "1, 2, 4, 5, 10, 20", "solution": "1) Use the Pair Up trick, testing numbers from 1 upward: 1x20, 2x10, 4x5. 2) Testing 3 does not divide 20 evenly, and after 4x5 the pairs would cross, so we stop. 3) The complete list of factors is 1, 2, 4, 5, 10, 20."}, {"q": "List the first 5 multiples of 9.", "answer": "9, 18, 27, 36, 45", "solution": "1) Use Skip Counting Speed: start at 9. 2) Add 9 repeatedly: 9, 9+9=18, 18+9=27, 27+9=36, 36+9=45. 3) The first 5 multiples of 9 are 9, 18, 27, 36, 45."}, {"q": "Is 51 prime or composite? Show your check.", "answer": "Composite (51 = 3 x 17)", "solution": "1) Use Only Two Friends: test small numbers - 51 is odd, so 2 does not divide it. 2) Test 3 using the Digit Sum trick: 5+1=6, which is divisible by 3, so 51 is divisible by 3 (51÷3=17). 3) Since 51 has factors 1, 3, 17 and 51 (more than two), it is composite."}, {"q": "Using divisibility rules, check whether 4,563 is divisible by 3, and whether 7,340 is divisible by 2, 5 and 10.", "answer": "4,563 is divisible by 3 (yes) ; 7,340 is divisible by 2, 5 and 10 (yes to all three)", "solution": "1) For 4,563, use the Digit Sum trick: 4+5+6+3=18, and 18 is divisible by 3, so 4,563 is divisible by 3. 2) For 7,340, use the Last Digit trick: it ends in 0, which means it is divisible by 2 (even), by 5 (ends in 0 or 5), and by 10 (ends in 0)."}, {"q": "A cat jumps in steps of 3 and a dog jumps in steps of 5, both starting at 0. At what number do they first land together?", "answer": "15", "solution": "1) Use List and Match: multiples of 3 are 3,6,9,12,15; multiples of 5 are 5,10,15. 2) The smallest number appearing in both lists is 15. 3) So the cat and dog first land together at 15."}, {"q": "Find all factor pairs of 30 and use the Rectangle Rule to say whether 30 is prime or composite.", "answer": "Composite ; factor pairs are (1,30) (2,15) (3,10) (5,6)", "solution": "1) Use Pair Up: test numbers from 1 upward - 1x30, 2x15, 3x10, 5x6. 2) Testing 4 does not divide 30 evenly, and the pairs would then cross, so we stop. 3) Since 30 has 8 factors in total (more than two), and can form rectangles like 5 rows of 6, it is composite."}, {"q": "In a school march-past, 45 students want to stand in equal rows, with more than one row and more than one student per row. List two different possible arrangements using factors of 45.", "answer": "For example: 3 rows of 15, or 5 rows of 9", "solution": "1) Use Pair Up to find factor pairs of 45: 1x45, 3x15, 5x9. 2) Ignore the 1x45 pair since it means only 1 row. 3) Valid arrangements with more than 1 row and more than 1 student per row are 3 rows of 15 students, or 5 rows of 9 students (or their reverses, 15 rows of 3 or 9 rows of 5)."}, {"q": "Two buses leave a depot at the same time. Bus A returns every 8 minutes and Bus B returns every 12 minutes. Using the List and Match trick, after how many minutes will both buses be at the depot together again (other than at the start)?", "answer": "24 minutes", "solution": "1) Use List and Match: multiples of 8 are 8,16,24,32; multiples of 12 are 12,24,36. 2) The smallest number appearing in both lists is 24. 3) So both buses will be at the depot together again after 24 minutes."}]}, {"id": "ch14", "number": 14, "title": "Maps and Locations", "icon": "🗺️", "tagline": "Follow the grid, find your way, discover the treasure!", "summary": "Maps help us understand a place without having to walk through all of it first, and this chapter turns you into a confident map reader. You will learn to use symbols, directions, grid references, and scale to find your way around a park, a neighbourhood, or even a treasure hunt. By the end, reading any simple map will feel as easy as reading your own name.", "concepts": [{"heading": "Reading Map Symbols and Legends", "explanation": "A map legend explains what each small picture or symbol on the map stands for, such as a tree, a pond, or a bench. For example, a park map's legend might show a green triangle for a tree, a blue wavy shape for a pond, and a brown rectangle for a bench. Once you know the legend, you can instantly understand what any matching symbol on the map means, wherever it appears.", "trick": {"name": "Legend First", "howto": "Before studying the map itself, always look at the legend first and match each symbol to its meaning in your mind. This way, every time you spot that symbol on the map, you already know exactly what it represents, without guessing.", "example": "A legend shows a blue wavy shape means Pond. Later, you see the same blue wavy shape near grid square C2 on the map. Because you read the legend first, you instantly know there is a pond at C2, without needing a label."}}, {"heading": "Cardinal and Intermediate Directions", "explanation": "The four main directions are North, South, East, and West, and on most maps North is drawn at the top. Between these main directions lie the intermediate directions: North-East, South-East, South-West, and North-West. For example, if a shop lies to the upper-right of your school on a map, its direction from the school is North-East, since upper means North and right means East.", "trick": {"name": "Clock Compass", "howto": "Picture a clock face lying flat on the map: 12 o'clock is North, 3 o'clock is East, 6 o'clock is South, and 9 o'clock is West. When a place moves in two directions together, like east and then south, its overall direction is simply the intermediate direction between them, such as South-East.", "example": "The library is drawn above and to the right of the school on the map. Above means North, and right means East, so combining them, the library lies to the North-East of the school."}}, {"heading": "Giving and Following Directions with Distance", "explanation": "Real directions usually combine a distance and a direction, such as walk 200 metres East and then 100 metres North to reach the shop. Breaking a journey into these clear straight-line steps makes it much easier to follow correctly. This is exactly how treasure hunts and delivery instructions work in real life.", "trick": {"name": "Two-Step Path", "howto": "Split any direction instruction into separate straight segments, and follow only one segment completely before starting the next. Do not try to combine the segments into a single diagonal guess, since that often leads to landing in the wrong place.", "example": "The instruction is Move 3 squares East, then 3 squares South from the Gate at A1. First, move 3 squares East to reach D1. Then, move 3 squares South from D1 to reach D4, completing the path correctly."}}, {"heading": "Grid References: Column and Row", "explanation": "A grid reference names an exact square on a map using a column letter and a row number, like B3. On the park map described here, columns run A to E from left to right, and rows run 1 to 5 from top to bottom, so B3 means the square in column B and row 3. This system lets anyone locate a spot on the map instantly, without needing a long description.", "trick": {"name": "Letter Then Number", "howto": "Always read the column letter first (moving across, like walking down a hallway) and then the row number second (moving down, like climbing stairs). Keeping this order fixed prevents you from mixing up columns and rows.", "example": "To find the location E3, first find column E by counting across from A, then find row 3 by counting down from row 1. Where column E and row 3 meet is the Ice-cream Stall."}}, {"heading": "Understanding Map Scale", "explanation": "A map cannot be drawn the same size as the real place, so it uses a scale, such as 1 cm represents 50 m, to shrink real distances down to fit on paper. This means every centimetre measured on the map stands for 50 real metres on the ground. Knowing the scale lets us turn a small map measurement into a true real-world distance.", "trick": {"name": "Multiply by Scale", "howto": "Measure the distance between two points on the map in centimetres, then multiply that number by the real distance one centimetre represents. This instantly gives the real-world distance without any complicated conversion steps.", "example": "Two points on a map are 6 cm apart, and the scale is 1 cm represents 50 m. Using the trick: 6 times 50 equals 300, so the real distance between the two points is 300 m."}}, {"heading": "Treasure Hunts: Combining Grid, Direction, and Distance", "explanation": "Real-world map problems, like treasure hunts, often combine grid references, directions, and distances all together. For example, a clue might say start at the Gate at A1 and move 2 squares East and 1 square South to find the next clue. Solving this means carefully moving across columns for East or West steps, and down rows for South steps or up for North steps.", "trick": {"name": "Step Counting", "howto": "Count grid squares moved in each direction just like counting steps on a board game: moving East or West changes the column letter, while moving North or South changes the row number. Update the column and the row separately, then combine them for the final square.", "example": "Starting at A1, move 2 squares East (A becomes B, then C) and 1 square South (row 1 becomes row 2). Combining these gives the final location C2, which is the Pond."}}], "mcqs": [{"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. Which grid reference gives the location of the Gate?", "options": ["A1", "C2", "D4", "B5"], "correct": 0, "explain": "The scenario directly states the Gate is at A1. Using the Letter Then Number trick, A is the column and 1 is the row, matching the Gate's stated position."}, {"q": "On a map, North is usually shown at which part of the map?", "options": ["The top", "The bottom", "The right side", "The left side"], "correct": 0, "explain": "By convention, and as stated in the scenario, North is drawn at the top of the map, with South at the bottom, East to the right, and West to the left."}, {"q": "In a grid reference like B3, what does the letter B tell you?", "options": ["The column", "The row", "The direction", "The scale"], "correct": 0, "explain": "Using the Letter Then Number trick, the letter always names the column, and the number that follows names the row. Mixing these up is a very common Class 5 mistake."}, {"q": "A map legend shows a small blue wavy shape labelled Pond. If you see this exact same blue wavy shape somewhere else on the map, what does it most likely show?", "options": ["Another pond", "A tree", "A bench", "A gate"], "correct": 0, "explain": "Using the Legend First trick, the same symbol always stands for the same thing wherever it appears on the map, so another blue wavy shape also marks a pond."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. If you start at the Gate (A1) and move to the Fountain (E1), which direction did you travel, and what real-world distance did you cover?", "options": ["East, 200 m", "South, 200 m", "East, 150 m", "North, 200 m"], "correct": 0, "explain": "Both A1 and E1 are in row 1, and moving from column A to column E is 4 squares to the East. Using Multiply by Scale, 4 squares times 50 m equals 200 m East."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. Moving from the Bench (C4) to the Big Tree (D4) covers 1 square. If each grid square's side represents 50 m, what real distance did you travel?", "options": ["50 m", "100 m", "150 m", "25 m"], "correct": 0, "explain": "C4 and D4 are in the same row, one column apart. Using Multiply by Scale, 1 square times 50 m equals 50 m."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. The Ice-cream Stall is at E3 and the Fountain is at E1. What direction and real distance is it from the Ice-cream Stall to the Fountain?", "options": ["North, 100 m", "South, 100 m", "North, 50 m", "West, 100 m"], "correct": 0, "explain": "Both are in column E, and moving from row 3 to row 1 means moving upward on the map, which is North, across 2 squares. Using Multiply by Scale, 2 times 50 m equals 100 m North."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. Moving from the Gate (A1) to the Pond (C2) means moving 2 squares East and 1 square South. What is the overall direction of this movement?", "options": ["South-East", "North-East", "South-West", "North-West"], "correct": 0, "explain": "Using the Clock Compass trick, moving East and South together gives the intermediate direction South-East."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. Starting at the Gate (A1), a treasure hunt clue says Move 3 squares East, then 3 squares South. Using the grid, at which location do you land, and which park feature is there?", "options": ["D4, the Big Tree", "C4, the Bench", "E3, the Ice-cream Stall", "B5, the Playground"], "correct": 0, "explain": "Using the Step Counting trick, from A1 move East 3 squares (A to D) to reach column D, then South 3 squares (row 1 to row 4) to reach row 4, landing on D4, which is the Big Tree."}, {"q": "A different map uses the scale 1 cm represents 50 m. Two points on this map are 6 cm apart. Using the Multiply by Scale trick, what is the real-world distance between them?", "options": ["300 m", "56 m", "250 m", "12 m"], "correct": 0, "explain": "Using Multiply by Scale, 6 cm times 50 m per cm equals 300 m. Adding 6 and 50 to get 56 wrongly treats the scale like a simple addition instead of a multiplication."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. You are standing at the Playground (B5) and want to reach the Gate (A1). How many squares West and how many squares North must you move?", "options": ["1 West and 4 North", "4 West and 1 North", "1 East and 4 South", "4 East and 1 North"], "correct": 0, "explain": "Using Step Counting, column B to column A is 1 square West, and row 5 to row 1 is 4 squares North (moving up the map). So the answer is 1 West and 4 North."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. Along row 1, there are 3 tree symbols planted evenly between the Gate (A1) and the Fountain (E1), which are 4 squares apart (200 m). Including the Gate and the Fountain as the two ends, the 3 trees split this 200 m stretch into 4 equal gaps. What is the distance between two consecutive trees (or a tree and an end point)?", "options": ["50 m", "66.7 m", "75 m", "40 m"], "correct": 0, "explain": "The 200 m stretch is divided into 4 equal gaps by the Gate, 3 trees, and the Fountain (5 points total, 4 gaps between them). Dividing 200 m by 4 gaps gives 50 m between each consecutive pair."}], "practice": [{"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. What is the grid reference of the Fountain?", "answer": "E1", "solution": "1) Using Letter Then Number, locate the Fountain's column, which is E. 2) Locate its row, which is 1. 3) Combine them to get the grid reference E1, matching the scenario."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. Which park feature is located at grid reference D4?", "answer": "The Big Tree", "solution": "1) Find column D and row 4 on the grid. 2) The scenario states the Big Tree is at D4. 3) So D4 marks the Big Tree."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. If you move from the Gate (A1) to the Bench (C4), how many squares East and how many squares South do you move?", "answer": "2 squares East and 3 squares South", "solution": "1) Using Step Counting, compare columns: A to C is 2 squares East. 2) Compare rows: row 1 to row 4 is 3 squares South. 3) So the movement is 2 East and 3 South."}, {"q": "Using a map scale of 1 cm represents 50 m, two spots on the map are 5 cm apart. Find the real-world distance between them.", "answer": "250 m", "solution": "1) Use the Multiply by Scale trick: real distance equals map distance times scale value. 2) 5 cm times 50 m equals 250 m. 3) The real distance is 250 m."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. Starting at the Ice-cream Stall (E3) and moving to the Bench (C4), find how many squares and in which direction you move for columns, then for rows, and state the overall direction.", "answer": "2 squares West and 1 square South; overall direction South-West", "solution": "1) Compare columns: E to C is 2 squares West. 2) Compare rows: row 3 to row 4 is 1 square South. 3) Using the Clock Compass trick, moving West and South together gives the overall direction South-West."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. A treasure hunt clue says, starting at the Fountain (E1), Move 4 squares West and 3 squares South. Find the final grid location, and state whether any park feature listed is located there.", "answer": "A4; no park feature is marked there", "solution": "1) Using Step Counting, from E1 move West 4 squares: E to D to C to B to A, reaching column A. 2) Move South 3 squares: row 1 to row 4. 3) The final location is A4, and checking the list of features (Gate, Pond, Big Tree, Playground, Ice-cream Stall, Bench, Fountain), none of them is at A4."}, {"q": "A park map is drawn on a grid with columns A to E from left to right and rows 1 to 5 from top to bottom. North is at the top of the map, South is at the bottom, East is to the right, and West is to the left. A location is named by writing its column letter followed by its row number, so B3 means column B and row 3. On this map, the Gate is at A1, the Pond is at C2, the Big Tree is at D4, the Playground is at B5, the Ice-cream Stall is at E3, the Bench is at C4, and the Fountain is at E1. The map's scale is 1 cm represents 50 m, and the side of each grid square on the map is 1 cm. To travel from the Gate (A1) to the Playground (B5) by first moving along the row (East) and then down the column (South), rather than diagonally, you move 1 square East and then 4 squares South. Using the scale 1 cm represents 50 m per square, find the total real-world distance walked along this path.", "answer": "250 m", "solution": "1) The East part is 1 square, which is 1 times 50 m equals 50 m. 2) The South part is 4 squares, which is 4 times 50 m equals 200 m. 3) Adding both parts: 50 m plus 200 m equals 250 m total distance walked."}, {"q": "Five trees are planted evenly in a straight line along a 300 m garden path, with one tree at each end of the path. Find the equal spacing between consecutive trees.", "answer": "75 m", "solution": "1) With 5 trees including both ends, there are 4 equal gaps between them. 2) Divide the total length by the number of gaps: 300 m divided by 4 equals 75 m. 3) So each pair of consecutive trees is 75 m apart."}]}, {"id": "ch15", "number": 15, "title": "Data Through Pictures", "icon": "📊", "tagline": "Turning numbers into pictures that tell a story!", "summary": "Numbers can be hard to compare when they are just written in a list, but pictures and bars make them come alive instantly. In this chapter, you will collect and organise data, then show it using pictographs and bar graphs, just like a scientist tracking rainfall or a coach tracking cricket runs. You will also learn to read these graphs carefully and answer questions about them with confidence.", "concepts": [{"heading": "Collecting and Organising Data", "explanation": "Before drawing any graph, we first collect data by asking questions or counting things, then organise it neatly in a table or with tally marks. For example, if you ask 20 classmates which sport they like best, you can keep a running count using tally marks as each classmate answers. Organising the data this way makes it much easier to turn into a pictograph or bar graph afterward.", "trick": {"name": "Tally and Count", "howto": "While collecting data one item at a time, draw tally marks in groups of five: four straight lines, then a fifth line drawn diagonally across them. This makes the final count fast and easy, since you can simply count the groups of five and add any leftover single marks.", "example": "While asking classmates about their favourite season, Summer gets tally marks grouped as one full group of 5 plus 3 extra marks. Counting quickly: 5 plus 3 equals 8 students who chose Summer."}}, {"heading": "Pictographs and the Key", "explanation": "A pictograph uses repeated picture symbols to show data, where every symbol stands for a fixed number of items given by the key. For example, A pictograph shows the favourite fruit chosen by students in a class, using the key 1 picture represents 5 students. The pictograph shows: Apples = 3 pictures, Mangoes = 5 pictures, Bananas = 2 pictures, and Grapes = 1 picture. Here, the key tells us that each picture is worth 5 students, not just 1 student.", "trick": {"name": "Multiply the Key", "howto": "To find the actual value for any category in a pictograph, count the number of symbols shown for that category and multiply it by the key's value. If you see a half symbol, it represents exactly half of the key's value.", "example": "In the fruit pictograph, Mangoes has 5 pictures and the key is 1 picture equals 5 students. Using the trick: 5 times 5 equals 25, so 25 students chose Mangoes."}}, {"heading": "Reading Bar Graphs and Their Scale", "explanation": "A bar graph shows data using bars of different heights, where taller bars mean bigger values. The vertical axis is marked with a scale that tells us what each box or gridline stands for, such as each box representing 2 cm of rainfall. For example, A bar graph shows the rainfall recorded each month. The vertical axis is marked in equal boxes, and each box represents 2 cm of rainfall. The bar for June rises 4 boxes, the bar for July rises 7 boxes, the bar for August rises 5 boxes, and the bar for September rises 2 boxes.", "trick": {"name": "Read the Scale First", "howto": "Before reading any bar's value, first check what one box on the vertical axis actually represents. Then count how many boxes tall the bar is, and multiply that count by the scale value to get the true value.", "example": "In the rainfall graph, July's bar rises 7 boxes, and each box represents 2 cm. Using the trick: 7 times 2 equals 14, so July recorded 14 cm of rainfall, not just 7 cm."}}, {"heading": "Comparing Categories: Highest, Lowest, and Difference", "explanation": "Graphs make it easy to compare categories at a glance, such as spotting which fruit was chosen most or which month had the least rain. For example, in the fruit pictograph, Mangoes with 5 pictures is the tallest count, so it is the most popular fruit, while Grapes with just 1 picture is the least popular. Finding the difference between two categories means calculating their actual values first, then subtracting.", "trick": {"name": "Tallest and Shortest", "howto": "To quickly find the highest or lowest category, just scan for the bar with the most boxes or the picture row with the most symbols, and the one with the fewest. You do not need to calculate every single value first, just to spot the biggest and smallest.", "example": "In the fruit pictograph, scanning the picture counts (3, 5, 2, 1), Mangoes has the most pictures (5) so it is the highest, and Grapes has the fewest pictures (1) so it is the lowest, without calculating actual student numbers first."}}, {"heading": "Finding Totals From a Graph", "explanation": "Sometimes a question asks for the total across all categories shown in a graph, such as how many students were surveyed altogether. To find this, calculate the actual value of every category first (using the key or scale), and then add all those values together. For example, adding the rainfall for June, July, August, and September gives the total rainfall over the four months.", "trick": {"name": "Add Them All", "howto": "First convert every category's symbol count or bar height into its real value using the key or scale, and only then add all the real values together. Adding the raw symbol counts or box counts without applying the key first gives a wrong total.", "example": "In the rainfall graph, the real values are June 8 cm, July 14 cm, August 10 cm, and September 4 cm. Adding these: 8 plus 14 plus 10 plus 4 equals 36 cm of total rainfall over the four months."}}, {"heading": "Constructing a Pictograph From Raw Data", "explanation": "To build your own pictograph from a list of numbers, you first choose a sensible key value, then work out how many symbols each category needs. For example, Rohan's runs scored in 5 cricket matches were: Match 1 = 20 runs, Match 2 = 30 runs, Match 3 = 10 runs, Match 4 = 25 runs, and Match 5 = 15 runs. If we choose the key 1 bat picture represents 10 runs, we can turn each match's runs into a certain number of bat pictures, including half pictures when needed.", "trick": {"name": "Round to the Key", "howto": "To decide how many symbols to draw for a category, divide its actual value by the key's value. If the result is not a whole number, draw a half symbol for an exact half, or round sensibly if the numbers do not divide evenly.", "example": "Match 4 in Rohan's data is 25 runs, and the key is 1 picture equals 10 runs. Dividing: 25 divided by 10 equals 2.5, so we draw 2 full bat pictures plus one half bat picture for Match 4."}}], "mcqs": [{"q": "A pictograph shows the favourite fruit chosen by students in a class, using the key 1 picture represents 5 students. The pictograph shows: Apples = 3 pictures, Mangoes = 5 pictures, Bananas = 2 pictures, and Grapes = 1 picture. How many students chose Mangoes?", "options": ["25", "5", "10", "20"], "correct": 0, "explain": "Using the Multiply the Key trick, Mangoes has 5 pictures and each picture equals 5 students: 5 times 5 equals 25 students. Choosing 5 forgets to multiply by the key value."}, {"q": "In a pictograph, the key says 1 symbol represents 4 items, and a category shows 6 symbols. How many items does that category represent?", "options": ["24", "10", "6", "4"], "correct": 0, "explain": "Using Multiply the Key, 6 symbols times 4 items per symbol equals 24 items. Choosing 10 wrongly adds the symbol count and the key value instead of multiplying them."}, {"q": "Which tool is most useful for keeping a running count while collecting data from classmates one by one?", "options": ["Tally marks", "A finished pictograph", "A finished bar graph", "A pie chart"], "correct": 0, "explain": "The Tally and Count trick uses tally marks precisely because they can be added quickly, one at a time, while data is still being collected, before it is turned into a graph."}, {"q": "In a bar graph, what does the height of each bar represent?", "options": ["The value or amount for that category", "The name of the category", "The colour used for the bar", "The width of the bar"], "correct": 0, "explain": "A bar's height, read using the axis scale, shows the value for its category. The bar's name, colour, or width do not carry the numerical information."}, {"q": "A bar graph shows the rainfall recorded each month. The vertical axis is marked in equal boxes, and each box represents 2 cm of rainfall. The bar for June rises 4 boxes, the bar for July rises 7 boxes, the bar for August rises 5 boxes, and the bar for September rises 2 boxes. How many centimetres of rain fell in August?", "options": ["10 cm", "5 cm", "12 cm", "8 cm"], "correct": 0, "explain": "Using Read the Scale First, August's bar rises 5 boxes, and each box equals 2 cm: 5 times 2 equals 10 cm. Choosing 5 cm forgets to apply the scale and just reads the box count directly."}, {"q": "A bar graph shows the rainfall recorded each month. The vertical axis is marked in equal boxes, and each box represents 2 cm of rainfall. The bar for June rises 4 boxes, the bar for July rises 7 boxes, the bar for August rises 5 boxes, and the bar for September rises 2 boxes. Which month recorded the least rainfall?", "options": ["September", "June", "July", "August"], "correct": 0, "explain": "Using the Tallest and Shortest trick, September's bar has the fewest boxes (2), so once the scale is applied (2 times 2 equals 4 cm), it is clearly the smallest value among the four months."}, {"q": "A pictograph shows the favourite fruit chosen by students in a class, using the key 1 picture represents 5 students. The pictograph shows: Apples = 3 pictures, Mangoes = 5 pictures, Bananas = 2 pictures, and Grapes = 1 picture. What is the difference between the number of students who chose Mangoes and those who chose Bananas?", "options": ["15", "5", "10", "3"], "correct": 0, "explain": "Using Multiply the Key, Mangoes is 5 times 5 equals 25 students, and Bananas is 2 times 5 equals 10 students. The difference is 25 minus 10, which equals 15."}, {"q": "A pictograph shows the favourite fruit chosen by students in a class, using the key 1 picture represents 5 students. The pictograph shows: Apples = 3 pictures, Mangoes = 5 pictures, Bananas = 2 pictures, and Grapes = 1 picture. How many students in total were surveyed for this pictograph?", "options": ["55", "50", "45", "60"], "correct": 0, "explain": "Using Add Them All, first find each real value: Apples 15, Mangoes 25, Bananas 10, Grapes 5. Adding these gives 15 plus 25 plus 10 plus 5 equals 55 students in total."}, {"q": "Rohan's runs scored in 5 cricket matches were: Match 1 = 20 runs, Match 2 = 30 runs, Match 3 = 10 runs, Match 4 = 25 runs, and Match 5 = 15 runs. If a pictograph is made using the key 1 bat picture represents 10 runs, how many bat pictures (including any half pictures) should be drawn for Match 4?", "options": ["2 and a half pictures", "2 pictures", "3 pictures", "1 and a half pictures"], "correct": 0, "explain": "Using Round to the Key, Match 4 has 25 runs, and 25 divided by 10 equals 2.5, so the pictograph needs 2 full pictures plus one half picture."}, {"q": "Rohan's runs scored in 5 cricket matches were: Match 1 = 20 runs, Match 2 = 30 runs, Match 3 = 10 runs, Match 4 = 25 runs, and Match 5 = 15 runs. Using the key 1 picture represents 10 runs, what is Rohan's total runs across all 5 matches, and how many total pictures (including half pictures) would that need on the pictograph?", "options": ["100 runs and 10 pictures", "100 runs and 9 pictures", "90 runs and 9 pictures", "100 runs and 8 pictures"], "correct": 0, "explain": "Using Add Them All, total runs equal 20 plus 30 plus 10 plus 25 plus 15, which is 100 runs. Using Round to the Key, 100 divided by 10 equals 10 pictures in total."}, {"q": "A bar graph shows the rainfall recorded each month. The vertical axis is marked in equal boxes, and each box represents 2 cm of rainfall. The bar for June rises 4 boxes, the bar for July rises 7 boxes, the bar for August rises 5 boxes, and the bar for September rises 2 boxes. What is the total rainfall recorded over these four months?", "options": ["36 cm", "18 cm", "32 cm", "40 cm"], "correct": 0, "explain": "Using Read the Scale First and then Add Them All: the real values are June 8 cm, July 14 cm, August 10 cm, September 4 cm. Adding them: 8 plus 14 plus 10 plus 4 equals 36 cm."}, {"q": "A bar graph shows the rainfall recorded each month. The vertical axis is marked in equal boxes, and each box represents 2 cm of rainfall. The bar for June rises 4 boxes, the bar for July rises 7 boxes, the bar for August rises 5 boxes, and the bar for September rises 2 boxes. A student mistakenly reads the bar heights directly as centimetres without applying the scale, and says July had 7 cm more rainfall than September. Is this correct, and what is the actual correct difference in centimetres?", "options": ["Incorrect; the actual difference is 10 cm", "Correct as stated", "Incorrect; the actual difference is 5 cm", "Incorrect; the actual difference is 14 cm"], "correct": 0, "explain": "Using Read the Scale First, July's real value is 7 times 2 equals 14 cm, and September's real value is 2 times 2 equals 4 cm. The correct difference is 14 minus 4, which equals 10 cm, not 7 cm, showing why the scale must always be applied before comparing."}], "practice": [{"q": "A pictograph shows pets owned by students, using the key 1 picture represents 2 pets. It shows: Dogs = 4 pictures, Cats = 3 pictures, Fish = 5 pictures. How many fish are owned in total?", "answer": "10 fish", "solution": "1) Use Multiply the Key: real value equals number of pictures times the key value. 2) Fish has 5 pictures, so 5 times 2 equals 10. 3) There are 10 fish in total."}, {"q": "In a bar graph, each box on the vertical axis represents 3 marks. A student's bar for a spelling test rises 4 boxes. What score did the student get?", "answer": "12 marks", "solution": "1) Use Read the Scale First: real value equals number of boxes times scale value. 2) 4 boxes times 3 marks equals 12. 3) The student scored 12 marks."}, {"q": "A survey of 24 students' favourite seasons is recorded with tally marks: Summer has 8 students, Winter has 10 students, and Monsoon has 6 students. Check whether these numbers add up to the total of 24 students surveyed.", "answer": "Yes, they add up to 24", "solution": "1) Use Add Them All: add every category's value. 2) 8 plus 10 plus 6 equals 24. 3) This matches the stated total of 24 students, so the tally counts are consistent."}, {"q": "A pictograph shows the favourite fruit chosen by students in a class, using the key 1 picture represents 5 students. The pictograph shows: Apples = 3 pictures, Mangoes = 5 pictures, Bananas = 2 pictures, and Grapes = 1 picture. Which fruit is the least popular, and by how many students is it less popular than Apples?", "answer": "Grapes is least popular, 10 fewer students than Apples", "solution": "1) Using Tallest and Shortest, Grapes has the fewest pictures (1), so it is least popular, equal to 1 times 5 equals 5 students. 2) Apples has 3 pictures, equal to 3 times 5 equals 15 students. 3) The difference is 15 minus 5, which equals 10 students."}, {"q": "A bar graph shows the rainfall recorded each month. The vertical axis is marked in equal boxes, and each box represents 2 cm of rainfall. The bar for June rises 4 boxes, the bar for July rises 7 boxes, the bar for August rises 5 boxes, and the bar for September rises 2 boxes. Which month had the highest rainfall, and what was its value in centimetres?", "answer": "July, 14 cm", "solution": "1) Using Tallest and Shortest, July's bar has the most boxes (7), so it is the highest. 2) Using Read the Scale First, 7 boxes times 2 cm equals 14 cm. 3) July recorded the highest rainfall at 14 cm."}, {"q": "Rohan's runs scored in 5 cricket matches were: Match 1 = 20 runs, Match 2 = 30 runs, Match 3 = 10 runs, Match 4 = 25 runs, and Match 5 = 15 runs. Construct a pictograph using the key 1 bat picture represents 10 runs, stating how many pictures (including any half pictures) go with each match.", "answer": "Match 1: 2 pictures, Match 2: 3 pictures, Match 3: 1 picture, Match 4: 2 and a half pictures, Match 5: 1 and a half pictures", "solution": "1) Use Round to the Key: divide each match's runs by 10. 2) Match 1: 20 divided by 10 equals 2. Match 2: 30 divided by 10 equals 3. Match 3: 10 divided by 10 equals 1. Match 4: 25 divided by 10 equals 2.5. Match 5: 15 divided by 10 equals 1.5. 3) So the pictures are 2, 3, 1, 2 and a half, and 1 and a half."}, {"q": "The fruit pictograph (Apples 3 pictures, Mangoes 5 pictures, Bananas 2 pictures, Grapes 1 picture; key 1 picture equals 5 students) uses a total number of pictures. Rohan's cricket pictograph (key 1 picture equals 10 runs) needs 10 pictures for his total of 100 runs. Someone claims both pictographs used the same number of pictures. Check if this is true.", "answer": "False; the fruit pictograph used 11 pictures while the cricket pictograph used 10 pictures", "solution": "1) Add the fruit pictograph's picture counts: 3 plus 5 plus 2 plus 1 equals 11 pictures. 2) The cricket pictograph uses 10 pictures, as given. 3) Since 11 is not equal to 10, the claim is false."}, {"q": "A bar graph shows the rainfall recorded each month. The vertical axis is marked in equal boxes, and each box represents 2 cm of rainfall. The bar for June rises 4 boxes, the bar for July rises 7 boxes, the bar for August rises 5 boxes, and the bar for September rises 2 boxes. Find the total rainfall over the four months, and then find the average monthly rainfall.", "answer": "Total 36 cm, average 9 cm", "solution": "1) Using Read the Scale First and Add Them All, the real values are 8, 14, 10, and 4 cm, adding to 36 cm total. 2) To find the average, divide the total by the number of months: 36 divided by 4 equals 9. 3) The average monthly rainfall is 9 cm."}]}], "science": [{"id": "ch1", "number": 1, "title": "Water – The Essence of Life", "icon": "💧", "tagline": "Discover water's amazing journey from ice to steam!", "summary": "Water is all around us and inside us too. In this chapter we will discover how water changes into ice, liquid water and steam, how it travels through the water cycle, and why we must never waste a single drop. Let us explore water like curious little scientists.", "concepts": [{"heading": "Three States of Water", "explanation": "Water can be solid, liquid or gas. Ice cubes in your fridge are solid water, the water you drink from a glass is liquid, and the steam rising from a hot cup of tea is water as a gas called water vapour. The same water changes its state when it gets hotter or colder.", "trick": {"name": "ILS Ladder (Ice-Liquid-Steam)", "howto": "Picture a ladder with three steps. The bottom step is Ice, cold and hard. The middle step is Liquid water, cool and flowing. The top step is Steam, hot and floating away. Heat pushes water up the ladder, and cooling brings it back down.", "example": "If a question asks what happens when ice is heated, picture the ladder: heat pushes it up from Ice to Liquid, so heated ice becomes liquid water."}}, {"heading": "The Water Cycle", "explanation": "The sun heats water in rivers, ponds and oceans, turning it into invisible water vapour that rises into the sky. This is called evaporation. Up in the cool sky, the vapour turns back into tiny water droplets and forms clouds, which is called condensation. When the droplets become heavy, they fall back to earth as rain, called precipitation.", "trick": {"name": "Up, Cool, Drop", "howto": "Remember three simple words in order: Up (evaporation, water rises as vapour), Cool (condensation, vapour cools into clouds), Drop (precipitation, rain falls down). Say Up-Cool-Drop like a little rhyme and you will never forget the order of the water cycle.", "example": "If asked what comes right after evaporation, use Up-Cool-Drop: after Up comes Cool, so the answer is condensation."}}, {"heading": "Fresh Water and Salt Water", "explanation": "Most of the water we drink and use comes from fresh water sources like rain, rivers, lakes, ponds, glaciers and wells. The oceans and seas hold salt water, which is too salty for us to drink or water our plants. The Ganga river gives fresh water to many villages and cities along its banks.", "trick": {"name": "Salty Sea, Sweet River", "howto": "Think of the sea as wearing a salty crown, S for Sea and S for Salty. Rivers, ponds and rain do not wear that S crown, so they are fresh and sweet enough to drink.", "example": "If a question asks which is a source of salt water, remember Salty Sea: the ocean wears the salty crown, so oceans and seas are the answer, not rivers or ponds."}}, {"heading": "Water's Special Tricks", "explanation": "Water soaks quickly into things like soil, sand and a cloth towel because they have tiny gaps that pull water in. But water cannot soak into a waxy leaf or an oily surface, so it forms round beads and rolls off instead. This is why raindrops slide off a shiny leaf.", "trick": {"name": "Soak or Roll", "howto": "Ask yourself, does the surface drink water or does it shrug it off? Cloth and soil are thirsty, they soak. Wax and oil are not thirsty, they make water roll into beads. Picture a raincoat, water never soaks into a raincoat, it simply rolls off.", "example": "If asked why water beads up on a lotus leaf, use Soak or Roll: a waxy leaf is not thirsty, so water rolls off in beads instead of soaking in."}}, {"heading": "Water and Living Things", "explanation": "Plants and animals need water to stay alive, just like we do. A small pond near a village can be a home for fish, frogs and water plants, all connected in a simple food chain where water plants feed small fish, and small fish feed bigger fish or birds. Without water, this whole pond community would disappear.", "trick": {"name": "Pond Food Train", "howto": "Imagine a toy train with three bogies moving in one line: the first bogie is Sunlight and Water Plants, the second bogie is Small Fish, and the third bogie is Bigger Fish or Birds. Each bogie feeds the next one, just like a food chain.", "example": "If asked what a small fish in a pond eats, follow the Pond Food Train: the bogie before small fish is water plants, so small fish eat tiny water plants."}}, {"heading": "Saving Every Drop", "explanation": "Water is precious, so we must not waste it by leaving taps running. Rainwater harvesting means collecting rain from rooftops in tanks or letting it soak into the ground, which helps recharge groundwater, the water stored under the earth that fills our wells. Simple habits like turning off taps and fixing leaks save a lot of water.", "trick": {"name": "Catch the Rain", "howto": "Picture cupping your hands to catch falling rain instead of letting it run away on the road. That cupped-hands picture is rainwater harvesting, catching rain so it can be used later or soak underground to fill up wells.", "example": "If asked why rainwater harvesting is useful, use Catch the Rain: cupped hands save rain instead of wasting it, so harvesting saves water and refills groundwater."}}], "mcqs": [{"q": "Which of these is water in its solid state?", "options": ["Steam", "Ice", "Rain", "River water"], "correct": 1, "explain": "Ice is solid water. Remember the ILS Ladder: Ice is the cold, hard bottom step."}, {"q": "What do we call water vapour cooling down and turning into clouds?", "options": ["Evaporation", "Condensation", "Precipitation", "Pollution"], "correct": 1, "explain": "Using Up-Cool-Drop, the cooling of vapour into clouds is the Cool step, called condensation."}, {"q": "Which of these is a source of fresh water?", "options": ["Ocean", "Sea", "Pond", "Salt lake"], "correct": 2, "explain": "Using the Salty Sea, Sweet River trick, a pond does not wear the salty crown, so it is a fresh water source."}, {"q": "What happens when rain falls on a cotton cloth towel?", "options": ["It rolls off in beads", "It soaks into the towel", "It turns to ice", "It disappears instantly"], "correct": 1, "explain": "Using the Soak or Roll trick, cloth is thirsty and has tiny gaps, so water soaks into it."}, {"q": "A cup of hot tea is left on a table and steam rises from it. What is happening to the water in the tea?", "options": ["It is condensing", "It is evaporating", "It is freezing", "It is precipitating"], "correct": 1, "explain": "Heat is turning liquid tea into vapour that rises, which is the Up step, evaporation, from the Up-Cool-Drop trick."}, {"q": "Which trick helps you remember the correct order of the water cycle steps?", "options": ["Soak or Roll", "Pond Food Train", "Up, Cool, Drop", "ILS Ladder"], "correct": 2, "explain": "Up, Cool, Drop stands for evaporation, condensation and precipitation, in that exact order."}, {"q": "Why does water bead up and roll off a waxy leaf instead of soaking in?", "options": ["The leaf is thirsty like cloth", "The leaf's waxy surface is not thirsty", "The water on the leaf is frozen", "The leaf absorbs vapour instead"], "correct": 1, "explain": "Using Soak or Roll, a waxy surface is not thirsty, so it cannot pull water in, and the water rolls off in beads."}, {"q": "In a small pond, what do small fish usually eat, according to a simple food chain?", "options": ["Bigger fish", "Water birds", "Water plants", "Frogs"], "correct": 2, "explain": "Using the Pond Food Train, the bogie right before small fish is water plants, so small fish eat water plants."}, {"q": "Ramesh sees an ice cube melt into water, and later that water disappears from an open glass left in the sun. What two changes of state did the water go through, in order?", "options": ["Gas to liquid, then liquid to solid", "Solid to liquid, then liquid to gas", "Liquid to gas, then gas to solid", "Solid to gas, then gas to liquid"], "correct": 1, "explain": "Using the ILS Ladder, melting ice is Solid to Liquid, and disappearing in the sun is Liquid to Gas (evaporation), so the water climbed two steps up the ladder."}, {"q": "Which statement correctly compares river water and sea water?", "options": ["Both are salty and cannot be used for drinking", "River water is fresh and can be used for drinking, sea water is salty", "Sea water is fresh, river water is salty", "Both are exactly the same"], "correct": 1, "explain": "Using Salty Sea, Sweet River, the sea wears the salty crown while the river does not, so river water is fresh and drinkable while sea water is salty."}, {"q": "A farmer collects rooftop rain in a tank during the monsoon and also lets some rain soak into the ground near his well. What benefit does this give him?", "options": ["Only drinking water, with no effect on the well", "It wastes water since it does not reach the sea", "It saves water in the tank and also recharges groundwater, so the well has more water", "It causes floods in his field"], "correct": 2, "explain": "Using Catch the Rain, harvested rainwater is stored for later use, and rain that soaks into the ground recharges the groundwater that fills the well."}, {"q": "Which of these best explains why raindrops on a lotus leaf look like shiny silver beads instead of soaking into the leaf?", "options": ["Lotus leaves are always wet already", "Lotus leaves have a waxy surface that water cannot soak into, so it forms beads", "Lotus leaves absorb water instantly, leaving beads behind", "The raindrops on lotus leaves are actually ice"], "correct": 1, "explain": "Using Soak or Roll, a lotus leaf's waxy surface is not thirsty, so raindrops cannot soak in and instead form rolling beads."}], "practice": [{"q": "Name the three states of water and give one everyday example of each.", "answer": "Solid - ice; Liquid - water; Gas - steam or water vapour", "solution": "1) Remember the ILS Ladder: Ice at the bottom, Liquid in the middle, Steam at the top. 2) Ice is the solid state, seen in ice cubes in a fridge. 3) Liquid is the water we drink from a glass. 4) Steam, or water vapour, is the gas state, seen rising from a hot cup of tea."}, {"q": "Fill in the blank: When the sun heats water in a pond and it rises into the sky as invisible vapour, this step is called ____.", "answer": "Evaporation", "solution": "1) Use the Up-Cool-Drop trick. 2) The very first step, water rising up as vapour because of the sun's heat, is called Up. 3) The scientific name for the Up step is evaporation."}, {"q": "Ravi pours water on a cloth towel and also on a waxy raincoat. What will happen in each case, and why?", "answer": "Water soaks into the towel, but rolls off the raincoat in beads.", "solution": "1) Use the Soak or Roll trick. 2) A cloth towel has tiny gaps that pull water in, so it soaks in. 3) A waxy raincoat has no such gaps and is not thirsty, so water forms beads and rolls off instead."}, {"q": "Sort these into salt water and fresh water sources: ocean, river, sea, pond, lake, glacier.", "answer": "Salt water: ocean, sea. Fresh water: river, pond, lake, glacier.", "solution": "1) Use the Salty Sea, Sweet River trick, picturing the salty S crown on the words Sea and Ocean. 2) Ocean and sea both wear that salty crown, so they are salt water. 3) River, pond, lake and glacier do not wear the salty crown, so they are all fresh water sources."}, {"q": "Explain, in order, the three main steps of the water cycle using the words evaporation, condensation and precipitation.", "answer": "Evaporation, then condensation, then precipitation.", "solution": "1) Use Up-Cool-Drop. 2) Up: water evaporates from oceans, rivers and ponds into invisible vapour because of the sun's heat. 3) Cool: the vapour cools high in the sky and condenses into tiny droplets that form clouds. 4) Drop: the droplets become heavy and fall as rain, which is precipitation."}, {"q": "In a small pond near a village, sunlight helps water plants grow, small fish eat the water plants, and a heron eats the small fish. Write this food chain in words, in the correct order.", "answer": "Water plants, then small fish, then heron.", "solution": "1) Use the Pond Food Train trick, three bogies moving in one line. 2) The first bogie is sunlight and water plants, since plants make their own food. 3) The second bogie is small fish, which eat the water plants. 4) The third bogie is the heron, which eats the small fish, completing the food chain."}, {"q": "A family wants to save water in their home during summer. Suggest two ways they can do this, and explain how rainwater harvesting helps refill their well.", "answer": "Turn off taps when not needed and fix leaking pipes; rainwater harvesting collects rain and lets it soak into the ground to recharge groundwater in the well.", "solution": "1) First, simple habits like turning off running taps and fixing leaky pipes stop water from being wasted. 2) Use the Catch the Rain trick, picturing cupped hands catching rain instead of letting it run away. 3) Rainwater harvesting collects rooftop rain in tanks or lets it soak into the soil. 4) This soaking water recharges the groundwater, meaning it fills up the underground water that feeds the family's well."}, {"q": "Meena sees mist forming on the outside of a cold glass of juice on a hot day. Using what you know about the water cycle, explain why this happens, and name the process.", "answer": "Water vapour in the warm air touches the cold glass and condenses into tiny droplets; this is condensation.", "solution": "1) Use the Up-Cool-Drop trick. 2) The air around the glass has invisible water vapour floating in it. 3) When this warm vapour touches the cold glass, it cools down suddenly, which is the Cool step. 4) The cooled vapour turns back into tiny liquid droplets on the glass, and this process is called condensation, the same process that forms clouds in the sky."}]}, {"id": "ch2", "number": 2, "title": "Journey of a River", "icon": "🏞️", "tagline": "Follow a river's exciting trip from hill to sea!", "summary": "Rivers are like long, flowing roads of water that travel from high mountains all the way to the sea. In this chapter we will follow a river's exciting journey, learn how people depend on rivers every day, and discover how we can keep our rivers clean and safe from floods. Get ready to travel along with the river!", "concepts": [{"heading": "Where a River is Born", "explanation": "Every river starts its journey at a place called its source, which is often a melting glacier high in the mountains or a spring on a hill. From there, the river flows downhill, becoming wider and stronger as it travels through valleys and plains. The famous Ganga river begins at the Gangotri glacier in the Himalayas.", "trick": {"name": "Born on Top", "howto": "Picture a river as a baby born high up on a snowy mountain, then growing up and walking down the hill as it travels. Remember Born on Top: a river's source, its birthplace, is almost always high up, on a glacier or a hill, never at the bottom.", "example": "If asked where a river usually begins, use Born on Top: rivers are born high up in mountains or hills, at their source."}}, {"heading": "Tributaries – Helper Rivers Join In", "explanation": "As a big river flows along, smaller rivers and streams often join it along the way. These smaller rivers are called tributaries. The Godavari river, which begins near Trimbakeshwar in Maharashtra, is joined by many tributaries like the Manjira and the Indravati before it reaches the Bay of Bengal.", "trick": {"name": "Friends Joining the Trip", "howto": "Picture the main river as a big group of friends walking together on a school trip, and each tributary is a new friend joining the group along the way, making the group bigger and stronger. The more friends, or tributaries, that join in, the wider and more powerful the main river becomes.", "example": "If asked what a tributary is, use Friends Joining the Trip: a tributary is a smaller river that joins a bigger main river, adding more water to it."}}, {"heading": "The River's Mouth – Meeting the Sea", "explanation": "After its long journey, a river finally reaches the place where it meets the sea, called its mouth. Here, the river often splits into many small streams and drops mud and sand, forming a fan-shaped land called a delta. The Godavari and Ganga rivers both form deltas where they meet the Bay of Bengal.", "trick": {"name": "River's Goodbye Wave", "howto": "Imagine the river reaching the seaside and waving goodbye with many fingers spreading out, that spreading pattern of little streams and mud is the delta at the river's mouth. Many large rivers form this fan shape right where they say goodbye to the land and meet the sea.", "example": "If asked what is formed where a river meets the sea and drops mud, use River's Goodbye Wave: the spreading, finger-like land is called a delta, found at the river's mouth."}}, {"heading": "Rivers Help People Every Day", "explanation": "People living near rivers depend on them for drinking water, cooking, bathing and washing clothes. Farmers use river water to irrigate, or water, their crops and animals, and fishermen catch fish from the river to sell and eat. Rivers are also used for boating, transport, and to run factories.", "trick": {"name": "DCFI Helpers", "howto": "Remember four letters: D for Drinking and cooking, C for Cleaning, like bathing and washing, F for Farming, watering crops and animals, and I for Industry, meaning factories, boats and transport. Say D-C-F-I like a little code to recall the main ways people use river water.", "example": "If asked how farmers use a river, use DCFI: the F stands for Farming, so farmers use river water to irrigate their crops."}}, {"heading": "River Pollution – A River in Trouble", "explanation": "When people throw plastic waste and chemicals into a river, or when fertiliser from farms washes into the water after rain, the river becomes polluted, meaning dirty and harmful. Pollution can hurt fish and water plants, and make the water unsafe for people to drink or use. Keeping rivers clean protects all the living things that depend on them.", "trick": {"name": "PCF Trouble Signs", "howto": "Remember three troublemakers using PCF: P for Plastic waste, C for Chemicals from factories, and F for Fertiliser runoff from farms. Picture these three troublemakers jumping into a clean river and turning it murky, that murky picture reminds you these three things cause river pollution.", "example": "If asked what harms fish in a polluted river, use PCF Trouble Signs: plastic, chemicals and fertiliser runoff are the main troublemakers that pollute rivers and hurt fish."}}, {"heading": "Dams and Floods", "explanation": "A dam is a strong wall built across a river to store water in a large reservoir, which helps with irrigation, making electricity, and controlling floods. Floods happen when a river gets too much water, often from very heavy rain, and the water spills over its banks onto the land. During a flood, it is important to move to higher, safer ground and listen to elders and warnings.", "trick": {"name": "Dam the Friend, Flood the Visitor", "howto": "Picture a dam as a helpful friend holding back extra water safely behind a wall, giving it out slowly for irrigation and electricity. Picture a flood as an unexpected, unwelcome visitor who arrives suddenly with too much water after heavy rain, so when this visitor arrives, always move to higher ground for safety.", "example": "If asked why dams are built on rivers, use Dam the Friend: a dam helps by storing water for irrigation, generating electricity, and controlling floods."}}], "mcqs": [{"q": "A river's source, its starting point, is usually found:", "options": ["In the deep sea", "High up in mountains or hills", "Inside a factory", "In a big city"], "correct": 1, "explain": "Using the Born on Top trick, a river's source is almost always high up, on a glacier or hill."}, {"q": "What do we call a smaller river that joins a bigger main river?", "options": ["A delta", "A mouth", "A tributary", "A source"], "correct": 2, "explain": "Using Friends Joining the Trip, a smaller river that joins the main river is called a tributary."}, {"q": "The place where a river meets the sea is called its:", "options": ["Source", "Mouth", "Tributary", "Bank"], "correct": 1, "explain": "Using River's Goodbye Wave, the spot where a river meets the sea, and often forms a delta, is called its mouth."}, {"q": "Which of these is NOT a way people use river water?", "options": ["Drinking and cooking", "Watering crops", "Making the moon rise", "Boating and transport"], "correct": 2, "explain": "Using the DCFI Helpers trick, rivers help with Drinking, Cleaning, Farming and Industry, but they have nothing to do with the moon rising."}, {"q": "The Godavari river begins near Trimbakeshwar in which state, before flowing on to meet the Bay of Bengal?", "options": ["Kerala", "Maharashtra", "Punjab", "West Bengal"], "correct": 1, "explain": "The Godavari's source is near Trimbakeshwar in the Western Ghats of Maharashtra, matching the Born on Top trick for river sources in hills."}, {"q": "What is formed when a river spreads into many streams and drops mud where it meets the sea?", "options": ["A glacier", "A tributary", "A delta", "A dam"], "correct": 2, "explain": "Using River's Goodbye Wave, the fan-shaped, spreading land formed at a river's mouth is called a delta."}, {"q": "According to the PCF Trouble Signs trick, which three things commonly pollute rivers?", "options": ["Rainwater, sunlight, sand", "Plastic waste, chemicals, fertiliser runoff", "Fish, frogs, water plants", "Boats, bridges, dams"], "correct": 1, "explain": "PCF stands for Plastic, Chemicals and Fertiliser runoff, the three main troublemakers that pollute rivers."}, {"q": "Why are dams built across rivers?", "options": ["To make the river disappear", "To store water for irrigation, electricity and flood control", "To stop fish from swimming", "To make the river water salty"], "correct": 1, "explain": "Using Dam the Friend, a dam is a helpful friend that stores water for irrigation, electricity and controlling floods."}, {"q": "A village downstream of a factory that dumps chemicals into the river notices fewer fish and cloudy water. What is the most likely reason?", "options": ["The river has reached its mouth", "A dam was built far upstream", "River pollution from the factory's chemicals is harming the fish and water", "The river found a new tributary"], "correct": 2, "explain": "Using PCF Trouble Signs, chemicals dumped into a river are a well-known troublemaker that pollutes water and harms fish."}, {"q": "A river begins at a glacier in the Himalayas, and later, before reaching the sea, spreads into many streams with mud deposits. Which two river features does this describe, in the order mentioned?", "options": ["Tributary, then source", "Source, then delta", "Mouth, then dam", "Delta, then source"], "correct": 1, "explain": "The glacier is the river's Born on Top source, and the spreading streams with mud at the end describe the River's Goodbye Wave delta, matching the order mentioned."}, {"q": "During heavy monsoon rain, a river's water rises quickly and overflows its banks, flooding nearby fields. Which action would BEST help control such flooding in the future?", "options": ["Removing all the river's tributaries",
