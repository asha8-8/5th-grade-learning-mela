ion?", "answer": "It also fell down as if it were dead.", "solution": "1) Use the Copy Cat, Fly Free trick. 2) Recall that the pet parrot copied the exact same reaction on purpose. 3) So the answer is that it fell down as if dead too."}, {"q": "How did the pet parrot finally escape the golden cage?", "answer": "The merchant, thinking it was dead, placed it outside on the windowsill, and it flew away.", "solution": "1) Use the Copy Cat, Fly Free trick to connect the fake death to the escape. 2) The merchant, believing his parrot had died, placed its still body outside. 3) The parrot then came alive and flew off to freedom."}, {"q": "Write one sentence about the parrot using the present perfect tense.", "answer": "The parrot has flown away to the forest.", "solution": "1) Use the HAS or HAVE Plus Third Form trick. 2) Choose has because parrot is singular, and add the third form of fly, which is flown. 3) This gives the sentence, the parrot has flown away to the forest."}, {"q": "What is the moral of the story The Wise Parrot?", "answer": "Freedom is more precious than comfort, and cleverness can help you get it.", "solution": "1) Use the Golden Cage, Still A Cage trick to recall that comfort alone did not make the parrot happy. 2) Use Copy Cat, Fly Free to recall how cleverly it won its freedom. 3) Together these show the moral that freedom is more precious than comfort, and wisdom can help achieve it."}]}, {"id": "ch5", "number": 5, "title": "The Frog", "icon": "🐸", "tagline": "Hop through a frog's splashy life story!", "summary": "This poem is told by a frog itself, sharing how it grew from a tiny tadpole into a hopping, swimming, croaking frog. You will read about its watery home, its quick tongue, and how it stays safe from danger. Along the way we also learn small joining words like and, but, because and or that help us make longer, smarter sentences.", "concepts": [{"heading": "From Tadpole to Frog", "explanation": "A baby frog is called a tadpole. A tadpole looks like a tiny fish and swims in water. Slowly it grows legs and changes into a full grown frog. This change is part of the frog's life story in the poem.", "trick": {"name": "Tiny Fish Trick", "howto": "The word tadpole starts with tad, which sounds like a tad bit, meaning something very small. So picture a tiny, fish shaped creature to remember what a tadpole looks like.", "example": "Question: What does a young frog look like before it grows legs? Think tad equals tiny, so the answer is a small fish like tadpole."}}, {"heading": "Webbed Feet for Swimming", "explanation": "The frog has webbed feet. This means thin skin joins its toes together, like a paddle. Webbed feet help the frog push through water and swim fast.", "trick": {"name": "Paddle Feet Picture", "howto": "Think of a duck's foot or a table tennis paddle, flat and joined. The word webbed sounds like web, a net that joins the toes together like that paddle shape.", "example": "Question: What helps the frog swim quickly? Picture the paddle shaped web foot and answer webbed feet."}}, {"heading": "A Quick Tongue for Food", "explanation": "The frog flicks out its tongue very fast to catch insects. Flick means a sudden, quick movement. This is how the frog gets its food without chasing it far.", "trick": {"name": "Whip-Flick Trick", "howto": "Say the word flick out loud fast, it even sounds quick, like a tiny whip snapping. Remember flick equals a super fast snap, just like the frog's tongue grabbing food.", "example": "Question: How does the frog catch insects? Say flick fast in your head and answer, it flicks its tongue out quickly."}}, {"heading": "Camouflage Keeps the Frog Safe", "explanation": "The frog's colours match the plants and leaves around it. This matching is called camouflage. Camouflage makes it hard for enemies to spot the frog among the green.", "trick": {"name": "CAMO Code", "howto": "Camouflage shortens to camo, the same word soldiers use for green and brown clothes that blend into forests. If a question asks why the frog is hard to see, remember camo clothes blend in, just like the frog's skin.", "example": "Question: Why can other animals not easily see the frog in the grass? Remember camo blends in, so the answer is camouflage, its colours match the plants."}}, {"heading": "Beware of Snakes", "explanation": "Even with camouflage, the frog must stay alert. The poem warns that snakes are near and could catch the frog unaware. Staying watchful helps the frog survive.", "trick": {"name": "Snake Alert Rhyme", "howto": "Remember the rhyme, green hides me well, but snakes can still tell. This reminds you that camouflage helps, but the frog still needs to watch out for snakes.", "example": "Question: What danger does the frog warn about in the poem? Recall the rhyme, snakes can still tell, so the answer is snakes."}}, {"heading": "Joining Words: and, but, because, or", "explanation": "Small words like and, but, because and or join two ideas into one longer sentence. And adds an idea, but shows a difference, because gives a reason, and or gives a choice.", "trick": {"name": "ABCO Joiner Trick", "howto": "Remember the letters A-B-C-O standing for And, But, Because, Or. Ask yourself, am I adding (and), showing difference (but), giving a reason (because), or giving a choice (or)? Pick the joining word that matches.", "example": "Example: The frog is small ___ it can jump very high. Since this shows a difference between small size and big jump, the ABCO trick points to but."}}], "mcqs": [{"q": "What is a baby frog called?", "options": ["Tadpole", "Puppy", "Chick", "Cub"], "correct": 0, "explain": "The poem describes the young frog as a tadpole. The Tiny Fish Trick reminds us tad means small and fish shaped."}, {"q": "What helps the frog swim fast in water?", "options": ["Wings", "Webbed feet", "A long tail", "Fur"], "correct": 1, "explain": "The frog has webbed feet, like a paddle, which push water back and help it swim quickly, as in the Paddle Feet Picture trick."}, {"q": "What does the frog use to catch its food?", "options": ["Its hands", "Its teeth", "Its tongue", "Its claws"], "correct": 2, "explain": "The frog flicks out its tongue very fast to grab insects, matching the Whip-Flick Trick."}, {"q": "Where does the frog say it likes to sit or hop about?", "options": ["In trees and mountains", "In ponds, rain and a muddy drain", "In the desert", "In the snow"], "correct": 1, "explain": "The poem says the frog sits in ponds and in the rain, or hops about in a muddy drain, showing its watery home."}, {"q": "Why does the frog's colour match the plants around it?", "options": ["To look pretty", "To hide from enemies, called camouflage", "To stay warm", "To attract other frogs"], "correct": 1, "explain": "This matching colour is camouflage, which hides the frog from danger, as in the CAMO Code trick."}, {"q": "Which animal does the frog say it must watch out for?", "options": ["Fish", "Birds", "Snakes", "Rabbits"], "correct": 2, "explain": "The poem warns that snakes are near and could catch the frog unaware, matching the Snake Alert Rhyme."}, {"q": "Fill in the blank with the correct joining word: The frog is green, ___ it can also look brown or grey.", "options": ["and", "but", "because", "or"], "correct": 1, "explain": "This sentence shows a difference between one colour and another, so the ABCO Joiner Trick points to but."}, {"q": "Which word from the poem means a quick, sudden snapping movement, used for how the frog catches insects?", "options": ["Hop", "Flick", "Croak", "Swim"], "correct": 1, "explain": "Flick describes the fast snap of the frog's tongue, as remembered by the Whip-Flick Trick."}, {"q": "Choose the correct joining word: The frog waited quietly, ___ then it flicked its tongue at an insect.", "options": ["and", "but", "or", "because"], "correct": 0, "explain": "The sentence adds one action after another, so the ABCO Joiner Trick tells us to use and."}, {"q": "Why does the frog still need to beware, even though it has camouflage?", "options": ["Because camouflage never works", "Because camouflage only helps sometimes, and sharp eyed snakes may still spot it", "Because the frog cannot swim", "Because the frog is too big to hide"], "correct": 1, "explain": "Camouflage helps the frog blend in, but it is not perfect protection, so it must still stay alert for snakes, as the Snake Alert Rhyme reminds us."}, {"q": "Choose the correct joining word: I could not see the frog ___ it was hiding among the green leaves.", "options": ["and", "or", "because", "but"], "correct": 2, "explain": "This sentence gives a reason for not seeing the frog, so the ABCO Joiner Trick points to because."}, {"q": "Which sentence uses a joining word correctly, showing a choice, the way the poem's grammar section teaches?", "options": ["Does the frog swim ___ hop to cross the pond?", "The frog is small but it jumps high.", "The frog hopped and then it rested.", "The frog hid because a snake was near."], "correct": 0, "explain": "The blank offers a choice between swimming or hopping, so or fits, matching the choice meaning in the ABCO Joiner Trick."}], "practice": [{"q": "What is the young stage of a frog called, and what does it look like?", "answer": "A tadpole, which looks like a tiny fish.", "solution": "1) Recall the Tiny Fish Trick, where tad means small. 2) The poem tells us the young frog looks fish shaped and lives in water. 3) So the answer is a tadpole, a tiny fish shaped baby frog."}, {"q": "Name the body part the frog uses to swim well, and explain how it helps.", "answer": "Webbed feet, which act like paddles in water.", "solution": "1) Use the Paddle Feet Picture trick and picture a duck's joined toes. 2) The skin between the frog's toes forms a paddle shape. 3) This paddle pushes water back, so the frog swims fast, answer: webbed feet."}, {"q": "How does the frog catch its food, and what word describes this action?", "answer": "It flicks its tongue out quickly to catch insects.", "solution": "1) Apply the Whip-Flick Trick, saying flick fast to feel its speed. 2) The frog's tongue shoots out and snaps back grabbing insects. 3) So the action word is flick, and the answer is it flicks its tongue."}, {"q": "What is camouflage, and why is it useful to the frog?", "answer": "Camouflage is when the frog's colour matches its surroundings, helping it hide from enemies.", "solution": "1) Use the CAMO Code trick, linking camouflage to camo clothing that blends in. 2) The frog's skin colour matches leaves and plants around it. 3) This makes it hard for enemies to see the frog, so camouflage keeps it safe."}, {"q": "Fill in the blank using and, but, because or or: The frog can swim, ___ it can also hop on land.", "answer": "and", "solution": "1) Apply the ABCO Joiner Trick. 2) The sentence adds one more ability to another ability, swimming plus hopping. 3) Since it is adding ideas, the correct word is and."}, {"q": "Fill in the blank using and, but, because or or: The frog hides in the grass ___ a snake is nearby.", "answer": "because", "solution": "1) Apply the ABCO Joiner Trick and check what kind of link is needed. 2) The second part gives a reason for hiding. 3) Since it explains why, the correct word is because."}, {"q": "Explain in your own words why the frog must still beware of snakes even though it uses camouflage.", "answer": "Camouflage only helps sometimes, so the frog still needs to stay alert, or a snake might catch it unaware.", "solution": "1) Recall the Snake Alert Rhyme, green hides me well but snakes can still tell. 2) This tells us camouflage is helpful but not perfect protection. 3) So the frog must still watch carefully for snakes, even while hidden among plants."}, {"q": "Write one sentence about the frog using the joining word or, showing a choice between two actions.", "answer": "Sample answer: The frog can hop away or dive into the pond.", "solution": "1) Use the ABCO Joiner Trick, where or shows a choice between two options. 2) Pick two frog actions from the poem, such as hopping and diving. 3) Join them with or to form a complete sentence, for example, the frog can hop away or dive into the pond."}]}, {"id": "ch6", "number": 6, "title": "What a Tank!", "icon": "💧", "tagline": "Explore clever ways people across India store water!", "summary": "This chapter takes us on a journey across India to see clever old and new ways people store water, from village ponds to underground desert tanks. We also meet Suma, who learns why saving water matters after her tap runs dry one morning. Along the way we practise short forms called contractions and sentences that show strong feelings, called exclamatory sentences.", "concepts": [{"heading": "Ooranis of Tamil Nadu", "explanation": "Ooranis are pond like structures found in Tamil Nadu. They store rainwater for drinking and for watering fields. Villages have used ooranis for a very long time.", "trick": {"name": "OO for Oorani", "howto": "Notice that oorani starts with two round letters, O and O, just like a round pond shape. Picture a round pond when you see the double O at the start of the word.", "example": "Question: What is a round, pond like water store in Tamil Nadu called? Picture the double O shape and answer oorani."}}, {"heading": "Panam Keni Wells of Kerala", "explanation": "Panam keni are special forest wells in Kerala. They are lined with hollow coconut trunks. These wells stay full of water all through the year.", "trick": {"name": "Palm Well Trick", "howto": "The word panam sounds a little like palm, and these wells use hollow coconut palm trunks as lining. Link panam to palm tree to remember what lines these wells.", "example": "Question: What are panam keni wells lined with? Think panam sounds like palm, and answer hollow coconut trunks."}}, {"heading": "Tankas of Rajasthan", "explanation": "Tankas are underground tanks found in the dry Thar Desert of Rajasthan. They store rainwater so people have water for many months. Tankas help people live in a place with very little rain.", "trick": {"name": "Tank in the Sand", "howto": "The word tanka almost says tank, so picture a hidden tank buried under desert sand, saving raindrops for later. This sandy tank picture helps you remember tankas belong to Rajasthan's desert.", "example": "Question: Which underground water store is found in Rajasthan's desert? Picture the tank hidden in sand and answer tanka."}}, {"heading": "Punjab's Creative Water Tanks", "explanation": "In Punjab, people build tall overhead water tanks using cement and steel rods. Many tanks are shaped in fun ways, like a tractor, a football, an aeroplane or a rooster. The shape often shows what the owner likes or does for work.", "trick": {"name": "Shape Match Trick", "howto": "Match the tank shape to the person, a farmer picks a tractor shape, a football fan picks a football shape. Thinking shape equals owner's interest helps you remember why tanks look different.", "example": "Question: Why might a farmer's water tank be shaped like a tractor? Use the Shape Match Trick, the shape shows the owner's work, so a farmer chooses a tractor."}}, {"heading": "Contractions: Short Forms with an Apostrophe", "explanation": "A contraction joins two words into one shorter word using an apostrophe. The apostrophe takes the place of missing letters. For example, do not becomes don't.", "trick": {"name": "Apostrophe Eats a Letter", "howto": "Picture the apostrophe as a tiny mouth that eats the missing letters and sits in their place. In do not, the apostrophe eats the n and o from not, leaving don't.", "example": "Question: What is the short form of are not? Picture the apostrophe eating the o in not, giving the answer aren't."}}, {"heading": "Exclamatory Sentences", "explanation": "An exclamatory sentence shows strong feeling, like surprise, joy or fear. It usually starts with a word like What or How, and ends with an exclamation mark. The chapter title itself, What a Tank!, is an exclamatory sentence.", "trick": {"name": "Wow Mark Trick", "howto": "If you could shout the sentence with a big Wow, it is probably exclamatory and needs an exclamation mark. Say the sentence loudly in your head to test it.", "example": "Question: Is What a tank! an exclamatory sentence? Say it with a big Wow feeling, it fits, so yes, it ends with an exclamation mark."}}], "mcqs": [{"q": "In which state are ooranis used to store rainwater?", "options": ["Kerala", "Tamil Nadu", "Rajasthan", "Punjab"], "correct": 1, "explain": "Ooranis are pond like water stores found in Tamil Nadu, as remembered by the OO for Oorani trick."}, {"q": "What are panam keni wells in Kerala lined with?", "options": ["Bricks", "Hollow coconut trunks", "Plastic pipes", "Stones"], "correct": 1, "explain": "These forest wells use hollow coconut trunks as lining, matching the Palm Well Trick, panam sounds like palm."}, {"q": "In which state are underground tankas found?", "options": ["Kerala", "Punjab", "Rajasthan", "Tamil Nadu"], "correct": 2, "explain": "Tankas are underground tanks in the Thar Desert of Rajasthan, as pictured in the Tank in the Sand trick."}, {"q": "What are the tall water tanks in Punjab usually made of?", "options": ["Wood and mud", "Cement and steel rods", "Plastic sheets", "Glass"], "correct": 1, "explain": "The chapter says Punjab's overhead tanks are built with steel rod frames and cement."}, {"q": "According to the chapter, what shapes might Punjab's water tanks take?", "options": ["Only plain round shapes", "Tractors, footballs, aeroplanes or roosters", "Only square boxes", "Only flower shapes"], "correct": 1, "explain": "Tanks are shaped in fun ways like tractors, footballs, aeroplanes and roosters, reflecting the owner's interests, as in the Shape Match Trick."}, {"q": "Why do owners often choose these creative tank shapes?", "options": ["To save money", "To show who they are or what they like", "Because the law requires it", "Because plain tanks are more expensive"], "correct": 1, "explain": "The shape usually reflects the owner's profession or interest, such as a farmer choosing a tractor shape, matching the Shape Match Trick."}, {"q": "Which is the correct contraction for do not?", "options": ["don't", "dont'", "do'nt", "don t"], "correct": 0, "explain": "The apostrophe takes the place of the missing letters n and o, giving don't, as shown by the Apostrophe Eats a Letter trick."}, {"q": "Which sentence below is an exclamatory sentence?", "options": ["The tank is big.", "What a tank!", "Is the tank full?", "Fill the tank."], "correct": 1, "explain": "What a tank! shows strong feeling and ends with an exclamation mark, matching the Wow Mark Trick."}, {"q": "Which is the correct contraction for are not?", "options": ["arn't", "aren't", "are'nt", "arent'"], "correct": 1, "explain": "The apostrophe replaces the missing o in not, so the correct short form is aren't."}, {"q": "Why are old water systems like ooranis and tankas still considered important today?", "options": ["They look decorative", "They show how people managed water wisely, and these ideas still help save water now", "They are the cheapest option available", "They are no longer used anywhere"], "correct": 1, "explain": "The chapter shows these traditional systems prove wise water management, an idea still useful today for water conservation."}, {"q": "Which of these is NOT a correctly written contraction?", "options": ["isn't", "couldn't", "didn't", "can't's"], "correct": 3, "explain": "Can't's is not a real word, since can't is already a short form and cannot take another apostrophe s, unlike the Apostrophe Eats a Letter trick's correct pattern."}, {"q": "Which sentence best shows the strong surprise or excitement of an exclamatory sentence, the way the chapter title does?", "options": ["The tank was shaped like a rooster.", "What a tank!", "The tank stores water.", "Tanks are useful."], "correct": 1, "explain": "Testing each option with the Wow Mark Trick, only What a tank! carries the big Wow feeling and needs an exclamation mark."}], "practice": [{"q": "Name the pond like water store found in Tamil Nadu and explain what it is used for.", "answer": "An oorani, used to store rainwater for drinking and for watering fields.", "solution": "1) Use the OO for Oorani trick, picturing a round pond shape from the double O. 2) The chapter says villages in Tamil Nadu store rainwater this way. 3) The water is then used for drinking and farming, so the answer is oorani."}, {"q": "What are panam keni wells, and where are they found?", "answer": "Forest wells in Kerala lined with hollow coconut trunks, which stay full of water all year.", "solution": "1) Apply the Palm Well Trick, linking panam to palm coconut trunks. 2) These wells are dug in forests in Kerala. 3) Because of their special lining, they remain full of water through the year."}, {"q": "Explain how tankas help people survive in the Thar Desert of Rajasthan.", "answer": "Tankas are underground tanks that store rainwater, giving people water to use for many months in the dry desert.", "solution": "1) Picture the Tank in the Sand trick, a hidden tank saving raindrops. 2) Since Rajasthan's desert gets very little rain, people store what falls underground. 3) This stored water then lasts them through the dry months."}, {"q": "Describe how Punjab's water tanks are built and why some are shaped in unusual ways.", "answer": "They are built with a steel rod frame and cement, and many are shaped like tractors, footballs or other things to show the owner's interests.", "solution": "1) Recall that steel rods form the frame, then cement is used to build the tank. 2) Apply the Shape Match Trick, connecting the tank's shape to the owner's job or hobby. 3) So a farmer may choose a tractor shape, and a football fan may choose a football shape."}, {"q": "Change this sentence to use a contraction: I do not have enough water today.", "answer": "I don't have enough water today.", "solution": "1) Apply the Apostrophe Eats a Letter trick. 2) Find do not and remove the letters n and o from not, replacing them with an apostrophe. 3) This gives the short form don't, so the sentence becomes I don't have enough water today."}, {"q": "Change this sentence to use a contraction: The tank was not full this morning.", "answer": "The tank wasn't full this morning.", "solution": "1) Apply the Apostrophe Eats a Letter trick to was not. 2) Remove the o from not and replace it with an apostrophe. 3) This gives wasn't, so the sentence becomes the tank wasn't full this morning."}, {"q": "Turn this plain sentence into an exclamatory sentence about a beautifully shaped tank.", "answer": "Sample answer: What a beautiful tank!", "solution": "1) Start with a plain sentence, such as the tank is beautiful. 2) Use the Wow Mark Trick, adding a strong feeling word like What at the start. 3) End with an exclamation mark, giving What a beautiful tank!"}, {"q": "Explain in your own words why learning about ooranis, panam keni wells and tankas is useful even today.", "answer": "These old methods show smart, natural ways to save and store water, which can still guide us to conserve water wisely today.", "solution": "1) Recall the chapter's message that people long ago managed water wisely without machines. 2) These systems used natural materials like ponds, coconut trunks and underground tanks. 3) Learning from them can help us save water and avoid running out, just like Suma learned to do."}]}, {"id": "ch7", "number": 7, "title": "Gilli Danda", "icon": "🏑", "tagline": "A joyful poem about a stick, a gilli, and pure fun!", "summary": "Gilli Danda is a cheerful poem about children playing a traditional Indian game with a stick called the danda and a small wooden piece called the gilli. As you read, watch how the poet uses happy words to show friendship and freedom under the open sky. This chapter also teaches you prefixes, possessive pronouns, and the difference between abstract and concrete nouns.", "concepts": [{"heading": "The Two Game Pieces: Gilli and Danda", "explanation": "The poem is about a game played with two wooden pieces. The danda is the long stick used to hit, and the gilli is the small pointed piece that gets struck and flies into the air.", "trick": {"name": "Gilli is Little", "howto": "Notice that the word gilli sounds short, just like the small wooden piece it names. The word danda is longer, just like the long stick it names. Match the length of the word to the size of the object.", "example": "If asked which one is smaller, gilli or danda, remember gilli sounds small, so gilli is the small piece and danda is the long stick."}}, {"heading": "Where the Children Play", "explanation": "The children play Gilli Danda outdoors in a playground. The poem describes a bright blue sky and golden sunshine above them while they play.", "trick": {"name": "Picture the Playground", "howto": "Close your eyes and imagine standing outside on a sunny day with friends. Picture the blue sky above and the golden sun. This picture helps you remember the setting is outdoors, not indoors.", "example": "If asked where the children play, picture the sunny outdoor scene and answer: in a playground, under the blue sky."}}, {"heading": "New Word: Quit", "explanation": "The word quit means to stop doing something. In the poem, the children say they never quit playing with their friends, showing how much they enjoy the game.", "trick": {"name": "Q for Quit, Q for Quiet-stop", "howto": "Think of the letter Q as a stop sign with a little tail. Whenever you see quit, remember it means to stop or give up doing something.", "example": "In the sentence 'We never quit playing,' quit means the children never stop playing, because Q reminds you of a stop sign."}}, {"heading": "Grammar: Prefixes un- and re-", "explanation": "A prefix is added to the front of a word to change its meaning. The prefix un- means not, like in unaware. The prefix re- means again, like in rewrite.", "trick": {"name": "UN-do, RE-do", "howto": "Remember: un- undoes the meaning of the word, so unhappy means not happy. Re- repeats the action, so replay means play again. Say the two prefixes with their meanings as a little chant: un is not, re is again.", "example": "For the word rearrange, use the trick: re- means again, so rearrange means to arrange again."}}, {"heading": "Grammar: Possessive Pronouns", "explanation": "Possessive pronouns show who owns something, without repeating the owner's name. Some possessive pronouns are mine, his, hers, ours, yours, and theirs.", "trick": {"name": "Owner Endings", "howto": "Ask yourself, whose is it? Then pick the short word that replaces the owner's name. If it belongs to Mudit, replace his name with his. If it belongs to you, use mine.", "example": "For 'This toy belongs to Mudit,' use the Owner Endings trick to say: this toy is his."}}, {"heading": "Grammar: Abstract and Concrete Nouns", "explanation": "A concrete noun names something you can see or touch, like a ball or a stick. An abstract noun names a feeling or idea you cannot touch, like happiness or joy.", "trick": {"name": "The Touch Test", "howto": "Ask yourself, can I touch it or hold it in my hand? If yes, it is a concrete noun. If it is only a feeling or idea, it is an abstract noun.", "example": "For the word happiness, use the Touch Test: you cannot hold happiness in your hand, so it is an abstract noun."}}], "mcqs": [{"q": "What two things are used to play Gilli Danda?", "options": ["A danda and a gilli", "A bat and a ball", "A rope and a stone", "A bucket and a stick"], "correct": 0, "explain": "The poem is about the game played with a danda (stick) and a gilli (small wooden piece), just like the Gilli is Little trick reminds us."}, {"q": "Where do the children play the game?", "options": ["In a classroom", "In a playground", "In a kitchen", "In a library"], "correct": 1, "explain": "The poem describes children playing outdoors in a playground, as pictured in the Picture the Playground trick."}, {"q": "What happens to the gilli when it is struck by the danda?", "options": ["It breaks apart", "It rolls on the ground", "It flies up high into the air", "It disappears"], "correct": 2, "explain": "The poem says the small gilli flies up high into the air after being hit."}, {"q": "Which word in the poem shows that the children are happy?", "options": ["Joy", "Tired", "Angry", "Sad"], "correct": 0, "explain": "The poem uses the word joy to show the children's happy feelings while playing."}, {"q": "According to the poem, what kind of sky is above the children as they play?", "options": ["A dark, stormy sky", "A bright blue sky", "A cloudy grey sky", "A night sky"], "correct": 1, "explain": "The poem describes a bright blue sky above the playing children, part of the sunny outdoor picture."}, {"q": "In the poem, whose golden rays shine down on the children?", "options": ["The moon's", "A lamp's", "The sun's", "A fire's"], "correct": 2, "explain": "The poem talks about golden rays of the sun shining on the children as they play."}, {"q": "What does the prefix un- mean, as used in the chapter?", "options": ["Again", "Not", "Before", "After"], "correct": 1, "explain": "Using the UN-do, RE-do trick, un- means not, so unaware means not aware."}, {"q": "What does the prefix re- mean in a word like rewrite?", "options": ["Not", "Never", "Again", "Small"], "correct": 2, "explain": "The UN-do, RE-do trick shows re- means again, so rewrite means to write again."}, {"q": "Why do you think the children in the poem say they never quit playing with friends?", "options": ["Because they are forced to play by their teacher", "Because they enjoy playing together and feel free and happy", "Because there is no other game to play", "Because it is a school rule to play"], "correct": 1, "explain": "The poem shows the children feel joy and freedom with their friends, which is why they never want to quit playing."}, {"q": "If a toy belongs to Mudit, which possessive pronoun should you use?", "options": ["Mine", "Hers", "His", "Theirs"], "correct": 2, "explain": "Using the Owner Endings trick, since the toy belongs to Mudit (a boy), the correct possessive pronoun is his."}, {"q": "Which of these words is an abstract noun, something you cannot touch?", "options": ["Ball", "Happiness", "Stick", "Playground"], "correct": 1, "explain": "Using the Touch Test trick, happiness is a feeling you cannot hold, so it is an abstract noun, while ball, stick, and playground are things you can touch."}, {"q": "What is the poem mainly trying to show readers?", "options": ["That traditional games bring joy and friendship", "That games are dangerous and should be avoided", "That children should study instead of playing", "That Gilli Danda is too hard to learn"], "correct": 0, "explain": "The whole poem celebrates the fun, joy, and friendship children feel while playing a traditional game outdoors."}], "practice": [{"q": "Name the two objects used to play Gilli Danda.", "answer": "The danda (stick) and the gilli (small wooden piece).", "solution": "1) Use the Gilli is Little trick: gilli sounds short, so it is the small piece. 2) Danda is the longer word, matching the long stick. 3) So the two objects are the danda and the gilli."}, {"q": "Where do the children play the game, according to the poem?", "answer": "In an outdoor playground, under the blue sky.", "solution": "1) Use the Picture the Playground trick and imagine the sunny outdoor scene described in the poem. 2) The poem mentions blue skies and golden sun rays, which are outdoor images. 3) So the children play in a playground outdoors."}, {"q": "What happens to the gilli after the danda strikes it?", "answer": "It flies up high into the air.", "solution": "1) Recall the key action described in the poem. 2) The danda hits the gilli, sending it flying upward. 3) So the answer is that the gilli flies up high into the sky."}, {"q": "Use the word 'quit' correctly in a sentence about the children in the poem.", "answer": "The children never quit playing with their friends.", "solution": "1) Use the Q for Quit trick to remember quit means to stop. 2) The poem says the children never quit, meaning they never stop playing. 3) So a correct sentence is: The children never quit playing with their friends."}, {"q": "Add the prefix un- to the word 'aware' and explain what the new word means.", "answer": "Unaware, meaning not aware.", "solution": "1) Use the UN-do, RE-do trick: un- means not. 2) Add un- to aware to get unaware. 3) So unaware means not aware of something."}, {"q": "Add the prefix re- to the word 'arrange' and explain what the new word means.", "answer": "Rearrange, meaning to arrange again.", "solution": "1) Use the UN-do, RE-do trick: re- means again. 2) Add re- to arrange to get rearrange. 3) So rearrange means to arrange something again."}, {"q": "Which possessive pronoun would you use for 'This ball belongs to me'?", "answer": "Mine.", "solution": "1) Use the Owner Endings trick and ask, whose is it? 2) Since it belongs to me, the short owning word is mine. 3) So the sentence becomes: This ball is mine."}, {"q": "Is the word 'happiness' a concrete noun or an abstract noun? Explain your answer.", "answer": "Happiness is an abstract noun.", "solution": "1) Use the Touch Test trick and ask, can I touch or hold it? 2) Happiness is a feeling, not an object you can hold in your hand. 3) So happiness is an abstract noun, unlike a ball or a stick which are concrete nouns."}]}, {"id": "ch8", "number": 8, "title": "The Decision of the Panchayat", "icon": "⚖️", "tagline": "A clever chief outsmarts a cunning neighbor over a well!", "summary": "This story is about a hardworking farmer who buys a new field with a well, only to find his neighbor will not share the water. The village panchayat, led by a wise chief, must decide who is right. As you read, watch how honesty and clever thinking win in the end, and learn new words, prepositions, and the suffix -less along the way.", "concepts": [{"heading": "The Farmer Buys a Field and a Well", "explanation": "A hardworking farmer buys a third field from his neighbor, and this field comes with a well full of water. The farmer expects to use the water for his crops.", "trick": {"name": "Field Plus Well", "howto": "Remember the purchase as a pair: field PLUS well. The farmer thought buying the field meant buying the well and its water together, like buying a lunchbox with the food already inside.", "example": "If asked what the farmer bought, use Field Plus Well to answer: a field along with a well."}}, {"heading": "The Neighbor's Cunning Trick", "explanation": "The very next day, the neighbor refuses to let the farmer take water from the well. He cunningly claims he only sold the well itself, not the water inside it.", "trick": {"name": "Well is Not Water", "howto": "Split the neighbor's trick into two separate words: well and water. Remember his sneaky claim by saying the two words apart, as if they were two different things being sold separately, even though that makes no real sense.", "example": "If asked what excuse the neighbor gave, use Well is Not Water to answer: he said he sold only the well, not the water in it."}}, {"heading": "The Panchayat Meets Under the Banyan Tree", "explanation": "The confused farmer appeals to the village chief. The whole panchayat, along with the villagers, gathers under a big banyan tree to hear both sides of the dispute.", "trick": {"name": "Big Tree, Big Meeting", "howto": "Picture a huge banyan tree with wide shade, big enough for the whole village to sit under. A big tree for a big village meeting is easy to remember together.", "example": "If asked where the panchayat met, use Big Tree, Big Meeting to answer: under a banyan tree."}}, {"heading": "The Chief's Clever Decision", "explanation": "The wise chief declares that if the water truly belongs to the neighbor, he must remove it or use it all up right away. Since this is impossible, the neighbor's trick is exposed, and he loses his case.", "trick": {"name": "The Impossible Order", "howto": "Remember that the chief did not argue with the neighbor. Instead, he gave an order that was impossible to follow, which proved the neighbor's claim was foolish and untrue.", "example": "If asked how the chief solved the problem, use The Impossible Order trick: he told the neighbor to remove or use up all the water at once, which no one can do."}}, {"heading": "New Words: Cunning, Adamant, and Prosper", "explanation": "Cunning means clever in a tricky or dishonest way. Adamant means refusing to change your mind, even when you are wrong. Prosper means to do well and become successful.", "trick": {"name": "Three C-A-P Words", "howto": "Remember the three words with the first letters C-A-P: Cunning (tricky), Adamant (stubborn), Prosper (succeed). The neighbor was Cunning and Adamant, but the honest farmer would Prosper.", "example": "If asked which word means 'clever in a tricky way,' use the C-A-P trick to answer: cunning."}}, {"heading": "Grammar: Prepositions and the Suffix -less", "explanation": "Prepositions are small words like in, at, by, under, and with that show where or when something happens. The suffix -less means without, so useless means without use.", "trick": {"name": "Small Words, Big Job", "howto": "Chant the preposition list as one string: in, at, by, after, before, under, with, to, for. For -less, remember it sounds like 'less amount,' so it means without something.", "example": "For 'The villagers gathered ___ the banyan tree,' use Small Words, Big Job to pick under. For 'fear' plus -less, form fearless, meaning without fear."}}], "mcqs": [{"q": "What did the farmer buy from his neighbor?", "options": ["A field along with a well", "A cow", "A house", "A cart"], "correct": 0, "explain": "Using the Field Plus Well trick, the farmer bought a field that came together with a well."}, {"q": "What did the neighbor refuse to give the farmer the next day?", "options": ["The field itself", "Water from the well", "Seeds for planting", "Money"], "correct": 1, "explain": "The neighbor refused to let the farmer take water from the well, even though he had sold him the well."}, {"q": "What excuse did the cunning neighbor give?", "options": ["He said the well was broken", "He said he had sold only the well, not the water", "He said the farmer never paid him", "He said the field belonged to someone else"], "correct": 1, "explain": "Using the Well is Not Water trick, the neighbor cunningly claimed he sold only the well and not the water inside it."}, {"q": "Who did the confused farmer go to for help?", "options": ["The village chief", "The king", "A policeman", "A shopkeeper"], "correct": 0, "explain": "The farmer appealed to the village chief, who then called a panchayat meeting to solve the dispute."}, {"q": "Where did the panchayat gather to hear the case?", "options": ["In a courtroom", "At the market", "Under a banyan tree", "At the farmer's house"], "correct": 2, "explain": "Using the Big Tree, Big Meeting trick, the villagers and panchayat gathered under a large banyan tree."}, {"q": "How did the villagers describe the neighbor when he refused to listen to reason?", "options": ["Kind", "Adamant", "Generous", "Shy"], "correct": 1, "explain": "Using the C-A-P trick, adamant means stubborn and refusing to change one's mind, which describes the neighbor."}, {"q": "Which word means 'clever in a tricky or dishonest way'?", "options": ["Cunning", "Honest", "Brave", "Kind"], "correct": 0, "explain": "Using the C-A-P trick, cunning is the word that means clever in a dishonest, tricky way, describing the neighbor."}, {"q": "Which suffix means 'without,' as used in the chapter?", "options": ["-ing", "-ful", "-less", "-ed"], "correct": 2, "explain": "Using the Small Words, Big Job trick, the suffix -less means without, as in useless meaning without use."}, {"q": "Why did the chief order the neighbor to remove or use up all the water at once?", "options": ["To show the claim was impossible and expose the trick", "To punish the farmer instead", "To give the neighbor extra water", "Because the well was drying up naturally"], "correct": 0, "explain": "Using The Impossible Order trick, the chief gave a command no one could follow, proving the neighbor's claim about owning only the water was foolish."}, {"q": "What happened to the neighbor at the end of the story?", "options": ["He became the new village chief", "He paid a fine and apologized to the farmer", "He got to keep the well", "He moved to another village"], "correct": 1, "explain": "Once his trick was exposed, the neighbor had to pay a fine and apologize to the farmer for trying to cheat him."}, {"q": "What lesson does this story mainly teach us?", "options": ["Wisdom and honesty win over cunning tricks", "Neighbors should never share a well", "Village chiefs are always right", "Water is not an important resource"], "correct": 0, "explain": "The story shows that the chief's wisdom and the farmer's honesty triumphed over the neighbor's cunning and dishonest trick."}, {"q": "Which preposition correctly completes: 'The villagers gathered ___ the banyan tree'?", "options": ["under", "after", "before", "between"], "correct": 0, "explain": "Using the Small Words, Big Job trick, under is the correct preposition since the villagers sat beneath the big tree."}], "practice": [{"q": "What did the farmer buy along with his new field?", "answer": "A well.", "solution": "1) Use the Field Plus Well trick to recall the purchase. 2) The farmer bought a field, and it came together with a well. 3) So the answer is a well."}, {"q": "What excuse did the neighbor give for refusing to share the water?", "answer": "He claimed he had sold only the well, not the water inside it.", "solution": "1) Use the Well is Not Water trick, splitting the two words apart. 2) The neighbor cunningly separated the well from its water to trick the farmer. 3) So his excuse was that he sold the well but not the water."}, {"q": "Where did the panchayat gather to hear the dispute?", "answer": "Under a banyan tree.", "solution": "1) Use the Big Tree, Big Meeting trick. 2) Picture the whole village sitting under a wide, shady banyan tree. 3) So the panchayat met under a banyan tree."}, {"q": "What clever order did the chief give the neighbor?", "answer": "To remove or use up all the water immediately.", "solution": "1) Use The Impossible Order trick. 2) The chief said if the water was truly the neighbor's, he must remove it or drink it all at once. 3) So the chief's order was to remove or use up the water right away."}, {"q": "Why could the neighbor not obey the chief's order?", "answer": "Because it was impossible to remove or use up all the well water at once, which proved his claim was a trick.", "solution": "1) Use The Impossible Order trick to see why the order could not be followed. 2) No one can remove or drink an entire well of water immediately. 3) So this impossible task exposed that the neighbor's claim was dishonest."}, {"q": "What happened to the neighbor at the end of the story?", "answer": "He paid a fine and apologized to the farmer.", "solution": "1) Recall the ending of the story after the chief's clever decision. 2) The neighbor's trick failed, so the panchayat made him pay a fine. 3) He also apologized to the farmer for trying to cheat him."}, {"q": "Add the suffix -less to the word 'fear' and use the new word in a sentence.", "answer": "Fearless — for example, 'The farmer stayed fearless and asked the panchayat for justice.'", "solution": "1) Use the Small Words, Big Job trick: -less means without. 2) Add -less to fear to make fearless, meaning without fear. 3) So a sentence could be: The farmer stayed fearless and asked the panchayat for justice."}, {"q": "Fill in the blank with the correct preposition: 'The villagers gathered ___ the banyan tree to hear the decision.'", "answer": "Under.", "solution": "1) Use the Small Words, Big Job trick and chant the preposition list. 2) Since the tree gives shade from above, the villagers sat beneath it. 3) So the correct word is under."}]}, {"id": "ch9", "number": 9, "title": "Vocation", "icon": "🏮", "tagline": "A boy dreams of hawker, gardener, and watchman lives!", "summary": "In this poem by Rabindranath Tagore, a young boy watches a hawker, a gardener, and a watchman go about their day, and he wishes he could do their jobs instead of going to school. You will discover why the boy loves their freedom, without finding out if his wish ever comes true. Along the way, you will also practise fun words ending in -tion and learn to make subjects and verbs agree in sentences.", "concepts": [{"heading": "Three Vocations, One Tired Boy", "explanation": "The poem's speaker is a schoolboy who meets a hawker in the morning, sees a gardener in the afternoon, and watches a watchman at night. Each time, he wishes he had that person's job instead of going to school. This happens in the same order every single day.", "trick": {"name": "Order Clock", "howto": "Remember the day like a clock: Ten o'clock is for the Hawker, Four o'clock is for the Gardener, and dark evening is for the Watchman. Say it as H-G-W, just like the times move forward through the day.", "example": "If a question asks who the boy sees at four in the afternoon, use the Order Clock: ten is hawker, four is gardener, evening is watchman. So the answer is the gardener."}}, {"heading": "The Hawker's Cry", "explanation": "Every morning on the way to school, the boy meets a hawker who walks in the lane crying, Bangles, crystal bangles. The hawker sells glass bangles and has no fixed road, place, or time to be anywhere.", "trick": {"name": "Crystal Clue", "howto": "Link the word hawker to his loud cry. A hawker is someone who walks around calling out the name of what he is selling, unlike a shopkeeper who waits quietly in one shop.", "example": "For the question, What does the hawker sell, remember his cry, Bangles, crystal bangles, so the answer is bangles."}}, {"heading": "Meaning of Vocation", "explanation": "The word vocation means a job or the kind of work a person does, such as being a gardener or a watchman. The chapter title itself is a -tion word, just like several other words used in its exercises.", "trick": {"name": "-tion Family", "howto": "Many words in this chapter rhyme because they end in -tion, such as vocation, nation, ration, tension, attention, mention, fashion, and cushion. Chant them together like a little rhyme to remember their spelling and sound.", "example": "If asked which -tion word means a job or occupation, run through the -tion Family list and pick vocation."}}, {"heading": "Why the Boy Envies Them", "explanation": "The boy feels jealous of the hawker, the gardener, and the watchman because none of them seem to have a fixed time, place, or rule to follow. He, on the other hand, must go to school every day at ten and sleep when his mother sends him to bed.", "trick": {"name": "Freedom Flag", "howto": "Whenever a question asks why the speaker wants to be someone, raise the Freedom Flag in your mind. The answer is almost always about having no hurry, no fixed place, and nobody to scold them.", "example": "For, Why does the speaker want to be a gardener, use the Freedom Flag: the gardener does what he likes with his spade and nobody stops him, so that is the answer."}}, {"heading": "The Giant with One Red Eye", "explanation": "In the evening, the boy looks out of his window and sees the street lamp standing alone in the dark, lonely lane. The poem compares this lamp to a giant with one red eye in its head, which makes the quiet street feel exciting instead of scary.", "trick": {"name": "One-Eyed Giant", "howto": "Picture a tall street lamp turning into a giant, with its single glowing bulb becoming one red eye. This funny picture helps you remember exactly what the street lamp is compared to.", "example": "For, What does the street lamp look like in the poem, picture the One-Eyed Giant and answer, a giant with one red eye in its head."}}, {"heading": "Grammar: Getting Subjects and Verbs to Agree", "explanation": "The exercises for this chapter fix sentences like, The birds is singing, into, The birds are singing. A plural subject needs a plural verb such as are or have, while a singular subject needs is or has.", "trick": {"name": "Match Maker", "howto": "Before choosing a verb, ask yourself, Is the subject one person or thing, or many? One means is or has, many means are or have. Matching them correctly is the whole trick.", "example": "To correct, The hawker have bangles, ask if hawker is one or many. It is one person, so the Match Maker rule gives, The hawker has bangles."}}], "mcqs": [{"q": "Who wrote the poem Vocation?", "options": ["Rabindranath Tagore", "Ruskin Bond", "Sarojini Naidu", "A. A. Milne"], "correct": 0, "explain": "The poem Vocation was written by Rabindranath Tagore, as given in the chapter."}, {"q": "What does the hawker in the poem sell?", "options": ["Fruits", "Bangles", "Flowers", "Toys"], "correct": 1, "explain": "Using the Crystal Clue trick, remember the hawker's cry, Bangles, crystal bangles, so he sells bangles."}, {"q": "At what time does the boy walk to school in the morning?", "options": ["Eight o'clock", "Nine o'clock", "Ten o'clock", "Eleven o'clock"], "correct": 2, "explain": "The poem says the gong sounds ten in the morning when the boy walks to school, matching the Order Clock trick."}, {"q": "Whom does the boy see when he comes back from school at four in the afternoon?", "options": ["The watchman", "The hawker", "The gardener", "The postman"], "correct": 2, "explain": "Using the Order Clock trick, four in the afternoon is matched with the gardener, whom the boy sees digging."}, {"q": "What shows that the gardener has freedom, according to the poem?", "options": ["He sells bangles in the lane", "He digs with his spade as he likes and nobody stops him", "He walks all night with a lantern", "He studies at the same school"], "correct": 1, "explain": "The Freedom Flag trick points to the line that nobody takes the gardener to task, so he can dig as he pleases."}, {"q": "What is the street lamp compared to in the evening?", "options": ["A blazing fire", "A giant with one red eye", "A twinkling star", "The round moon"], "correct": 1, "explain": "Using the One-Eyed Giant trick, the lonely street lamp is described as a giant with one red eye in its head."}, {"q": "What does the word vocation mean?", "options": ["A holiday", "A kind of tension", "A job or occupation", "A type of song"], "correct": 2, "explain": "From the -tion Family trick, vocation means a job or the work a person does, which is also the poem's title."}, {"q": "Which -tion word from the chapter's vocabulary list means a fixed share of food given out?", "options": ["Fashion", "Ration", "Mention", "Nation"], "correct": 1, "explain": "Running through the -tion Family list, ration is the word that means a fixed share of food or supplies."}, {"q": "Why does the boy wish to be a watchman instead of going to sleep?", "options": ["He is afraid of the dark", "He admires the watchman's freedom to walk all night with his lantern and never go to bed", "He wants to scare people with a lantern", "He wants a lantern as a new toy"], "correct": 1, "explain": "The Freedom Flag trick shows the boy envies the watchman because he walks about freely all night instead of being sent to bed."}, {"q": "Which sentence correctly fixes the mistake in, The birds is singing?", "options": ["The birds is singing", "The birds are singing", "The bird are singing", "The birds am singing"], "correct": 1, "explain": "Using the Match Maker trick, birds is a plural subject, so it needs the plural verb are, giving, The birds are singing."}, {"q": "Which sentence uses the correct comparative form, as practised in the chapter's grammar exercise?", "options": ["The watchman walk fast than me", "The watchman walks faster than me", "The watchman walking fastest than me", "The watchman fast than me"], "correct": 1, "explain": "The comparative of fast is faster, and the singular subject watchman needs walks, so the correct sentence is, The watchman walks faster than me."}, {"q": "What is the main message of the poem Vocation?", "options": ["Only hawkers have interesting jobs", "The boy dislikes his mother", "Every kind of work has its own freedom and charm, which we can admire in others' lives", "Watchmen should sleep at night like everyone else"], "correct": 2, "explain": "Combining the Freedom Flag idea across all three jobs, the poem shows that every vocation, however simple, has its own kind of freedom worth admiring."}], "practice": [{"q": "Name the three vocations, or jobs, the boy wishes he had, in the order he meets them during the day.", "answer": "Hawker, gardener, watchman", "solution": "1) Use the Order Clock trick to match times of day to jobs. 2) At ten in the morning he meets the hawker crying bangles. 3) At four in the afternoon he sees the gardener digging. 4) In the evening he watches the watchman with his lantern. So the order is hawker, gardener, watchman."}, {"q": "What does the hawker cry out as he walks along the lane?", "answer": "Bangles, crystal bangles!", "solution": "1) Recall the Crystal Clue trick, which links the hawker to his loud call. 2) The poem tells us he cries, Bangles, crystal bangles! 3) So that is exactly what he shouts as he walks."}, {"q": "Fill in the blank with the correct -tion word: My teacher says I must pay careful _______ in class.", "answer": "attention", "solution": "1) Use the -tion Family trick and list the words: vocation, nation, ration, tension, attention, mention, fashion, cushion. 2) The clue careful listening matches the word attention. 3) So the blank is filled with attention."}, {"q": "Why does the boy want to be a gardener instead of going to school?", "answer": "Because the gardener can dig as he likes, get his clothes dirty, and nobody stops or scolds him; he is free.", "solution": "1) Apply the Freedom Flag trick and look for words showing no rules. 2) The poem says the gardener does what he likes with his spade and nobody takes him to task. 3) This freedom is why the boy envies him and wishes to be a gardener."}, {"q": "Correct this sentence: The watchman have a lantern.", "answer": "The watchman has a lantern.", "solution": "1) Use the Match Maker trick and check if the subject is one or many. 2) Watchman is a singular subject, meaning just one person. 3) A singular subject takes has, not have. 4) The corrected sentence is, The watchman has a lantern."}, {"q": "Describe what the street lamp looks like in the evening, using the picture the poem paints.", "answer": "It looks like a giant with one red eye in its head.", "solution": "1) Recall the One-Eyed Giant trick from the chapter. 2) The poem compares the lonely street lamp standing in the dark lane to a giant. 3) It has one red eye in its head, which is the glowing lamp itself."}, {"q": "Rewrite this sentence correctly: The gardener walk fast than the hawker.", "answer": "The gardener walks faster than the hawker.", "solution": "1) Two fixes are needed here. First, use the Match Maker trick: gardener is singular, so walk becomes walks. 2) Next, fix the comparative form: fast becomes faster before than. 3) Putting both fixes together gives, The gardener walks faster than the hawker."}, {"q": "In your own words, what does the poem Vocation teach us about different jobs?", "answer": "Every job, even simple ones like selling bangles, gardening, or keeping watch, has its own freedom and joy, and we should respect and admire all kinds of work.", "solution": "1) Use the Freedom Flag trick across all three vocations, hawker, gardener, and watchman. 2) Notice the boy envies each one for their independence, not for money or fame. 3) Putting this together, the poem's message is that all work has its own kind of freedom worth admiring, which is why it is called Vocation."}]}, {"id": "ch10", "number": 10, "title": "Glass Bangles", "icon": "💍", "tagline": "Firozabad's glass bangles sparkle with tradition and new ideas!", "summary": "Travel to Firozabad, a town famous for making glass bangles, and meet Ravi, a skilled bangle-maker, and his daughter Ananya, who dreams up beautiful new designs. Read on to find out how their ideas change the workshop and help their whole community, without giving away every surprise. Along the way, you will also practise the past perfect tense and neat punctuation.", "concepts": [{"heading": "Firozabad, the City of Bangles", "explanation": "The story is set in Firozabad, a real town in India that is famous for making glass bangles. Ravi runs a small workshop there, where he is known as a skilled bangle-maker.", "trick": {"name": "F for Firozabad, F for Fire", "howto": "Remember that Firozabad and Fire both start with the letter F, because the town's furnaces use fire to melt glass into bangles. Linking the two F sounds helps you recall the setting quickly.", "example": "For, Where does the story take place, think F for Fire, F for Firozabad, and answer, Firozabad."}}, {"heading": "Meet Ravi and Ananya", "explanation": "Ravi owns a small glass bangle workshop and is a master of traditional bangle-making. His daughter, Ananya, finishes her schooling and joins the workshop, bringing fresh design ideas with her.", "trick": {"name": "A for Ananya, A for Art", "howto": "Ananya's name starts with A, just like the word Art. Remembering this helps you recall that she is the artistic one who creates new patterns for the bangles.", "example": "For, Who introduced the floral and geometric patterns, use A for Art, A for Ananya, and answer, Ananya."}}, {"heading": "How Bangles Are Made", "explanation": "Ravi and his team first melt glass in a hot furnace. Then they shape it into bangles, decorate it with bright colours and patterns, and finally let it cool and harden perfectly.", "trick": {"name": "Melt-Shape-Decorate-Cool", "howto": "Remember the four steps of bangle-making in order using the letters M, S, D, C, like a short recipe: Melt, Shape, Decorate, Cool. Saying the letters in order keeps the steps straight.", "example": "For, What is the first step in making a bangle, use MSDC and answer, melting the glass in a furnace."}}, {"heading": "Old Meets New", "explanation": "Ananya designed delicate floral patterns and geometric shapes for the bangles, blending traditional craftsmanship with modern styles. This special collection became especially popular around Diwali.", "trick": {"name": "Blend Bell", "howto": "Picture two bells ringing together, an old-style bell and a new-style bell, making one happy sound. This is like Ananya blending the old bangle-making skills with new modern designs to create something special.", "example": "For, What made Ananya's bangles special, use the Blend Bell picture and answer, she blended traditional and modern designs together."}}, {"heading": "Good for the Whole Community", "explanation": "Because more people wanted the new bangle designs, more artisans got work, and new jobs were created in packing and transporting the bangles too. So one good idea helped many people.", "trick": {"name": "Ripple Effect", "howto": "Picture dropping a stone, which is Ananya's idea, into a still pond. The ripples spread outward and reach many people, just like her idea created jobs for artisans, packers, and transporters.", "example": "For, How did the whole community benefit, use the Ripple Effect and answer, more jobs were created in making, packing, and transporting the bangles."}}, {"heading": "Grammar: Past Perfect Tense", "explanation": "The past perfect tense uses had plus a verb to show an action that happened before another action in the past, as in, Ananya had completed her schooling before she joined the workshop. The earlier action gets had, and the later action stays in simple past.", "trick": {"name": "Had Happened First", "howto": "When two things happened in the past, find the one that happened earlier. That earlier action always takes had plus the verb's third form, while the later action uses simple past.", "example": "For, By the time Diwali came, Ravi _______ (finish) the new collection, the earlier action is finishing, so the answer is, had finished."}}], "mcqs": [{"q": "In which town does the story Glass Bangles take place?", "options": ["Jaipur", "Firozabad", "Agra", "Varanasi"], "correct": 1, "explain": "Using the F for Firozabad, F for Fire trick, the story is set in Firozabad, famous for glass bangle-making."}, {"q": "Who is Ravi in the story?", "options": ["A teacher", "A skilled glass bangle-maker who owns the workshop", "A farmer", "A watchman"], "correct": 1, "explain": "Ravi is the owner of the bangle workshop and is known for his traditional bangle-making skill."}, {"q": "Who is Ananya?", "options": ["Ravi's sister", "Ravi's daughter", "Ravi's neighbour", "Ravi's teacher"], "correct": 1, "explain": "Using the A for Ananya, A for Art trick, remember Ananya is Ravi's daughter who joins his workshop."}, {"q": "What new idea did Ananya bring to the bangle business?", "options": ["Selling bangles only online", "New floral and geometric designs", "Making toys instead of bangles", "Closing the workshop for good"], "correct": 1, "explain": "Ananya introduced delicate floral patterns and geometric shapes, blending old skills with new ideas."}, {"q": "According to the chapter, what is the first step in making a glass bangle?", "options": ["Decorating it with colours", "Cooling the glass", "Melting the glass in a furnace", "Packing the finished bangles"], "correct": 2, "explain": "Using the Melt-Shape-Decorate-Cool trick, the very first step is melting the glass in a hot furnace."}, {"q": "During which festival did the new bangle collection become especially popular?", "options": ["Holi", "Diwali", "Eid", "Christmas"], "correct": 1, "explain": "The chapter says the new collection became a big success especially around Diwali, when people buy new things."}, {"q": "How did the whole community benefit from the popularity of the new designs?", "options": ["Nobody else was affected", "More jobs were created in making, packing, and transporting bangles", "The workshop had to shut down", "Only Ravi became rich, and no one else"], "correct": 1, "explain": "Using the Ripple Effect trick, the growing demand created more work for artisans, packers, and transporters too."}, {"q": "Which sentence correctly uses the past perfect tense?", "options": ["Ananya has completed her schooling before she joined the workshop", "Ananya had completed her schooling before she joined the workshop", "Ananya complete her schooling before she joined the workshop", "Ananya completing her schooling before she joined the workshop"], "correct": 1, "explain": "Using the Had Happened First trick, the earlier action, completing schooling, takes had plus the verb, giving had completed."}, {"q": "Why did the new bangle designs succeed, according to the chapter?", "options": ["They were much cheaper than the old ones", "They blended traditional craftsmanship with modern patterns", "They were made entirely of plastic", "They were sold only outside India"], "correct": 1, "explain": "The Blend Bell trick reminds us the success came from mixing traditional skill with Ananya's modern designs."}, {"q": "Fill in the blank with the correct past perfect form: By the time the customers arrived, the artisans _______ the bangles.", "options": ["finish", "finished", "had finished", "finishing"], "correct": 2, "explain": "Finishing the bangles happened before the customers arrived, so the Had Happened First trick gives had finished."}, {"q": "What does the story suggest about combining old skills with new ideas?", "options": ["Old skills should be forgotten completely", "New ideas alone are always enough", "Blending tradition with new ideas can bring success and help the whole community", "Only young people's ideas matter in a family business"], "correct": 2, "explain": "The Blend Bell and Ripple Effect tricks together show that mixing Ravi's tradition with Ananya's new ideas brought success for everyone."}, {"q": "Which sentence best describes Ravi's role compared to Ananya's in the workshop?", "options": ["Ravi designs patterns, and Ananya melts the glass", "Ravi is skilled at traditional bangle-making, and Ananya adds fresh modern designs to it", "Ravi and Ananya do the exact same job every day", "Ravi only sells bangles, and Ananya only studies"], "correct": 1, "explain": "Combining the A for Art and Blend Bell tricks, Ravi brings traditional craft skill while Ananya adds new design ideas."}], "practice": [{"q": "In which town is the Glass Bangles story set, and why is that town famous?", "answer": "Firozabad; it is famous for making glass bangles.", "solution": "1) Use the F for Firozabad, F for Fire trick. 2) The story tells us Ravi's workshop is in Firozabad, known for its glass-melting furnaces. 3) So both the setting and its fame are about glass bangles."}, {"q": "List the four steps of making a glass bangle, in the correct order.", "answer": "Melt the glass, shape it into bangles, decorate it with colours and patterns, and let it cool and harden.", "solution": "1) Recall the Melt-Shape-Decorate-Cool trick, MSDC. 2) Match each letter to a step described in the chapter. 3) Write the four steps out in that same order."}, {"q": "Who is Ananya, and what special skill does she bring to the workshop?", "answer": "Ananya is Ravi's daughter, and she brings a talent for new floral and geometric designs.", "solution": "1) Use the A for Ananya, A for Art trick. 2) The chapter says she creates fine floral motifs and geometric patterns. 3) So her special skill is modern design work."}, {"q": "Why did the new bangle collection sell especially well?", "answer": "Because it blended traditional bangle-making with attractive modern designs, and it was launched around Diwali when people buy new things.", "solution": "1) Use the Blend Bell trick, old plus new equals success. 2) The text says the designs combined the old with the new. 3) The timing with Diwali, a festival of buying new items, added to its popularity."}, {"q": "Correct this sentence using the past perfect tense: Ravi finish the bangles before the customers came.", "answer": "Ravi had finished the bangles before the customers came.", "solution": "1) Apply the Had Happened First trick. 2) There are two past actions here: finishing the bangles, which happened earlier, and the customers coming, which happened later. 3) The earlier action needs had plus the past participle, giving had finished."}, {"q": "How did the community benefit when the bangle business grew?", "answer": "More artisans got work, and new jobs were created in packing and transporting the bangles.", "solution": "1) Use the Ripple Effect trick, one idea spreading outward like ripples in a pond. 2) The chapter states that as demand grew, artisans, packers, and transporters all got more work. 3) That spread of benefit is the community's gain."}, {"q": "Combine these two sentences using the past perfect tense: Ananya completed her schooling. Then she joined the workshop.", "answer": "Ananya had completed her schooling before she joined the workshop.", "solution": "1) Use the Had Happened First trick to find the earlier action. 2) Completing her schooling happened first, and joining the workshop happened after. 3) Put had plus the past participle on the earlier action and join the two ideas with before."}, {"q": "What lesson can we learn from Ravi and Ananya's story about family businesses?", "answer": "When elders' traditional skills combine with young people's fresh ideas, a family business can grow and even help the whole community.", "solution": "1) Recall the Blend Bell and Ripple Effect tricks together. 2) Ravi's traditional craft skill plus Ananya's modern designs equals success, as shown by Blend Bell. 3) That success then created jobs for many others, as shown by Ripple Effect. 4) So the lesson is that combining the strengths of different generations benefits everyone."}]}], "hindi": [{"id": "ch1", "number": 1, "title": "किरण", "icon": "🌞", "tagline": "एक बालिका और सूरज की किरण की प्यारी नोकझोंक!", "summary": "इस कविता में एक बालिका और सूरज की किरण के बीच मीठी बातचीत होती है, जिसमें किरण बताती है कि वह कभी आराम क्यों नहीं करती। साथ ही हम शाम और सुबह से जुड़े कुछ नए पर्यायवाची और विलोम शब्द भी सीखेंगे।", "concepts": [{"heading": "कविता का परिचय", "explanation": "यह कविता कवि निरंकार देव 'सेवक' ने लिखी है। इसमें एक बालिका सूरज की किरण से सीधे बातचीत करती है, मानो किरण भी उसकी सहेली हो। कवि ने प्रकृति को इंसान जैसा दिखाकर बात कही है।", "trick": {"name": "कवि का नाम याद रखो", "howto": "याद रखें कि यह कविता किरण यानी 'रोशनी' की सेवा के बारे में है, और कवि का नाम भी 'सेवक' है - रोशनी सेवा करती है, कवि भी सेवक हैं।", "example": "प्रश्न: 'किरण' कविता के कवि कौन हैं? उत्तर: निरंकार देव 'सेवक' - याद रखें, सेवक शब्द किरण की निरंतर सेवा से जुड़ता है।"}}, {"heading": "बालिका की शिकायत", "explanation": "बालिका कहती है कि कल शाम तक वह किरण के साथ खूब खेली थी। किरण के चले जाने के बाद उसे अकेलापन महसूस हुआ और वह परीकथाएं पढ़ते-पढ़ते देर से सोई। इसलिए आज किरण उससे पहले ही आ गई।", "trick": {"name": "कहानी की कड़ी जोड़ो", "howto": "याद रखें - 'खेली, अकेली, देर से सोई' - यह तीन शब्द बालिका की पूरी कहानी बता देते हैं।", "example": "प्रश्न: बालिका देर से क्यों सोई? उत्तर: परीकथाएं पढ़ते-पढ़ते - क्योंकि किरण के जाने के बाद वह अकेली हो गई थी।"}}, {"heading": "किरण का जवाब", "explanation": "किरण कहती है कि वह कभी नहीं सोती। जब यहाँ शाम होती है, तब वह दुनिया के दूसरे हिस्से में जाकर वहाँ के बच्चों को जगाती है। इस तरह वह हमेशा किसी न किसी को जगाने का काम करती रहती है।", "trick": {"name": "गोल धरती की तरकीब", "howto": "सोचें - धरती गोल है, इसलिए जब एक तरफ रात होती है तो दूसरी तरफ दिन होता है। इसी वजह से किरण कभी आराम नहीं करती।", "example": " नाए गए हैं। यहाँ के मंदिरों में बौद्ध, हिन्दू और जैन तीनों धर्मों की झलक मिलती है, और कैलाश मंदिर सबसे खास है।", "solution": "1) एलोरा से जुड़ी जानकारी याद करें। 2) निर्माण की विधि पहचानें। 3) खासियत को अपने शब्दों में लिखें।"}, {"q": "अजंता की गुफाओं के चित्रों के रंग इतने वर्षों बाद भी क्यों नहीं फीके पड़े?", "answer": "क्योंकि ये रंग फूलों, जड़ी-बूटियों और जड़ों जैसी प्राकृतिक चीज़ों से बनाए गए थे, इसलिए लगभग दो हज़ार साल बाद भी ये रंग चमकीले और ज्यों के त्यों बने हुए हैं।", "solution": "1) रंगों से जुड़ी जानकारी पाठ में खोजें। 2) रंग किन चीज़ों से बने, यह पहचानें। 3) कारण को स्पष्ट वाक्य में लिखें।"}, {"q": "'विश्रामगृह' शब्द किन दो शब्दों से मिलकर बना है? ऐसे ही दो और समास शब्द बनाइए।", "answer": "'विश्रामगृह' विश्राम और गृह से मिलकर बना है। इसी तरह विद्या+आलय=विद्यालय और देव+आलय=देवालय जैसे समास शब्द बनते हैं।", "solution": "1) 'विश्रामगृह' को दो भागों में तोड़ें। 2) समास बनाने का यही तरीका दूसरे शब्दों पर लगाएं। 3) दो नए उदाहरण लिखें।"}, {"q": "'ज्यों का त्यों' मुहावरे का अर्थ लिखिए और इसका एक वाक्य में प्रयोग कीजिए।", "answer": "'ज्यों का त्यों' का अर्थ है बिना किसी बदलाव के, वैसा ही जैसा पहले था। वाक्य - इतने वर्षों बाद भी अजंता के चित्रों के रंग ज्यों के त्यों बने हुए हैं।", "solution": "1) मुहावरे का अर्थ पाठ के संदर्भ से समझें। 2) उसे अपने शब्दों में लिखें। 3) एक सरल वाक्य में उपयोग करें।"}, {"q": "इस यात्रा से निशा को क्या सीख मिली होगी?", "answer": "निशा को यह सीख मिली होगी कि भारत की प्राचीन कला और स्थापत्य बहुत अद्भुत है, और हमें अपने कारीगरों के हुनर पर गर्व करते हुए इस धरोहर को संभालकर रखना चाहिए।", "solution": "1) यात्रा के अनुभव को याद करें। 2) निशा की भावनाओं का अनुमान लगाएं। 3) मिली सीख को अपने शब्दों में लिखें।"}, {"q": "अजंता और एलोरा की गुफाओं में क्या समानता और क्या अंतर है?", "answer": "समानता - दोनों जगह पहाड़ों को तराशकर बनाई गई प्राचीन कलाकृतियाँ हैं। अंतर - अजंता में मुख्यतः चित्रकारी (पेंटिंग) है जबकि एलोरा में मूर्तिकला से बने मंदिर हैं जो एक ही चट्टान से तराशे गए हैं।", "solution": "1) दोनों जगहों की जानकारी अलग-अलग याद करें। 2) समान बातों को पहचानें। 3) अलग बातों की तुलना करके लिखें।"}]}, {"id": "ch12", "number": 12, "title": "गंगा की कहानी", "icon": "🌊", "tagline": "पहाड़ों से सागर तक - गंगा अपनी ही ज़ुबानी सुनाए अपनी कहानी!", "summary": "इस पाठ में गंगा नदी खुद अपनी कहानी सुनाती है - अपने जन्म से लेकर सागर में मिलने तक की पूरी यात्रा। इस आत्मकथा शैली के पाठ से हम पढ़ना-समझना और नए शब्दों का प्रयोग सीखेंगे।", "concepts": [{"heading": "गंगा की आत्मकथा शैली", "explanation": "इस पाठ में गंगा नदी स्वयं 'मैं' कहकर अपनी कहानी सुनाती है। यह लेखन शैली आत्मकथा कहलाती है, जिसमें कोई वस्तु या नदी खुद अपने बारे में बताती है।", "trick": {"name": "आत्मकथा पहचानो", "howto": "अगर कोई कहानी 'मैं' शब्द से शुरू होकर अपने बारे में बता रही हो, तो समझ जाओ यह आत्मकथा है।", "example": "'मैं गंगा हूँ, मेरा जन्म हिमालय में हुआ' - यह आत्मकथा शैली है।"}}, {"heading": "गंगा का उद्गम स्थान", "explanation": "गंगा का उद्गम उत्तराखंड के उत्तरकाशी में गंगोत्री के पास गोमुख नामक स्थान से होता है। कथा के अनुसार राजा भगीरथ ने कठोर तपस्या करके गंगा को धरती पर लाया था।", "trick": {"name": "उद्गम याद रखो", "howto": "'गंगोत्री-गोमुख' को साथ याद रखें - जैसे गाय के मुख से पानी निकल रहा हो, वैसे ही गोमुख से गंगा निकलती है।", "example": "गंगोत्री (उत्तरकाशी) → गोमुख → गंगा की धारा शुरू।"}}, {"heading": "गंगा की यात्रा के पड़ाव", "explanation": "देवप्रयाग में गंगा अलकनंदा नदी से मिलती है, फिर ऋषिकेश और हरिद्वार से होते हुए कानपुर, प्रयागराज (जहाँ यमुना से संगम होता है) और वाराणसी (काशी) से गुज़रती है।", "trick": {"name": "शहरों की माला", "howto": "क्रम याद रखो - देवप्रयाग, ऋषिकेश, हरिद्वार, कानपुर, प्रयागराज, वाराणसी - जैसे मोतियों की माला में शहर पिरोए हों।", "example": "देवप्रयाग में अलकनंदा से मिलन, प्रयागराज में यमुना से संगम।"}}, {"heading": "गंगा का अंतिम सफर", "explanation": "पश्चिम बंगाल में पहुँचकर गंगा दो धाराओं में बँट जाती है - एक पद्मा (जो बांग्लादेश में जाती है) और दूसरी हुगली (जो कोलकाता से गुज़रती है)। अंत में गंगा बंगाल की खाड़ी में जा मिलती है।", "trick": {"name": "दो धाराओं का बंटवारा", "howto": "याद रखें - 'प' से पद्   var byIdCache = {};
  function chaptersOf(key){ return DATA[key] || []; }
  function byId(key, id){
    if(!byIdCache[key]){
      byIdCache[key] = {};
      chaptersOf(key).forEach(function(c){ byIdCache[key][c.id] = c; });
    }
    return byIdCache[key][id];
  }

  /* ================= progress storage (namespaced by subject) ================= */
  var STORE_KEY = "lsm-progress-v1";
  var mem = {};
  function loadAllProgress(){
    try{ var raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return mem; }
  }
  function saveAllProgress(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){ mem = p; } }
  var allProgress = loadAllProgress();
  function progOf(key){ if(!allProgress[key]) allProgress[key] = {}; return allProgress[key]; }

  var quiz = null; // active quiz state: {subject, chapterId, idx, ...}
  var app = document.getElementById("app");

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtTime(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return m + ":" + (s<10? "0"+s : s);
  }
  function splitSteps(sol){
    if(!sol) return [];
    if(/\d+\)\s*/.test(sol) && /\d+\)\s*.*\d+\)\s*/.test(sol+ " 2) ")){
      var parts = sol.split(/(?=\d+\)\s)/).map(function(s){ return s.replace(/^\d+\)\s*/,"").trim(); }).filter(Boolean);
      if(parts.length>1) return parts;
    }
    if(sol.indexOf(" | ")>-1){
      var p2 = sol.split(" | ").map(function(s){return s.trim();}).filter(Boolean);
      if(p2.length>1) return p2;
    }
    var p3 = sol.split(/(?=\d+\)\s)/).map(function(s){ return s.replace(/^\d+\)\s*/,"").trim(); }).filter(Boolean);
    return p3.length ? p3 : [sol];
  }
  function scoreClass(pct){
    if(pct>=80) return "score-good";
    if(pct>=50) return "score-mid";
    return "score-low";
  }
  function tmpl(s, map){
    return s.replace(/\{(\w+)\}/g, function(_, k){ return map[k]!=null ? map[k] : ''; });
  }

  /* ================= theme / palette application ================= */
  function isDark(){
    var t = document.documentElement.getAttribute('data-theme');
    if(t==='dark') return true;
    if(t==='light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  var currentPaletteKey = 'math';
  function applyPalette(key){
    currentPaletteKey = key;
    var pal = PALETTES[key] ? PALETTES[key][isDark() ? 'dark' : 'light'] : null;
    if(!pal) return;
    var root = document.documentElement.style;
    Object.keys(pal).forEach(function(varName){ root.setProperty(varName, pal[varName]); });
  }
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ applyPalette(currentPaletteKey); });
  }
  function applyLangClass(key){
    document.body.classList.toggle('lang-hindi', key==='hindi');
  }

  /* ================= nav / chrome ================= */
  function renderNav(subjectKey){
    var nav = document.getElementById('navbar');
    var badge = document.getElementById('brand-badge');
    if(!subjectKey){
      badge.textContent = '🎪';
      nav.innerHTML = '';
      document.getElementById('footer-note').textContent = 'Class 5 · CBSE · Narayan School, Bhubaneswar — one learning hub for Maths, Science (EVS), English and Hindi, built to the current NCERT syllabus.';
      return;
    }
    var m = META[subjectKey];
    badge.textContent = m.badgeIcon;
    nav.innerHTML =
      '<a href="#s/'+subjectKey+'" class="pill-link" data-nav="home">'+m.navChapters+'</a>' +
      '<a href="#s/'+subjectKey+'/cheatsheet" class="pill-link" data-nav="cheatsheet">'+m.navCheat+'</a>' +
      '<a href="#home" class="pill-link subtle" data-nav="switch">'+m.allSubjectsLink+'</a>';
    document.getElementById('footer-note').textContent = m.footerNote;
  }
  function setActiveNav(name){
    document.querySelectorAll(".pill-link").forEach(function(a){
      a.classList.toggle("active", a.getAttribute("data-nav")===name);
    });
  }

  /* ================= HUB (subject picker) ================= */
  function renderHub(){
    applyPalette('math');
    applyLangClass(null);
    renderNav(null);

    var totalChapters=0, totalMcq=0, totalPractice=0;
    SUBJECT_ORDER.forEach(function(k){
      var ch = chaptersOf(k);
      totalChapters += ch.length;
      totalMcq += ch.reduce(function(a,c){return a+c.mcqs.length;},0);
      totalPractice += ch.reduce(function(a,c){return a+c.practice.length;},0);
    });

    // find most recent activity across all subjects
    var lastSubject=null, lastId=null, lastAt=0;
    SUBJECT_ORDER.forEach(function(k){
      var p = progOf(k);
      Object.keys(p).forEach(function(id){
        if((p[id].at||0) >= lastAt){ lastAt = p[id].at||0; lastId = id; lastSubject = k; }
      });
    });

    var html = '<div class="hero">';
    html += '  <div class="eyebrow">CBSE · Class 5 · Narayan School, Bhubaneswar</div>';
    html += '  <h1>🎪 5th Standard Learning Mela</h1>';

    html += '  <div class="stat-row">';

    html += '    <div class="stat-chip"><b>'+totalChapters+'</b><span>Chapters</span></div>';
    html += '    <div class="stat-chip"><b>'+totalMcq+'</b><span>Quiz MCQs</span></div>';
    html += '    <div class="stat-chip"><b>'+totalPractice+'</b><span>Practice Qs</span></div>';

      html += '  <a class="continue-card" href="#s/'+lastSubject+'/chapter/'+lastId+'/quiz">';
      html += '    <span style="font-size:1.8rem">'+lc.icon+'</span>';
      html += '    <span class="txt"><b>'+m.icon+' '+esc(m.cardTitle)+' — '+m.chapterWord+lc.number+': '+esc(lc.title)+'</b><span>'+m.bestScoreWord+' '+lp.score+'/'+byId(lastSubject,lastId).mcqs.length+' · '+lp.accuracy+m.accSuffix+'</span></span>';
      html += '    <span class="go">→</span>';
      html += '  </a>';
    }
    html += '</div>';

    html += '<h2 class="section-title">Choose a subject</h2>';
