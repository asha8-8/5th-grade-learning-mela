<meta charset="UTF-8">
<title>5th Standard Learning Mela</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Bhai+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#FBF6EA; --paper-2:#F1E9D4; --card:#FFFDF7;
    --ink:#221933; --ink-soft:#5B4E72; --ink-faint:#8578A0;
    --indigo:#3B2E7A; --indigo-ink:#FFFFFF;
    --saffron:#F2A71B; --saffron-ink:#221933;
    --magenta:#D1276B; --magenta-ink:#FFFFFF;
    --teal:#0E7C7B; --teal-ink:#FFFFFF;
    --good:#1E8E5A; --good-bg:#E4F5EC;
    --bad:#C0392B; --bad-bg:#FBE7E4;
    --warn:#C97A15; --warn-bg:#FBF0DC;
    --line:#E4D9C0; --line-soft:#EFE7D2;
    --shadow:0 1px 2px rgba(34,25,51,.07),0 10px 28px -14px rgba(34,25,51,.28);
    --radius:18px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#161027; --paper-2:#1E1836; --card:#201A3A;
      --ink:#F3ECFB; --ink-soft:#C1B2E0; --ink-faint:#8A7BB0;
      --indigo:#A79AF7; --indigo-ink:#1A1330;
      --saffron:#F5B94A; --saffron-ink:#221933;
      --magenta:#FF7FB0; --magenta-ink:#2A1020;
      --teal:#3FE0D3; --teal-ink:#08302E;
      --good:#4ADE94; --good-bg:#183527;
      --bad:#FF8C7F; --bad-bg:#3A1E1E;
      --warn:#F5C15E; --warn-bg:#3A2E14;
      --line:#382C58; --line-soft:#2A2148;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#161027; --paper-2:#1E1836; --card:#201A3A;
    --ink:#F3ECFB; --ink-soft:#C1B2E0; --ink-faint:#8A7BB0;
    --indigo:#A79AF7; --indigo-ink:#1A1330;
    --saffron:#F5B94A; --saffron-ink:#221933;
    --magenta:#FF7FB0; --magenta-ink:#2A1020;
    --teal:#3FE0D3; --teal-ink:#08302E;
    --good:#4ADE94; --good-bg:#183527;
    --bad:#FF8C7F; --bad-bg:#3A1E1E;
    --warn:#F5C15E; --warn-bg:#3A2E14;
    --line:#382C58; --line-soft:#2A2148;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Nunito Sans',system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.55; padding-inline:0;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2',system-ui,sans-serif; letter-spacing:.2px; text-wrap:balance; margin:0;}
  body.lang-hindi{ font-family:'Hind','Nunito Sans',system-ui,sans-serif; line-height:1.7; }
  body.lang-hindi h1, body.lang-hindi h2, body.lang-hindi h3, body.lang-hindi .display{ font-family:'Baloo Bhai 2','Baloo 2',system-ui,sans-serif; }
  p{margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  .wrap{ max-width:1080px; margin:0 auto; padding-inline:20px; }
  img{max-width:100%;}
  ::selection{ background:var(--saffron); color:var(--saffron-ink); }
  :focus-visible{ outline:3px solid var(--teal); outline-offset:2px; border-radius:6px; }

  /* ---------- bunting ---------- */
  .bunting{ display:flex; justify-content:center; gap:2px; padding-top:calc(10px + env(safe-area-inset-top,0px)); overflow:hidden; }
  .bunting span{
    width:22px; height:26px;
    clip-path:polygon(0 0,100% 0,50% 100%);
    flex:0 0 auto;
    transform:translateY(-2px) rotate(0.001deg);
    animation:sway 3.2s ease-in-out infinite;
  }
  .bunting span:nth-child(4n+1){background:var(--saffron); animation-delay:0s;}
  .bunting span:nth-child(4n+2){background:var(--magenta); animation-delay:.3s;}
  .bunting span:nth-child(4n+3){background:var(--teal); animation-delay:.6s;}
  .bunting span:nth-child(4n){background:var(--indigo); animation-delay:.9s;}
  @keyframes sway{ 0%,100%{transform:translateY(-2px) rotate(-3deg);} 50%{transform:translateY(-2px) rotate(3deg);} }
  @media (prefers-reduced-motion:reduce){ .bunting span{animation:none;} }

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px; }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(.85rem,3.4vw,1.1rem); text-decoration:none; white-space:nowrap; }
  .brand-badge{ width:34px; height:34px; border-radius:10px; background:var(--indigo); color:var(--indigo-ink); display:flex; align-items:center; justify-content:center; font-size:1.15rem; flex:0 0 auto; }
  .topbar nav{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .pill-link{
    font-weight:700; font-size:.85rem; text-decoration:none; padding:8px 14px; border-radius:999px;
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap;
  }
  .pill-link.active, .pill-link:hover{ background:var(--indigo); color:var(--indigo-ink); border-color:transparent; }
  .pill-link.subtle{ opacity:.85; }

  /* ---------- hero ---------- */
  .hero{ padding-block:28px 8px; text-align:center; }
  .eyebrow{ font-weight:800; font-size:.78rem; letter-spacing:1.6px; text-transform:uppercase; color:var(--magenta); }
  .hero h1{ font-size:clamp(1.9rem,5vw,2.8rem); font-weight:800; margin-block:8px 10px; color:var(--indigo); }
  .hero .sub{ color:var(--ink-soft); font-size:1.02rem; max-width:56ch; margin-inline:auto; }
  .stat-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
  .stat-chip{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 16px; min-width:96px; box-shadow:var(--shadow); }
  .stat-chip b{ display:block; font-family:'Baloo 2',sans-serif; font-size:1.35rem; color:var(--indigo); font-variant-numeric:tabular-nums; }
  .stat-chip span{ font-size:.74rem; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.4px; }

  .continue-card{
    max-width:560px; margin:22px auto 0; background:linear-gradient(135deg,var(--indigo),color-mix(in srgb,var(--indigo) 70%, var(--magenta)));
    color:var(--indigo-ink); border-radius:var(--radius); padding:16px 20px; display:flex; align-items:center; gap:14px; text-decoration:none; box-shadow:var(--shadow);
  }
  .continue-card .txt{ text-align:left; }
  .continue-card .txt b{ display:block; font-family:'Baloo 2',sans-serif; font-size:1.05rem;}
  .continue-card .txt span{ font-size:.82rem; opacity:.9; }
  .continue-card .go{ margin-left:auto; font-size:1.4rem; }

  /* ---------- subject hub ---------- */
  .subject-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; padding-bottom:40px; }
  .subject-card{
    display:flex; flex-direction:column; gap:10px; text-decoration:none; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 20px; box-shadow:var(--shadow); transition:transform .15s ease;
  }
  .subject-card:hover{ transform:translateY(-3px); }
  .subject-card .sc-icon{ width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; }
  .subject-card h3{ font-size:1.25rem; }
  .subject-card .sc-blurb{ color:var(--ink-soft); font-size:.92rem; }
  .subject-card .sc-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:8px; }
  .subject-card .go-row{ display:flex; align-items:center; justify-content:space-between; margin-top:4px; font-weight:800; font-size:.9rem; }

  /* ---------- grid / tickets ---------- */
  .section-title{ font-size:1.3rem; font-weight:700; margin:34px 0 14px; color:var(--indigo); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; padding-bottom:40px; }
  .ticket{
    display:flex; text-decoration:none; color:var(--ink); background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); transition:transform .15s ease;
  }
  .ticket:hover{ transform:translateY(-2px); }
  .ticket-stub{
    flex:0 0 78px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:#fff; position:relative; border-right:2px dashed rgba(255,255,255,.55);
  }
  .ticket-stub .num{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:.72rem; text-transform:uppercase; opacity:.85; }
  .ticket-stub .ico{ font-size:1.7rem; line-height:1; }
  .ticket-body{ padding:14px 16px; flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .ticket-body h3{ font-size:1.05rem; font-weight:700; color:var(--ink); }
  .ticket-body .tag{ font-size:.84rem; color:var(--ink-soft); }
  .ticket-meta{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .chip{ font-size:.72rem; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--paper-2); color:var(--ink-soft); }
  .chip.score-good{ background:var(--good-bg); color:var(--good); }
  .chip.score-mid{ background:var(--warn-bg); color:var(--warn); }
  .chip.score-low{ background:var(--bad-bg); color:var(--bad); }

  /* ---------- chapter page ---------- */
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:.9rem; text-decoration:none; color:var(--ink-soft); margin:18px 0 6px; }
  .chapter-head{ display:flex; gap:16px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:18px;}
  .chapter-head .ico{ flex:0 0 auto; width:58px; height:58px; border-radius:16px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; font-size:1.8rem; }
  .chapter-head h2{ font-size:1.5rem; color:var(--indigo); }
  .chapter-head .tag{ color:var(--magenta); font-weight:700; font-size:.85rem; margin-top:2px; }
  .chapter-head p.sum{ margin-top:8px; color:var(--ink-soft); }

  .tabbar{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tabbtn{
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-weight:800; font-size:.88rem;
    padding:10px 16px; border-radius:12px; cursor:pointer;
  }
  .tabbtn.active{ background:var(--indigo); color:var(--indigo-ink); border-color:transparent; }

  /* concepts */
  .concept-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:var(--shadow); }
  .concept-card h4{ font-size:1.08rem; color:var(--ink); margin-bottom:6px; }
  .concept-card .expl{ color:var(--ink-soft); }
  .trick-box{ margin-top:12px; background:var(--paper-2); border-left:4px solid var(--saffron); border-radius:10px; padding:12px 14px; }
  .trick-box .tt{ font-weight:800; color:var(--saffron); font-size:.86rem; display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .trick-box .how{ font-size:.92rem; color:var(--ink); }
  .trick-box .ex{ margin-top:8px; font-size:.86rem; color:var(--ink-soft); background:var(--card); border:1px dashed var(--line); border-radius:8px; padding:8px 10px; font-variant-numeric:tabular-nums; }

  /* quiz */
  .quiz-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .dots{ display:flex; gap:5px; flex-wrap:wrap; }
  .dot{ width:11px; height:11px; border-radius:50%; background:var(--line); }
  .dot.done-correct{ background:var(--good); }
  .dot.done-wrong{ background:var(--bad); }
  .dot.current{ outline:2px solid var(--indigo); outline-offset:2px; }
  .timer{ font-weight:800; font-family:'Baloo 2',sans-serif; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-variant-numeric:tabular-nums; }
  .q-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  .q-num{ font-size:.78rem; font-weight:800; color:var(--magenta); text-transform:uppercase; letter-spacing:.5px; }
  .q-text{ font-size:1.15rem; font-weight:700; margin:6px 0 16px; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:560px){ .opts{grid-template-columns:1fr;} }
  .opt{
    text-align:left; border:2px solid var(--line); background:var(--paper-2); border-radius:12px; padding:12px 14px;
    font-size:.98rem; font-weight:700; cursor:pointer; color:var(--ink); display:flex; gap:10px; align-items:flex-start;
  }
  .opt .lab{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.76rem; }
  .opt:hover:not(.locked){ border-color:var(--indigo); }
  .opt.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
  .opt.wrong{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  .opt.locked{ cursor:default; }
  .explain-box{ margin-top:16px; padding:14px; border-radius:12px; background:var(--paper-2); border-left:4px solid var(--teal); font-size:.92rem; }
  .explain-box b{ color:var(--teal); }
  .q-actions{ display:flex; justify-content:flex-end; margin-top:16px; }
  .btn{ font-weight:800; border:none; border-radius:999px; padding:11px 22px; cursor:pointer; font-size:.92rem; }
  .btn-primary{ background:var(--indigo); color:var(--indigo-ink); }
  .btn-ghost{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn-saffron{ background:var(--saffron); color:var(--saffron-ink); }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  .finish-card{ text-align:center; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:32px 20px; box-shadow:var(--shadow); }
  .score-ring{ width:130px; height:130px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; flex-direction:column; background:conic-gradient(var(--good) calc(var(--pct)*1%), var(--line-soft) 0); animation:pop .5s ease; }
  @keyframes pop{ from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;} }
  @media (prefers-reduced-motion:reduce){ .score-ring{animation:none;} }
  .score-ring .inner{ width:104px; height:104px; border-radius:50%; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .score-ring .inner b{ font-family:'Baloo 2',sans-serif; font-size:1.7rem; color:var(--ink); }
  .score-ring .inner span{ font-size:.72rem; color:var(--ink-faint); font-weight:700; }
  .finish-msg{ font-family:'Baloo 2',sans-serif; font-size:1.3rem; color:var(--indigo); margin-bottom:6px; }
  .finish-meta{ color:var(--ink-soft); margin-bottom:20px; }
  .finish-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .review-list{ text-align:left; margin-top:24px; display:flex; flex-direction:column; gap:10px; }
  .review-item{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--paper-2); }
  .review-item .qt{ font-weight:700; margin-bottom:4px; }
  .review-item .rt{ font-size:.88rem; }
  .review-item.correct{ border-left:4px solid var(--good); }
  .review-item.wrong{ border-left:4px solid var(--bad); }

  /* practice */
  details.practice-item{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; box-shadow:var(--shadow); overflow:hidden; }
  details.practice-item summary{ cursor:pointer; padding:14px 16px; font-weight:700; list-style:none; display:flex; align-items:center; gap:10px; }
  details.practice-item summary::-webkit-details-marker{ display:none; }
  details.practice-item summary .qbadge{ flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--paper-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:800; }
  details.practice-item summary .reveal-hint{ margin-left:auto; font-size:.78rem; color:var(--teal); font-weight:800; white-space:nowrap; }
  details.practice-item[open] summary{ border-bottom:1px solid var(--line); }
  .practice-body{ padding:14px 16px 16px; }
  .ans-line{ font-weight:800; color:var(--good); margin-bottom:10px; }
  .steps{ margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; color:var(--ink-soft); }

  /* cheat sheet */
  .cs-group h3{ color:var(--indigo); margin:26px 0 10px; font-size:1.1rem; }
  .cs-item{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .cs-item b{ color:var(--saffron); }
  .cs-item .h{ font-size:.9rem; margin-top:3px; color:var(--ink-soft); }

  .footer-note{ text-align:center; color:var(--ink-faint); font-size:.82rem; padding:30px 20px 44px; }

  @media(max-width:480px){
    .subject-grid{ grid-template-columns:1fr; }
  }
</style>

<script>
window.SUBJECT_DATA = {"math": [{"id": "ch1", "number": 1, "title": "We the Travellers – I", "icon": "🚉", "tagline": "Big numbers, big adventures across India!", "summary": "Get ready to travel through the world of big numbers! In this chapter you will learn to read, write and compare numbers as large as lakhs, spot patterns hiding inside number sequences, and round numbers to make quick estimates. These skills are exactly what you need to read population boards, price tags and distance signs on a real journey.", "concepts": [{"heading": "Reading and Writing Large Numbers (Indian System)", "explanation": "In the Indian number system, digits are grouped as ones, tens, hundreds, thousands, ten-thousands and then lakhs. For example, the number 3,56,789 is read as three lakh fifty-six thousand seven hundred eighty-nine.", "trick": {"name": "Comma Trick", "howto": "Starting from the right, put the first comma after 3 digits, then put every next comma after 2 digits. This instantly splits the number into ones-hundreds, thousands, and lakhs groups so you can read it aloud correctly.", "example": "Take 4567890. Comma after first 3 digits from right: 4567,890 -> then every 2 digits: 45,67,890, which is read as forty-five lakh sixty-seven thousand eight hundred ninety."}}, {"heading": "Place Value and Expanded Form", "explanation": "Every digit in a number has a value based on its position, called its place value. For example, in 47,352 the digit 4 sits in the ten-thousands place, so its value is 40,000, not just 4.", "trick": {"name": "Break It Down", "howto": "To expand any number, multiply each digit by the value of its place (ones, tens, hundreds, thousands, ten-thousands, lakhs) and then add all those values together. This turns one big number into simple, small additions.", "example": "Expand 47,352: 4x10000=40000, 7x1000=7000, 3x100=300, 5x10=50, 2x1=2. Adding: 40000+7000+300+50+2 = 47,352."}}, {"heading": "Number Patterns and Sequences", "explanation": "A number pattern follows a fixed rule, like always adding or subtracting the same amount. For example, 5, 10, 15, 20 is a pattern where each number is 5 more than the one before it.", "trick": {"name": "Difference Detective", "howto": "Subtract each term from the next term to find the common difference (the rule). Once you know the rule, keep adding or subtracting it to extend the pattern as far as you like.", "example": "For 7, 14, 21, 28: difference is always 7 (14-7=7, 21-14=7). So the next term is 28+7 = 35."}}, {"heading": "Comparing and Ordering Numbers", "explanation": "To compare two numbers, look at the digit in the highest place value first. For example, to compare 45,230 and 45,203, both start the same until the tens place, where 3 is greater than 0, so 45,230 is the bigger number.", "trick": {"name": "Leftmost Digit Wins", "howto": "Compare the digits of both numbers starting from the leftmost (highest place value) digit. Move right only when digits are equal. The first place where the digits differ tells you which number is bigger.", "example": "Compare 68,452 and 68,425: digits match as 6-8-4, then tens place has 5 vs 2. Since 5 is greater than 2, 68,452 is the bigger number."}}, {"heading": "Rounding Numbers", "explanation": "Rounding replaces a number with a simpler nearby number, useful for quick estimates. For example, 3,462 rounded to the nearest hundred becomes 3,500 because the tens digit 6 tells us to round up.", "trick": {"name": "5 or More, Let it Soar", "howto": "Look at the digit just to the right of the place you are rounding to. If that digit is 5 or more, round the target digit up by one; if it is less than 5, keep the target digit the same and change everything to its right to zero.", "example": "Round 27,431 to the nearest thousand: the hundreds digit is 4, which is less than 5, so we keep the thousands digit as is, giving 27,000."}}, {"heading": "Digit-Swapping Puzzles", "explanation": "You can rearrange a set of digits to form the greatest or smallest possible number. For example, using the digits 3, 0, 7, 5, the greatest number is 7530 and the smallest is 3057 (not 0357, because a number cannot start with zero).", "trick": {"name": "Big to Small, Small to Big", "howto": "For the greatest number, arrange the digits from largest to smallest. For the smallest number, arrange the digits from smallest to largest, but if a zero lands in the very first place, swap it with the next smallest non-zero digit.", "example": "Digits 8, 0, 4, 2: ascending order gives 0,2,4,8 which starts with 0, so swap 0 and 2 to get 2,0,4,8 -> the smallest valid number is 2048."}}], "mcqs": [{"q": "What is the place value of the digit 7 in 3,78,214?", "options": ["70,000", "7,000", "700", "7"], "correct": 0, "explain": "Using place value, the digits from left are lakhs(3), ten-thousands(7), thousands(8), hundreds(2), tens(1), ones(4). So 7 is in the ten-thousands place, giving it a value of 70,000."}, {"q": "How do you write 8,05,213 in words?", "options": ["Eight lakh five thousand two hundred thirteen", "Eighty lakh five thousand two hundred thirteen", "Eight lakh fifty thousand two hundred thirteen", "Eight lakh five hundred thirteen"], "correct": 0, "explain": "Using the Comma Trick groups, 8 is lakh, 05 is thousand, and 213 is hundreds-tens-ones, so it reads as eight lakh five thousand two hundred thirteen."}, {"q": "Which number is greater: 45,678 or 45,687?", "options": ["45,678", "45,687", "They are equal", "Cannot tell"], "correct": 1, "explain": "Using the Leftmost Digit Wins trick, both numbers match until the tens place, where 8 is greater than 7, so 45,687 is greater."}, {"q": "Round 6,342 to the nearest hundred.", "options": ["6,300", "6,400", "6,340", "6,000"], "correct": 0, "explain": "Using 5 or More, Let it Soar: the tens digit is 4, which is less than 5, so we round down and keep the hundreds digit the same, giving 6,300."}, {"q": "Find the next number in the pattern: 12, 24, 36, 48, ___", "options": ["58", "60", "50", "54"], "correct": 1, "explain": "Using the Difference Detective trick, each term is 12 more than the last (24-12=12, 36-24=12), so the next term is 48+12=60."}, {"q": "What is the correct expanded form of 52,908?", "options": ["50,000 + 2,000 + 900 + 0 + 8", "50,000 + 2,000 + 90 + 8", "5,000 + 2,000 + 900 + 8", "50,000 + 200 + 900 + 8"], "correct": 0, "explain": "Using Break It Down, each digit is multiplied by its place value: 5 ten-thousands, 2 thousands, 9 hundreds, 0 tens, 8 ones, which adds up exactly to 52,908. The other options mix up which digit belongs to which place."}, {"q": "What is the smallest 4-digit number that can be formed using the digits 6, 0, 4, 9 (each digit used once)?", "options": ["0,469", "4,069", "4,096", "0,649"], "correct": 1, "explain": "Using Big to Small, Small to Big: arranging digits ascending gives 0,4,6,9, but a number cannot start with 0, so we swap 0 and 4 to get 4,069, the smallest valid number."}, {"q": "Estimate the sum of 289 + 415 by first rounding each number to the nearest hundred.", "options": ["700", "704", "710", "650"], "correct": 0, "explain": "Using 5 or More, Let it Soar: 289 rounds to 300 and 415 rounds to 400, so the quick estimate is 300+400=700 (the exact answer 704 is close but is not the rounded estimate asked for)."}, {"q": "A number pattern is 5, 11, 17, 23, ... What is the 8th term?", "options": ["41", "45", "47", "53"], "correct": 2, "explain": "Using the Difference Detective trick, the common difference is 6. Continuing the pattern: 5,11,17,23,29,35,41,47 — the 8th term is 47."}, {"q": "Using the digits 3, 0, 3, 7, 5, what is the greatest 5-digit number you can form?", "options": ["75,330", "75,303", "73,530", "57,330"], "correct": 0, "explain": "Using Big to Small, arrange all digits from largest to smallest: 7, 5, 3, 3, 0, which gives 75,330, the greatest possible number."}, {"q": "Which of these numbers is the greatest: 4,56,789 or 45,678 or 4,65,789 or 4,56,798?", "options": ["4,56,789", "45,678", "4,65,789", "4,56,798"], "correct": 2, "explain": "Using Leftmost Digit Wins, 45,678 has fewer digits so it is smallest among the lakh numbers. Comparing the rest from the left, 4,65,789 has a 6 in the ten-thousands place while the others have 5, making it the greatest."}, {"q": "Round 8,547 to the nearest thousand and to the nearest hundred. What is the difference between the two rounded numbers?", "options": ["500", "400", "600", "900"], "correct": 0, "explain": "Using 5 or More, Let it Soar: nearest thousand is 9,000 (hundreds digit 5 rounds up) and nearest hundred is 8,500 (tens digit 4 rounds down). The difference is 9,000 - 8,500 = 500."}], "practice": [{"q": "Write the number 4,08,215 in expanded form.", "answer": "4,00,000 + 8,000 + 200 + 10 + 5", "solution": "1) Use the Break It Down trick: identify each digit's place - 4 is lakhs, 0 is ten-thousands, 8 is thousands, 2 is hundreds, 1 is tens, 5 is ones. 2) Multiply each by its place value: 4x100000=4,00,000, 0x10000=0, 8x1000=8,000, 2x100=200, 1x10=10, 5x1=5. 3) Add them: 4,00,000+8,000+200+10+5 = 4,08,215."}, {"q": "Arrange these numbers in ascending order: 34,521; 34,251; 43,125; 34,512.", "answer": "34,251 ; 34,512 ; 34,521 ; 43,125", "solution": "1) Use Leftmost Digit Wins: 43,125 starts with 4 (ten-thousands place) while the rest start with 3, so 43,125 is the largest. 2) Among 34,521; 34,251; 34,512 compare the hundreds digit: 34,251 has 2 (smallest), so it comes first. 3) Compare 34,512 and 34,521 at the tens place: 1 is less than 2, so 34,512 comes before 34,521. 4) Final order: 34,251 ; 34,512 ; 34,521 ; 43,125."}, {"q": "Round 76,842 to the nearest thousand and to the nearest ten-thousand.", "answer": "Nearest thousand: 77,000 ; Nearest ten-thousand: 80,000", "solution": "1) For nearest thousand, look at the hundreds digit which is 8 (5 or more), so round the thousands digit 6 up to 7, giving 77,000. 2) For nearest ten-thousand, look at the thousands digit which is 6 (5 or more), so round the ten-thousands digit 7 up to 8, giving 80,000."}, {"q": "Find the missing number in the pattern: 100, 91, 82, 73, ___, 55.", "answer": "64", "solution": "1) Use the Difference Detective trick: 100-91=9, 91-82=9, 82-73=9, so the rule is subtract 9 each time. 2) Applying the rule: 73-9=64. 3) Check: 64-9=55, which matches the given next term, confirming 64 is correct."}, {"q": "Using the digits 2, 9, 0, 6, form the greatest and the smallest 4-digit numbers (use each digit once).", "answer": "Greatest: 9,620 ; Smallest: 2,069", "solution": "1) For greatest, use Big to Small: arrange digits descending as 9,6,2,0 giving 9,620. 2) For smallest, arrange digits ascending as 0,2,6,9, but this starts with 0, which is not allowed. 3) Swap 0 with the next smallest digit, 2, to get 2,0,6,9, giving the smallest valid number 2,069."}, {"q": "The population of Town A is 2,45,678 and Town B is 2,45,687. Which town has more people, and by how many?", "answer": "Town B, by 9", "solution": "1) Use Leftmost Digit Wins: both numbers match up to the hundreds place (2-4-5-6), then compare the tens place: Town B has 8, Town A has 7, so Town B is bigger. 2) Find the exact difference: 2,45,687 - 2,45,678 = 9. 3) So Town B has 9 more people than Town A."}, {"q": "A bus completes three trips covering 4,678 km, 3,215 km and 5,842 km. Estimate the total distance travelled by rounding each distance to the nearest thousand km before adding.", "answer": "about 14,000 km", "solution": "1) Use 5 or More, Let it Soar on each number: 4,678 rounds to 5,000 (hundreds digit 6), 3,215 rounds to 3,000 (hundreds digit 2), 5,842 rounds to 6,000 (hundreds digit 8). 2) Add the rounded numbers: 5,000+3,000+6,000 = 14,000 km. 3) This quick estimate tells us the actual total (13,735 km) is reasonably close to 14,000 km."}, {"q": "Using the digits 1, 4, 0, 7, 7, form the greatest possible 5-digit number, then state the place value of the digit in its ten-thousands place.", "answer": "77,410 ; place value of ten-thousands digit = 70,000", "solution": "1) Use Big to Small: arrange digits descending as 7,7,4,1,0 to get 77,410, the greatest possible number. 2) The digit in the ten-thousands place is the first digit, 7. 3) Its place value is 7 x 10,000 = 70,000."}]}, {"id": "ch2", "number": 2, "title": "Fractions", "icon": "🍕", "tagline": "Slicing wholes and groups into equal, fair shares!", "summary": "Have you ever shared a chocolate bar or a plate of mangoes with your friends? That is exactly what fractions are about! In this chapter you will learn to name, compare, simplify and combine equal parts of things, and use them to solve fun everyday problems.", "concepts": [{"heading": "Fractions as Parts of a Whole and a Group", "explanation": "A fraction shows equal parts of one whole thing, or equal parts of a group of things. If Amma cuts a roti into 4 equal pieces and you eat 1 piece, you ate 1/4 of the roti. If there are 12 mangoes in a basket and 3 of them are ripe, then 3/12 of the mangoes are ripe.", "trick": {"name": "Whole vs Group Check", "howto": "Before writing a fraction, ask yourself: am I cutting ONE thing into pieces, or looking at PART of a GROUP of things? Either way, the total number of equal parts (or total items) becomes the denominator, and the parts you care about become the numerator.", "example": "A box has 20 pencils, and 5 are red. Denominator = total pencils = 20, Numerator = red pencils = 5, so red pencils = 5/20 of the box."}}, {"heading": "Numerator and Denominator", "explanation": "In a fraction like 3/5, the bottom number (denominator) tells us how many equal parts the whole is divided into, and the top number (numerator) tells us how many of those parts we mean. For example, in 3/5 of a 5 km road, the road is divided into 5 equal 1 km parts, and 3/5 means 3 of those parts, that is, 3 km.", "trick": {"name": "Denominator = Divide First", "howto": "To quickly find a fraction of a quantity, first divide the whole by the denominator to find the size of ONE part, then multiply by the numerator. This turns a fraction-of-a-quantity question into two easy steps: divide, then multiply.", "example": "Find 3/5 of ₹50: Step 1: 50 ÷ 5 = ₹10 (value of one part). Step 2: 10 × 3 = ₹30. So 3/5 of ₹50 is ₹30."}}, {"heading": "Equivalent Fractions", "explanation": "Equivalent fractions are different fractions that show the same amount, like 1/2 and 2/4, which both mean half. You can make an equivalent fraction by multiplying or dividing the numerator and denominator by the same number. For example, 2/3 of a 300 km trip is the same distance as 4/6 of it, because both numbers were multiplied by 2.", "trick": {"name": "Same Number, Both Floors", "howto": "To make an equivalent fraction, multiply or divide the numerator and denominator by the SAME number, never just one of them. Picture a lift moving both floors, top and bottom, together at the same time.", "example": "Make an equivalent fraction of 3/4 by multiplying top and bottom by 5: 3 × 5 = 15 and 4 × 5 = 20, so 3/4 = 15/20."}}, {"heading": "Comparing Fractions", "explanation": "When two fractions have the same denominator, the one with the bigger numerator is bigger, because the pieces are the same size. When two fractions have the same numerator, the one with the smaller denominator is bigger, because it has been cut into fewer, larger pieces. For example, 3/8 of a chocolate bar is more than 2/8 of the same bar, since eighths are equal-sized pieces.", "trick": {"name": "Same Bottom, Same Top Rule", "howto": "If the denominators match, just compare the numerators; the bigger numerator wins. If the numerators match, compare the denominators; the SMALLER denominator wins, because fewer cuts mean bigger pieces. This lets you compare fractions instantly without drawing pictures.", "example": "Compare 2/5 and 2/9: the numerators are equal (2 = 2), so compare denominators. 5 is smaller than 9, so 2/5 is bigger than 2/9."}}, {"heading": "Simplifying Fractions", "explanation": "Simplifying a fraction means writing it with the smallest possible numerator and denominator that still show the same value, by dividing both by their highest common factor (HCF). For example, 8/12 simplifies to 2/3 because both 8 and 12 can be divided by 4. Simplified fractions are easier to compare and to use in later calculations.", "trick": {"name": "Find the Biggest Common Friend", "howto": "List a few common factors of the numerator and denominator, pick the biggest one (the HCF), and divide both numbers by it in one step, instead of simplifying little by little. If both numbers are even, repeatedly dividing by 2 also works well.", "example": "Simplify 18/24: the HCF of 18 and 24 is 6. 18 ÷ 6 = 3, 24 ÷ 6 = 4, so 18/24 = 3/4."}}, {"heading": "Adding and Subtracting Like Fractions", "explanation": "Like fractions have the same denominator, so to add or subtract them we only add or subtract the numerators and keep the denominator unchanged. For example, if you drink 2/6 of a bottle of milk in the morning and 3/6 in the evening, you drank 2/6 + 3/6 = 5/6 of the bottle that day. Always check afterwards whether the answer can be simplified.", "trick": {"name": "Keep the Bottom, Work the Top", "howto": "Since the pieces are already the same size, just add or subtract the numerators directly and copy the denominator unchanged underneath. Then quickly check if the result can be simplified using the Biggest Common Friend trick.", "example": "7/10 - 3/10 = (7 - 3)/10 = 4/10, which simplifies to 2/5 by dividing top and bottom by 2."}}], "mcqs": [{"q": "What is the numerator in the fraction 5/8?", "options": ["5", "8", "3", "13"], "correct": 0, "explain": "The numerator is the top number of a fraction. In 5/8, the top number is 5, telling us how many parts out of 8 we are talking about."}, {"q": "A pizza is cut into 6 equal slices, and you eat 2 slices. What fraction of the pizza did you eat?", "options": ["2/6", "6/2", "4/6", "2/4"], "correct": 0, "explain": "Using the Whole vs Group Check trick, the total equal slices (6) is the denominator and the slices eaten (2) is the numerator, giving 2/6."}, {"q": "Which fraction is equivalent to 1/2?", "options": ["2/4", "2/3", "3/4", "1/3"], "correct": 0, "explain": "Using the Same Number, Both Floors trick, multiply both numerator and denominator of 1/2 by 2 to get 2/4, which shows the same amount."}, {"q": "Simplify the fraction 4/8 to its lowest terms.", "options": ["1/2", "2/4", "4/8", "1/4"], "correct": 0, "explain": "Using Find the Biggest Common Friend, the HCF of 4 and 8 is 4. Dividing both by 4 gives 1/2, the simplest form."}, {"q": "Which is bigger, 3/7 or 3/10?", "options": ["3/7", "3/10", "They are equal", "Cannot be compared"], "correct": 0, "explain": "Using the Same Bottom, Same Top Rule, the numerators are equal (3 = 3), so the fraction with the smaller denominator, 3/7, is bigger because its pieces are larger."}, {"q": "Add 2/9 + 4/9 and write the answer in simplest form.", "options": ["6/9", "2/3", "6/18", "3/9"], "correct": 1, "explain": "Using Keep the Bottom, Work the Top, add the numerators: 2 + 4 = 6, giving 6/9. Using the Biggest Common Friend (HCF = 3), 6/9 simplifies to 2/3."}, {"q": "A basket has 24 mangoes. If 1/4 of them are ripe, how many mangoes are ripe?", "options": ["6", "4", "8", "20"], "correct": 0, "explain": "Using the Denominator = Divide First trick: 24 ÷ 4 = 6 (value of one part), then multiply by the numerator 1, giving 6 ripe mangoes."}, {"q": "Subtract 7/12 - 5/12 and give the answer in simplest form.", "options": ["1/6", "2/12", "12/24", "2/24"], "correct": 0, "explain": "Using Keep the Bottom, Work the Top: 7 - 5 = 2, giving 2/12. Using Find the Biggest Common Friend (HCF = 2), 2/12 simplifies to 1/6."}, {"q": "Which pair of fractions is NOT equivalent?", "options": ["2/3 and 4/6", "3/5 and 6/10", "4/8 and 1/2", "3/4 and 5/6"], "correct": 3, "explain": "Using the Same Number, Both Floors trick, check if multiplying top and bottom by the same number turns one fraction into the other. No single number turns 3/4 into 5/6 (0.75 is not equal to 0.833), so this pair is not equivalent."}, {"q": "Simplify 36/48 to its lowest terms.", "options": ["3/4", "6/8", "9/12", "4/3"], "correct": 0, "explain": "Using Find the Biggest Common Friend, the HCF of 36 and 48 is 12. Dividing both by 12 gives 3/4, the fully simplified fraction, while 6/8 and 9/12 are only partly simplified."}, {"q": "Ravi has ₹360. He spends 5/9 of it on a cricket bat. How much money is left with him?", "options": ["₹160", "₹200", "₹40", "₹320"], "correct": 0, "explain": "Using Denominator = Divide First: 360 ÷ 9 = ₹40 (one part). Since 5/9 was spent, 4/9 is left: 4 × 40 = ₹160."}, {"q": "A ribbon is 7/8 m long. Priya cuts off 3/8 m, and then cuts off another 2/8 m. What length of ribbon is left, in simplest form?", "options": ["1/4 m", "2/8 m", "1/2 m", "3/8 m"], "correct": 0, "explain": "Using Keep the Bottom, Work the Top: 7 - 3 - 2 = 2, giving 2/8 m. Using Find the Biggest Common Friend (HCF = 2), 2/8 simplifies to 1/4 m."}], "practice": [{"q": "In a class of 30 students, 18 are girls. What fraction of the class are girls, in simplest form?", "answer": "3/5", "solution": "1) Whole vs Group Check: fraction = girls/total = 18/30. 2) Find the Biggest Common Friend: HCF of 18 and 30 is 6. 3) Divide both by 6: 18 ÷ 6 = 3, 30 ÷ 6 = 5. 4) Answer = 3/5."}, {"q": "Find an equivalent fraction of 4/7 that has a denominator of 21.", "answer": "12/21", "solution": "1) Same Number, Both Floors: find what 7 is multiplied by to get 21, that is 21 ÷ 7 = 3. 2) Multiply the numerator by the same number: 4 × 3 = 12. 3) So 4/7 = 12/21."}, {"q": "Which is bigger, 5/6 or 5/9?", "answer": "5/6", "solution": "1) Same Bottom, Same Top Rule: the numerators are equal (5 = 5), so compare denominators. 2) 6 is smaller than 9, meaning sixths are bigger pieces than ninths. 3) Therefore 5/6 is bigger than 5/9."}, {"q": "Simplify 45/60 to its lowest terms.", "answer": "3/4", "solution": "1) Find the Biggest Common Friend of 45 and 60: HCF = 15. 2) Divide both numbers by 15: 45 ÷ 15 = 3, 60 ÷ 15 = 4. 3) Simplified fraction = 3/4."}, {"q": "Add 3/8 + 5/8 and give the answer in simplest form.", "answer": "1 (whole)", "solution": "1) Keep the Bottom, Work the Top: denominators are the same (8), so add numerators: 3 + 5 = 8. 2) Sum = 8/8. 3) 8/8 means all 8 parts are used, which is one whole. Answer = 1."}, {"q": "A tank holds 90 litres of milk. If 2/5 of the milk is sold in the morning, how many litres were sold?", "answer": "36 litres", "solution": "1) Denominator = Divide First: 90 ÷ 5 = 18 litres (value of one part). 2) Multiply by the numerator: 18 × 2 = 36. 3) Milk sold = 36 litres."}, {"q": "A jar has 5/6 litre of honey. Priya uses 1/6 litre in the morning and 2/6 litre in the evening. How much honey is left, in simplest form?", "answer": "1/3 litre", "solution": "1) Keep the Bottom, Work the Top: same denominator 6, so subtract numerators: 5 - 1 - 2 = 2. 2) Remaining = 2/6. 3) Find the Biggest Common Friend: HCF(2, 6) = 2, so 2/6 = 1/3. 4) Honey left = 1/3 litre."}, {"q": "A shopkeeper had ₹420. He spent 2/7 of it on notebooks and 3/7 of it on pens. What fraction of the money is left, and how much money is that?", "answer": "2/7 of the money is left, which is ₹120", "solution": "1) Keep the Bottom, Work the Top: total spent fraction = 2/7 + 3/7 = 5/7. 2) Fraction left = 7/7 - 5/7 = 2/7. 3) Denominator = Divide First: 420 ÷ 7 = ₹60 (value of one part). 4) Multiply by numerator 2: 60 × 2 = ₹120. 5) So 2/7 of the money, which is ₹120, is left."}]}, {"id": "ch3", "number": 3, "title": "Angles as Turns", "icon": "🔄", "tagline": "Spin, turn, and discover angles all around you!", "summary": "Have you ever watched a clock's hands sweep around, or turned a steering wheel while pretending to drive? In this chapter, you will learn that angles are simply turns, and you will measure them in fun fractions like quarter, half, and full turns. By the end, you will be able to spot angles everywhere, from spinning fans to opening doors, and name them like a true maths expert!", "concepts": [{"heading": "What Is an Angle Turn?", "explanation": "An angle is formed when something turns or rotates from one direction to another, like a door swinging open on its hinges. Think of the minute hand of a clock moving from one number to another - that movement is a turn. The amount of turning tells us the size of the angle.", "trick": {"name": "Hand-as-Pointer Trick", "howto": "Hold your arm straight out to show the starting direction, then swing it to the ending direction to feel how much you turned. This helps you guess whether a turn is small (acute), a quarter, a half, or more, before doing any calculation.", "example": "To check the turn from facing the blackboard to facing the door, point your arm at the blackboard, then swing it to point at the door. If your arm makes a corner like the letter L, you turned a quarter turn (90 degrees)."}}, {"heading": "Clockwise and Anticlockwise", "explanation": "Clockwise means turning in the same direction as a clock's hands move, from 12 to 3 to 6 to 9. Anticlockwise is the opposite direction, from 12 to 9 to 6 to 3. Opening a jar lid to close it is usually clockwise, while opening it is anticlockwise.", "trick": {"name": "Clock Face Memory Trick", "howto": "Picture a clock face in your mind and trace the numbers 12-3-6-9 with your finger. That direction is always clockwise, and tracing 12-9-6-3 is always anticlockwise. Use this picture whenever a question describes a turning direction and you are unsure which way it goes.", "example": "A steering wheel turned from the top position toward the right side is turning clockwise, just like tracing from 12 towards 3 on a clock face."}}, {"heading": "Fractions of a Turn", "explanation": "A full turn brings you all the way back to where you started, like a compass needle spinning all the way around. A half turn is exactly half of that, a quarter turn is half of a half turn, and a three-quarter turn is three of those quarter turns put together. Rangoli patterns often use quarter turns to repeat a design around a center point.", "trick": {"name": "Slice-the-Circle Trick", "howto": "Picture a circle cut into 4 equal slices, like a chapati cut into quarters. One slice is a quarter turn, two slices side by side make a half turn, and three slices make a three-quarter turn, so you can count slices instead of guessing.", "example": "A door that swings open to stand exactly sideways to the wall, needing 3 imaginary slices out of 4, has opened a three-quarter turn."}}, {"heading": "Turns to Degrees", "explanation": "Every full turn measures exactly 360 degrees, written as 360 degrees. Since a quarter turn is one of four equal parts, it equals 360 degrees divided by 4, which is 90 degrees. A half turn is two quarters, so it is 180 degrees, and a three-quarter turn is three quarters, so it is 270 degrees.", "trick": {"name": "Times-90 Trick", "howto": "Count how many quarter turns are being described, then multiply that count by 90 to get the answer in degrees instantly, without drawing anything. One quarter is 90, two quarters is 180, three quarters is 270, and four quarters is 360.", "example": "A wheel that spins one and a half turns, which is 6 quarter turns, has turned 6 times 90, which equals 540 degrees."}}, {"heading": "Naming the Angle Types", "explanation": "A right angle looks exactly like the corner of a square or a book and measures exactly 90 degrees. A straight angle looks like a straight line and measures exactly 180 degrees. An acute angle is smaller than a right angle, less than 90 degrees, while an obtuse angle is bigger than a right angle but smaller than a straight angle, between 90 and 180 degrees.", "trick": {"name": "Book-Corner Compare Trick", "howto": "Hold the corner of a notebook against any angle you see. If the angle fits inside the corner with a gap left over, it is acute. If it matches exactly, it is a right angle. If the angle spills outside the corner, it is obtuse, unless it forms a straight line, in which case it is straight.", "example": "Checking the angle where a half-open door meets the wall: it spills past the notebook corner but is not a flat line, so it is an obtuse angle."}}, {"heading": "Turns All Around Us", "explanation": "Angles as turns appear everywhere in daily life: a clock's hands turning, a steering wheel being rotated, a door swinging on its hinges, and a compass needle pointing to new directions. Noticing these turns helps us connect maths to the real world around us, from spinning tops to rotating ceiling fans.", "trick": {"name": "Real-World Spotting Trick", "howto": "Whenever you see something rotate, quickly ask yourself two questions: which direction is it turning, clockwise or anticlockwise, and how big a slice of a full circle did it move. Answering these two questions turns any real object into an easy angle question.", "example": "Watching a ceiling fan blade go from pointing north to pointing east, you can say it moved clockwise by a quarter turn, which is 90 degrees."}}], "mcqs": [{"q": "The minute hand of a clock moves from 12 to 3. What is this turn called?", "options": ["A quarter turn clockwise", "A half turn clockwise", "A quarter turn anticlockwise", "A full turn"], "correct": 0, "explain": "From 12 to 3 is one of four equal slices of the clock face, moving in the same direction as the clock hands, so it is a quarter turn clockwise, as shown by the Slice-the-Circle Trick."}, {"q": "How many degrees are there in a full turn?", "options": ["90 degrees", "180 degrees", "270 degrees", "360 degrees"], "correct": 3, "explain": "A full turn brings you back to the exact starting position and always measures 360 degrees, the biggest of the turn measurements you have learned."}, {"q": "Which direction is anticlockwise?", "options": ["The same direction as clock hands move", "The opposite direction to clock hands", "Always to the right", "Always straight up"], "correct": 1, "explain": "Anticlockwise means turning the opposite way to how clock hands move, tracing 12-9-6-3 instead of 12-3-6-9, using the Clock Face Memory Trick."}, {"q": "A right angle is the same as which fraction of a turn?", "options": ["Half turn", "Quarter turn", "Three-quarter turn", "Full turn"], "correct": 1, "explain": "A right angle measures exactly 90 degrees, which is exactly one quarter of a full 360 degree turn."}, {"q": "A door starts closed and swings open until it has made a half turn from its starting position. How many degrees has it opened?", "options": ["90 degrees", "180 degrees", "270 degrees", "360 degrees"], "correct": 1, "explain": "A half turn equals two quarter turns, and using the Times-90 Trick, 2 times 90 equals 180 degrees."}, {"q": "Reena turns a steering wheel a three-quarter turn clockwise. How many degrees did she turn it?", "options": ["90 degrees", "180 degrees", "270 degrees", "360 degrees"], "correct": 2, "explain": "A three-quarter turn is three quarter turns, and by the Times-90 Trick, 3 times 90 equals 270 degrees."}, {"q": "An angle measures 150 degrees. What type of angle is it?", "options": ["Acute", "Right", "Obtuse", "Straight"], "correct": 2, "explain": "150 degrees is more than 90 degrees, a right angle, but less than 180 degrees, a straight angle, so using the Book-Corner Compare Trick it spills past the notebook corner - it is obtuse."}, {"q": "A compass needle points North. It turns clockwise, passing East and South, until it points West. What fraction of a turn and how many degrees is this?", "options": ["Quarter turn, 90 degrees", "Half turn, 180 degrees", "Three-quarter turn, 270 degrees", "Full turn, 360 degrees"], "correct": 2, "explain": "Going clockwise from North, the needle passes East (quarter), South (half), and reaches West after three-quarters of a turn, which is 270 degrees by the Times-90 Trick."}, {"q": "A wheel spins 450 degrees. Using the quickest method, how many full turns and extra degrees is this?", "options": ["1 full turn and a quarter turn extra", "1 full turn and a half turn extra", "2 full turns exactly", "1 full turn and a three-quarter turn extra"], "correct": 0, "explain": "Using the Times-90 Trick in reverse, dividing 450 by 360 gives 1 full turn with 90 degrees left over, and 90 degrees is exactly a quarter turn."}, {"q": "Ravi says a straight angle is the same as a full turn. Is he correct?", "options": ["Yes, both measure 360 degrees", "No, a straight angle is 180 degrees, a half turn, while a full turn is 360 degrees", "Yes, both look like a straight line", "No, a straight angle is bigger than a full turn"], "correct": 1, "explain": "A straight angle measures 180 degrees, exactly a half turn, while a full turn measures 360 degrees. Using the Times-90 Trick, 180 degrees is only 2 quarters, not 4, so Ravi mixed up the two."}, {"q": "Which pair correctly matches the turn with its degree measure?", "options": ["Three-quarter turn = 240 degrees", "Half turn = 90 degrees", "Quarter turn = 90 degrees", "Full turn = 270 degrees"], "correct": 2, "explain": "Only quarter turn = 90 degrees is correctly matched. Using the Times-90 Trick, three-quarter turn should be 270 (not 240), half turn should be 180 (not 90), and full turn should be 360 (not 270)."}, {"q": "A fan blade starts pointing East and turns clockwise, passing South and West, until it points North. What is the smallest clockwise turn from East to North?", "options": ["Quarter turn, 90 degrees", "Half turn, 180 degrees", "Three-quarter turn, 270 degrees", "Full turn, 360 degrees"], "correct": 2, "explain": "Moving clockwise from East you pass South and West before reaching North, covering three of the four quarter-turns, so using the Times-90 Trick that is 3 times 90 equals 270 degrees, even though anticlockwise it would only be a quarter turn - direction matters."}], "practice": [{"q": "What do we call a turn that brings you all the way back to your starting position?", "answer": "A full turn (360 degrees)", "solution": "1) A turn that returns you exactly to where you started is the biggest simple turn we name, called a full turn. 2) Using the Times-90 Trick, a full turn is 4 quarter turns. 3) 4 times 90 equals 360 degrees."}, {"q": "Meena turns a doorknob a quarter turn clockwise. How many degrees does she turn it?", "answer": "90 degrees", "solution": "1) A quarter turn is one of four equal parts of a full circle. 2) Using the Times-90 Trick, multiply 1 quarter by 90. 3) 1 times 90 equals 90 degrees."}, {"q": "A ceiling fan blade moves from pointing at the door to pointing at the window, which is a half turn away. How many degrees is this, and how many quarter turns is it made of?", "answer": "180 degrees, made of 2 quarter turns", "solution": "1) A half turn equals 2 quarter turns. 2) Using the Times-90 Trick, 2 times 90 equals 180 degrees. 3) So the blade moved 180 degrees, made of 2 quarter turns."}, {"q": "Classify this angle: an angle that measures 45 degrees. Is it acute, right, obtuse, or straight?", "answer": "Acute", "solution": "1) A right angle is exactly 90 degrees. 2) 45 degrees is less than 90 degrees. 3) Using the Book-Corner Compare Trick, since it is smaller than a right angle with a gap left over, 45 degrees is an acute angle."}, {"q": "A steering wheel is turned a three-quarter turn anticlockwise. Name the direction and find the degrees turned.", "answer": "Anticlockwise, 270 degrees", "solution": "1) Three-quarter turn means 3 out of 4 equal parts. 2) Using the Times-90 Trick, 3 times 90 equals 270 degrees. 3) The direction stated is anticlockwise, opposite to clock hands, so the wheel turned 270 degrees anticlockwise."}, {"q": "A spinning top makes 2 full turns and then an extra quarter turn. What is the total angle turned, in degrees?", "answer": "810 degrees", "solution": "1) Each full turn is 360 degrees, so 2 full turns equal 2 times 360, which is 720 degrees. 2) An extra quarter turn adds 90 degrees using the Times-90 Trick. 3) Total equals 720 plus 90, which is 810 degrees."}, {"q": "A clock's minute hand moves from 12 to 9, going the short way through 11 and 10 (anticlockwise). What fraction of a turn and how many degrees is this?", "answer": "Quarter turn anticlockwise, 90 degrees", "solution": "1) The clock face is divided into 12 equal hour marks, and moving from 12 to 9 the short way passes 11 and 10, that is 3 marks. 2) 3 out of 12 marks is the same fraction as 1 out of 4, which is a quarter turn. 3) Using the Times-90 Trick for one quarter, 1 times 90 equals 90 degrees, and since we moved opposite to normal clock direction, it is anticlockwise."}, {"q": "A rangoli design is made by rotating a petal shape. The first petal points North. To draw the second petal, the artist rotates the shape a three-quarter turn clockwise. Then for the third petal, she rotates it a further quarter turn clockwise from the second petal's position. What is the total turn from the first petal to the third petal, and in which direction?", "answer": "360 degrees clockwise, a full turn back to the start", "solution": "1) The second petal is a three-quarter turn (270 degrees) clockwise from the first. 2) The third petal is a further quarter turn (90 degrees) clockwise from the second. 3) Total turn equals 270 plus 90, which is 360 degrees. Using the Times-90 Trick this equals 4 quarter turns, so the third petal has made a full turn clockwise and points the same way as the first petal, back at North."}]}, {"id": "ch4", "number": 4, "title": "We the Travellers – II", "icon": "🚆", "tagline": "Add, subtract and estimate your way across the map!", "summary": "Our journey continues into even bigger numbers, past lakhs and beyond! In this chapter you will add and subtract large numbers with carrying and borrowing, estimate answers quickly by rounding, and solve real travel problems like total distances, ticket counts and city populations. These are the very tools travellers, shopkeepers and engineers use every day.", "concepts": [{"heading": "Numbers Beyond Lakhs", "explanation": "After 9,99,999 comes 10,00,000, which is ten lakh, and after 99,99,999 comes 1,00,00,000, which is one crore. For example, a city's population might be written as 12,50,000, read as twelve lakh fifty thousand.", "trick": {"name": "Group of 2 Trick", "howto": "After marking off the first 3 digits from the right for ones-tens-hundreds, group every remaining pair of digits together to name lakhs, ten-lakhs and crores as you move left. This makes reading even very large numbers manageable.", "example": "For 1,23,45,678: groups are 1 (crore), 23 (lakh), 45 (thousand), 678 (hundreds-tens-ones), read as one crore twenty-three lakh forty-five thousand six hundred seventy-eight."}}, {"heading": "Adding Large Numbers (with Carrying)", "explanation": "To add large numbers, line them up by place value and add column by column starting from the ones place. When a column's sum is 10 or more, carry the extra 1 to the next column. For example, adding 34,567 and 18,749 gives 53,316.", "trick": {"name": "Column Carry Countdown", "howto": "Add the ones column first and write only the last digit of the sum, carrying the tens digit to the next column. Repeat this for tens, hundreds, thousands and beyond, always carrying forward whenever a column's total reaches 10 or more.", "example": "Add 456 + 278: ones 6+8=14, write 4 carry 1; tens 5+7+1=13, write 3 carry 1; hundreds 4+2+1=7. Result: 734."}}, {"heading": "Subtracting Large Numbers (with Borrowing)", "explanation": "To subtract, line up numbers by place value and subtract column by column from the ones place. If the top digit is smaller than the bottom digit, borrow 1 from the next higher place. For example, 50,000 - 27,468 = 22,532.", "trick": {"name": "Borrow and Cross", "howto": "When the top digit in a column is smaller than the digit you are subtracting, cross out the next digit to the left, reduce it by 1, and add 10 to the current column's top digit before subtracting. If that next digit is 0, keep borrowing further left until you find a digit to reduce.", "example": "Subtract 502 - 168: ones 2 is less than 8, borrow from tens (0), which is 0 so borrow from hundreds too: 502 becomes 4(9)(12); ones 12-8=4, tens 9-6=3, hundreds 4-1=3. Result: 334."}}, {"heading": "Estimating Sums and Differences", "explanation": "Estimation means rounding numbers first to get a quick, approximate answer before or instead of exact calculation. For example, to estimate 3,456 + 5,890, round to 3,000 + 6,000 = 9,000.", "trick": {"name": "Round First, Add Fast", "howto": "Round every number to the same place value (like the nearest thousand or hundred) using 5 or More, Let it Soar, then quickly add or subtract the rounded numbers. Use this estimate to check whether your exact answer is reasonable.", "example": "Estimate 6,789 - 2,345 by rounding to nearest thousand: 7,000 - 2,000 = 5,000, which is close to the exact answer 4,444."}}, {"heading": "More Complex Number Patterns", "explanation": "Some patterns do not have a constant difference; instead, the difference itself changes in a pattern. For example, in 2, 4, 8, 14, 22, the differences are 2, 4, 6, 8, which themselves increase by 2 each time.", "trick": {"name": "Second Difference Trick", "howto": "If the differences between terms are not the same, find the differences between those differences (the second differences). If the second differences are constant, use that constant to extend the first differences, and then extend the pattern.", "example": "For 3, 6, 11, 18: differences are 3, 5, 7 (increasing by 2 each time). Next difference is 7+2=9, so the next term is 18+9=27."}}, {"heading": "Real-World Travel Word Problems", "explanation": "Word problems about distances, tickets and populations combine addition and subtraction of large numbers to answer everyday questions. For example, if a train travels 245 km on one day and 389 km the next, the total distance travelled is 634 km.", "trick": {"name": "Estimate-Then-Exact", "howto": "First round the numbers in the problem to make a quick estimate of the answer, then carefully compute the exact answer using column addition or subtraction, and finally check that your exact answer is close to your estimate.", "example": "A trip of 1,245 km followed by 987 km: estimate 1,000+1,000=2,000 km, exact answer is 1,245+987=2,232 km, which is close to the estimate, so the answer is reasonable."}}], "mcqs": [{"q": "What number comes right after 9,99,999?", "options": ["10,00,000", "1,00,000", "9,99,9910", "10,99,999"], "correct": 0, "explain": "Using the Group of 2 trick, when all digits in the ones-to-lakhs places are 9, adding 1 carries all the way to create a new ten-lakhs digit, giving 10,00,000 (ten lakh)."}, {"q": "Add 234 + 189 using column addition.", "options": ["413", "423", "433", "443"], "correct": 1, "explain": "Using Column Carry Countdown: ones 4+9=13, write 3 carry 1; tens 3+8+1=12, write 2 carry 1; hundreds 2+1+1=4. Result: 423."}, {"q": "Subtract 500 - 268.", "options": ["232", "242", "332", "238"], "correct": 0, "explain": "Using Borrow and Cross: since 500 has zeros, borrow across to make it 4(9)(10); ones 10-8=2, tens 9-6=3, hundreds 4-2=2. Result: 232."}, {"q": "Round 6,758 to the nearest hundred for a quick estimate.", "options": ["6,700", "6,750", "6,800", "6,000"], "correct": 2, "explain": "Using Round First, Add Fast (5 or More, Let it Soar): the tens digit is 5, which is 5 or more, so round the hundreds digit up from 7 to 8, giving 6,800."}, {"q": "Add 45,678 + 27,345 using the Column Carry Countdown trick.", "options": ["72,023", "73,023", "73,123", "72,913"], "correct": 1, "explain": "Adding column by column with carrying: ones 8+5=13 (write 3, carry 1), tens 7+4+1=12 (write 2, carry 1), hundreds 6+3+1=10 (write 0, carry 1), thousands 5+7+1=13 (write 3, carry 1), ten-thousands 4+2+1=7. Result: 73,023."}, {"q": "Subtract 82,004 - 35,678 using the Borrow and Cross trick.", "options": ["46,326", "46,336", "45,326", "47,326"], "correct": 0, "explain": "Borrowing across the zeros in 82,004 step by step and subtracting each column gives 46,326."}, {"q": "Estimate the sum of 3,456 + 5,890 by rounding each number to the nearest thousand first.", "options": ["10,000", "8,000", "9,000", "9,500"], "correct": 2, "explain": "Using Round First, Add Fast: 3,456 rounds to 3,000 and 5,890 rounds to 6,000, so the quick estimate is 3,000+6,000=9,000."}, {"q": "A train travels 128 km on Monday and 245 km on Tuesday. What is the exact total distance travelled?", "options": ["363 km", "373 km", "383 km", "473 km"], "correct": 1, "explain": "Using Estimate-Then-Exact, the estimate is 100+250=350 km, and the exact sum 128+245=373 km is close to this estimate, confirming it is correct."}, {"q": "Using the Second Difference trick, find the missing term: 3, 6, 11, 18, ___", "options": ["24", "25", "27", "29"], "correct": 2, "explain": "The differences are 3, 5, 7, which increase by 2 each time (the second difference). So the next difference is 7+2=9, giving the next term as 18+9=27."}, {"q": "Subtract 1,00,000 - 45,678.", "options": ["53,322", "54,322", "54,332", "55,322"], "correct": 1, "explain": "Using Borrow and Cross across the string of zeros in 1,00,000, careful column-by-column subtraction gives 54,322."}, {"q": "The distance from City P to City Q is 4,568 km and from City Q to City R is 3,795 km. Which statement is true?", "options": ["Estimated total is 9,000 km and the exact total 8,363 km is less than the estimate", "Estimated total is 8,000 km and the exact total is more than the estimate", "Estimated total is 9,000 km and the exact total is 9,363 km", "Estimated total is 8,000 km and the exact total equals the estimate"], "correct": 0, "explain": "Using Round First, Add Fast: 4,568 rounds to 5,000 and 3,795 rounds to 4,000, giving an estimate of 9,000 km. The exact total is 4,568+3,795=8,363 km, which is indeed less than the estimate."}, {"q": "A railway station sold 45,236 tickets in April and 38,459 tickets in May. How many more tickets were sold in April than in May?", "options": ["6,777", "6,787", "7,777", "6,677"], "correct": 0, "explain": "Using Borrow and Cross to subtract 45,236 - 38,459 column by column with borrowing gives exactly 6,777 more tickets sold in April."}], "practice": [{"q": "Add 3,45,678 + 1,29,456.", "answer": "4,75,134", "solution": "1) Use Column Carry Countdown: ones 8+6=14, write 4 carry 1. 2) Tens 7+5+1=13, write 3 carry 1. 3) Hundreds 6+4+1=11, write 1 carry 1. 4) Thousands 5+9+1=15, write 5 carry 1. 5) Ten-thousands 4+2+1=7. 6) Lakhs 3+1=4. Result: 4,75,134."}, {"q": "Subtract 6,00,000 - 2,34,567.", "answer": "3,65,433", "solution": "1) Use Borrow and Cross: since 6,00,000 has zeros after the 6, borrow across all the zero places down to the ones column. 2) Ones: 10-7=3. 3) Tens: 9-6=3. 4) Hundreds: 9-5=4. 5) Thousands: 9-4=5. 6) Ten-thousands: 9-3=6. 7) Lakhs: 5-2=3. Result: 3,65,433."}, {"q": "Estimate the sum of 24,568 + 37,894 by rounding to the nearest thousand, then find the exact sum.", "answer": "Estimate: 63,000 ; Exact: 62,462", "solution": "1) Use Round First, Add Fast: 24,568 rounds to 25,000 (hundreds digit 5), 37,894 rounds to 38,000 (hundreds digit 8). 2) Estimate: 25,000+38,000=63,000. 3) Now find the exact sum using Column Carry Countdown: 24,568+37,894=62,462. 4) The exact answer is close to the estimate, so it checks out."}, {"q": "Find the missing term in the pattern: 5, 9, 15, 23, 33, ___", "answer": "45", "solution": "1) Use the Second Difference trick: differences are 4, 6, 8, 10, which increase by 2 each time. 2) The next difference should be 10+2=12. 3) Add this to the last term: 33+12=45."}, {"q": "A family travelled 1,245 km in the first week of a trip and 987 km in the second week. Find the total distance, and check it with an estimate.", "answer": "2,232 km", "solution": "1) Use Estimate-Then-Exact: round 1,245 to 1,000 and 987 to 1,000, giving an estimate of 1,000+1,000=2,000 km. 2) Now compute the exact sum with Column Carry Countdown: 1,245+987=2,232 km. 3) 2,232 km is reasonably close to the 2,000 km estimate, so the answer is correct."}, {"q": "Subtract 5,00,000 - 3,45,678.", "answer": "1,54,322", "solution": "1) Use Borrow and Cross: since 5,00,000 has zeros, borrow across from the lakhs digit all the way down to the ones column. 2) Ones: 10-8=2. 3) Tens: 9-7=2. 4) Hundreds: 9-6=3. 5) Thousands: 9-5=4. 6) Ten-thousands: 9-4=5. 7) Lakhs: 4-3=1. Result: 1,54,322."}, {"q": "A train's route is 3,50,000 km long for the season. It has already travelled 2,18,459 km. How many km are left to travel?", "answer": "1,31,541 km", "solution": "1) Use Estimate-Then-Exact: estimate 3,50,000-2,20,000=1,30,000 km, so the answer should be near this. 2) Use Borrow and Cross for the exact subtraction: 3,50,000-2,18,459=1,31,541 km. 3) This is close to the estimate, confirming the answer."}, {"q": "Find the sum: 12,34,567 + 8,76,543.", "answer": "21,11,110", "solution": "1) Use Column Carry Countdown, working from the ones place: ones 7+3=10, write 0 carry 1. 2) Tens 6+4+1=11, write 1 carry 1. 3) Hundreds 5+5+1=11, write 1 carry 1. 4) Thousands 4+6+1=11, write 1 carry 1. 5) Ten-thousands 3+7+1=11, write 1 carry 1. 6) Lakhs 2+8+1=11, write 1 carry 1. 7) Ten-lakhs 1+0+1=2. Result: 21,11,110."}]}, {"id": "ch5", "number": 5, "title": "Far and Near", "icon": "📏", "tagline": "Measuring the world, one metre at a time!", "summary": "Have you ever wondered how far your school is from home, or how many centimetres tall you are? In this chapter, we explore length, from tiny millimetres to giant kilometres, and learn how to measure, compare, and estimate distances confidently. These skills help you read maps, plan journeys, and understand the world around you just like a real explorer.", "concepts": [{"heading": "The Length Family: mm, cm, m, km", "explanation": "Length can be measured in different units depending on how big or small the distance is. We use millimetres (mm) for tiny things like the tip of a pencil, centimetres (cm) for a notebook, metres (m) for a classroom, and kilometres (km) for the distance between two cities, like Delhi and Agra. Choosing the right unit makes measuring easy and sensible.", "trick": {"name": "Jump by Zeros", "howto": "To move down the length family from a bigger unit to a smaller one, multiply by adding zeros: km to m adds three zeros (times 1000), m to cm adds two zeros (times 100), and cm to mm adds one zero (times 10). Just remember the zero count for each jump and shift the decimal point instead of doing long multiplication.", "example": "To convert 5 km to m, add three zeros: 5 km = 5000 m."}}, {"heading": "Climbing Up the Ladder", "explanation": "Sometimes we need to change a smaller unit into a bigger one, like turning metres into kilometres. This is the opposite of adding zeros, so instead we divide. For example, a 4500 m long track can also be described as 4 km 500 m, which is easier to say and remember.", "trick": {"name": "Ladder Trick", "howto": "Picture length units on a ladder: km at the top, then m, then cm, then mm at the bottom. Going down the ladder, multiply by 10, 100, or 1000. Going up the ladder, divide by the same numbers. Count how many steps you move and use that many zeros.", "example": "Convert 4500 m to km: going up one step, divide by 1000. 4500 divided by 1000 = 4.5, so 4500 m = 4 km 500 m."}}, {"heading": "Comparing Lengths with <, =, >", "explanation": "To compare two lengths given in different units, like 3 m and 250 cm, we cannot compare them directly. We must first change both lengths to the same unit, and then use the signs less than, equal to, or greater than to compare them fairly.", "trick": {"name": "Same Unit First", "howto": "Before comparing or adding lengths, always convert every measurement to the smallest unit given in the problem. Once all lengths are in the same unit, comparing them is as simple as comparing ordinary numbers.", "example": "Compare 3 m and 250 cm: convert 3 m to cm = 300 cm. Since 300 cm is greater than 250 cm, we can write 3 m > 250 cm."}}, {"heading": "Reading Distance Tables", "explanation": "Distance tables, like the ones printed on train tickets, show how far apart different stations are. To find the distance between two stations that are not next to each other, we add up the distances of all the smaller stretches in between, just like connecting the dots on a journey.", "trick": {"name": "Add as You Go", "howto": "When reading a distance table for a multi-stop journey, add the distance of each leg of the trip one at a time, keeping a running total. This running total method avoids mistakes and shows the distance covered at every stop.", "example": "Station distances: A to B = 90 km, B to C = 60 km. Running total: 90, then 90 + 60 = 150 km from A to C."}}, {"heading": "Estimating Without a Ruler", "explanation": "We do not always carry a ruler, so it helps to estimate lengths using familiar objects as references. For example, a doorway is about 2 m tall, a school notebook is about 25 cm long, and the width of a finger is about 1 cm. These references help us guess distances quickly and reasonably well.", "trick": {"name": "Reference Object Trick", "howto": "Keep two or three everyday reference lengths in your memory, such as your hand span (about 15 to 20 cm) or one big step (about 1 m). To estimate an unknown length, compare it mentally to these known references and multiply.", "example": "If a table is about 4 hand spans long and one hand span is 18 cm, the table is roughly 4 times 18 = 72 cm long."}}, {"heading": "Measuring with a Ruler", "explanation": "A ruler is a simple tool marked with millimetres and centimetres, used to measure short lengths accurately. To measure correctly, always place the 0 mark of the ruler exactly at the starting point of the object, then read the mark where the object ends.", "trick": {"name": "Zero Start Trick", "howto": "Always line up the 0 mark of the ruler with one end of the object being measured, not the edge of the ruler itself, since rulers sometimes have extra space before the 0 mark. Read the final mark carefully, counting small mm lines between the cm numbers.", "example": "If an eraser starts at the 0 mark and ends exactly at the 6 cm mark with 4 small mm lines after it, its length is 6 cm 4 mm, or 64 mm."}}], "mcqs": [{"q": "How many millimetres make 1 centimetre?", "options": ["10", "100", "1000", "5"], "correct": 0, "explain": "Using the Jump by Zeros trick, cm to mm is one step down the ladder, so we multiply by 10. This means 1 cm = 10 mm."}, {"q": "How many centimetres make 1 metre?", "options": ["10", "100", "1000", "50"], "correct": 1, "explain": "One step down the ladder from m to cm means multiply by 100, or add two zeros. So 1 m = 100 cm."}, {"q": "How many metres make 1 kilometre?", "options": ["100", "1000", "10", "10000"], "correct": 1, "explain": "Using the Jump by Zeros trick, km to m is one step down the ladder, so multiply by 1000. So 1 km = 1000 m."}, {"q": "Convert 5 km to metres.", "options": ["500 m", "5000 m", "50000 m", "5 m"], "correct": 1, "explain": "Using Jump by Zeros, multiply 5 by 1000 by adding three zeros: 5 km = 5000 m."}, {"q": "Convert 3500 m into km and m.", "options": ["3 km 500 m", "35 km", "350 km", "3 km 50 m"], "correct": 0, "explain": "Using the Ladder Trick going up, divide by 1000: 3500 divided by 1000 = 3 remainder 500, so 3500 m = 3 km 500 m."}, {"q": "Which distance is longer: 250 cm or 2 m 40 cm?", "options": ["250 cm", "2 m 40 cm", "They are equal", "Cannot compare"], "correct": 0, "explain": "Same Unit First trick: convert 2 m 40 cm to cm, which is 240 cm. Since 250 cm is greater than 240 cm, 250 cm is longer."}, {"q": "A ribbon is 4 m 25 cm long. What is its length in centimetres?", "options": ["425 cm", "45 cm", "4025 cm", "325 cm"], "correct": 0, "explain": "Convert metres to cm by multiplying by 100, so 4 m = 400 cm, then add the extra 25 cm: 400 + 25 = 425 cm."}, {"q": "A train travels 120 km from station A to B, then 85 km from B to C. What is the total distance from A to C?", "options": ["205 km", "195 km", "215 km", "175 km"], "correct": 0, "explain": "Reading distance tables means adding the segments with the Add as You Go trick: 120 km + 85 km = 205 km."}, {"q": "Using the Ladder Trick, convert 2 km 300 m entirely into metres.", "options": ["2300 m", "23000 m", "230 m", "2030 m"], "correct": 0, "explain": "2 km = 2000 m by adding three zeros, then add the 300 m: 2000 + 300 = 2300 m."}, {"q": "Convert 7500 mm into metres.", "options": ["7.5 m", "75 m", "0.75 m", "750 m"], "correct": 0, "explain": "Going up two steps of the Ladder Trick from mm to m means dividing by 1000: 7500 divided by 1000 = 7.5 m."}, {"q": "Flags are placed every 25 m along a 300 m straight track, starting at the very beginning and including one at the end. How many flags are needed in total?", "options": ["13 flags", "12 flags", "14 flags", "11 flags"], "correct": 0, "explain": "300 divided by 25 gives 12 gaps between flags, but since a flag also stands at the start, the total is 12 + 1 = 13 flags."}, {"q": "Water stations are set up every 2000 m along a 12 km race route, including one at the starting point. How many water stations are there in all?", "options": ["7 stations", "6 stations", "8 stations", "5 stations"], "correct": 0, "explain": "First convert 12 km to 12000 m using Jump by Zeros. Then 12000 divided by 2000 gives 6 gaps, plus the station at the start makes 6 + 1 = 7 stations."}], "practice": [{"q": "Convert 45 mm to cm.", "answer": "4.5 cm", "solution": "1) Going up the ladder from mm to cm means dividing by 10 (Ladder Trick). 2) 45 divided by 10 = 4.5. 3) So 45 mm = 4.5 cm."}, {"q": "Convert 7 km to m.", "answer": "7000 m", "solution": "1) Going down the ladder from km to m, multiply by 1000 using the Jump by Zeros trick. 2) 7 times 1000 = 7000. 3) So 7 km = 7000 m."}, {"q": "Which is longer, 4 m or 350 cm?", "answer": "4 m is longer", "solution": "1) Same Unit First trick: convert 4 m to cm by multiplying by 100. 2) 4 m = 400 cm. 3) Compare: 400 cm is greater than 350 cm, so 4 m is longer."}, {"q": "A pencil is 15 cm long. How many millimetres is that?", "answer": "150 mm", "solution": "1) Going down the ladder from cm to mm, multiply by 10 using Jump by Zeros. 2) 15 times 10 = 150. 3) So the pencil is 150 mm long."}, {"q": "Ravi's school is 2 km 400 m from his home. Write this distance completely in metres.", "answer": "2400 m", "solution": "1) Convert 2 km to metres using Jump by Zeros: 2 times 1000 = 2000 m. 2) Add the extra 400 m: 2000 + 400 = 2400 m. 3) So the school is 2400 m away."}, {"q": "A distance table shows: Delhi to Agra = 200 km, Agra to Gwalior = 120 km, Gwalior to Jhansi = 100 km. What is the total distance from Delhi to Jhansi?", "answer": "420 km", "solution": "1) Reading a distance table means adding each segment using the Add as You Go trick. 2) 200 + 120 = 320. 3) 320 + 100 = 420. 4) So Delhi to Jhansi is 420 km."}, {"q": "Flags are placed every 50 m along a 500 m road, including one at the very start and one at the very end. How many flags are used?", "answer": "11 flags", "solution": "1) Number of gaps = 500 divided by 50 = 10. 2) Since a flag also stands at the start, total flags = 10 + 1 = 11. 3) So 11 flags are needed."}, {"q": "A wire of length 3 m 75 cm is cut into 3 equal pieces. Find the length of each piece in centimetres.", "answer": "125 cm (1 m 25 cm)", "solution": "1) Convert the whole wire to cm using Same Unit First: 3 m 75 cm = 300 cm + 75 cm = 375 cm. 2) Divide into 3 equal pieces: 375 divided by 3 = 125 cm. 3) So each piece is 125 cm, which is 1 m 25 cm."}]}, {"id": "ch6", "number": 6, "title": "The Dairy Farm", "icon": "🥛", "tagline": "Milking multiplication tricks on a busy dairy farm!", "summary": "Welcome to a busy dairy farm full of milk cans, tickets and hungry cows! In this chapter you will discover clever, fast ways to multiply numbers in your head, so you never need to write out long multiplication again. These tricks will help you shop, count and solve farm problems in a flash.", "concepts": [{"heading": "Order Doesn't Matter (Commutative Property)", "explanation": "When you multiply two numbers, the answer stays the same even if you swap their order, so 6 × 8 gives the same result as 8 × 6. This is called the commutative property, and it lets you pick whichever order is easier to calculate. For example, on a dairy farm, 25 crates with 4 litres each gives 25 × 4, which is the same as 4 × 25.", "trick": {"name": "Swap for the Easier Sum", "howto": "If one order of multiplying feels harder, just swap the two numbers around; the answer never changes. Swap so that a friendly number, like 25, 50 or a multiple of 10, comes first if that makes the sum quicker.", "example": "Instead of working out 4 × 25 the long way, swap it to 25 × 4 = 100, using the well-known friendly fact that 25 × 4 makes 100."}}, {"heading": "Doubling and Halving Trick", "explanation": "You can make some multiplications easier by doubling one number and halving the other; the product stays exactly the same. This works best when one of the numbers is even. For example, to find 16 × 5, you can halve 16 to get 8 and double 5 to get 10, giving the easier sum 8 × 10.", "trick": {"name": "Double-Half Swap", "howto": "Halve the even number and double the other number; the product does not change. You can repeat this more than once if it keeps making the numbers friendlier, which is especially useful when one number is close to a multiple of 10.", "example": "14 × 15: halve 14 to get 7, and double 15 to get 30. Now solve 7 × 30 = 210. So 14 × 15 = 210."}}, {"heading": "Breaking Numbers by Place Value", "explanation": "You can split a bigger number into its place values, tens and ones, and multiply each part separately, then add the results together; this is cal
