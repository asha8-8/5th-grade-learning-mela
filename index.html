      html += '    <span class="chip">'+ch.length+' chapters</span>';

      html += '  </div>';
      html += '  <div class="go-row"><span>Enter the mela</span><span>→</span></div>';
      html += '</a>';
    });

    app.innerHTML = html;

    html += '  <a class="tabbtn'+(tab==="learn"?" active":"")+'" href="#s/'+key+'/chapter/'+id+'/learn">'+m.tabLearn+'</a>';
    html += '  <a class="tabbtn'+(tab==="quiz"?" active":"")+'" href="#s/'+key+'/chapter/'+id+'/quiz">'+m.tabQuiz+'</a>';
    html += '  <a class="tabbtn'+(tab==="practice"?" active":"")+'" href="#s/'+key+'/chapter/'+id+'/practice">'+m.tabPractice+'</a>';
    html += '</div>';

    html += '<div id="tabcontent"></div>';
    app.innerHTML = html;

    var slot = document.getElementById("tabcontent");
    if(tab==="learn") renderLearn(slot, key, m, c);
    else if(tab==="quiz") renderQuizTab(slot, key, m, c);
    else renderPractice(slot, m, c);
  }

  function renderLearn(slot, key, m, c){
    var html = "";
    c.concepts.forEach(function(cn){
      html += '<div class="concept-card">';
      html += '  <h4>'+esc(cn.heading)+'</h4>';
      html += '  <p class="expl">'+esc(cn.explanation)+'</p>';
      html += '  <div class="trick-box">';
      html += '    <div class="tt">'+m.trickEmoji+' '+esc(cn.trick.name)+'</div>';
      html += '    <div class="how">'+esc(cn.trick.howto)+'</div>';
      html += '    <div class="ex">'+esc(cn.trick.example)+'</div>';
      html += '  </div>';
      html += '</div>';
    });
    html += '<div style="text-align:center;margin:22px 0 8px;"><a class="btn btn-primary" href="#s/'+key+'/chapter/'+c.id+'/quiz">'+m.startQuizBtn+'</a></div>';
    slot.innerHTML = html;
  }

  function renderPractice(slot, m, c){
    var html = "";
    c.practice.forEach(function(pr, i){
      var steps = splitSteps(pr.solution);
      html += '<details class="practice-item">';
      html += '  <summary><span class="qbadge">'+(i+1)+'</span> <span>'+esc(pr.q)+'</span><span class="reveal-hint">'+m.revealHint+'</span></summary>';
      html += '  <div class="practice-body">';
      html += '    <div class="ans-line">'+m.answerLabel+esc(pr.answer)+'</div>';
      html += '    <ol class="steps">'+steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ol>';
      html += '  </div>';
      html += '</details>';
    });
    slot.innerHTML = html;
  }

  /* ================= QUIZ ================= */
  function renderQuizTab(slot, key, m, c){
    if(!quiz || quiz.subject !== key || quiz.chapterId !== c.id){
      quiz = { subject:key, chapterId:c.id, idx:0, selected:null, answered:false, correctCount:0, log:[], start:Date.now(), finished:false };
    }
    drawQuiz(slot, key, m, c);
  }

  function drawQuiz(slot, key, m, c){
    if(quiz.finished){ drawFinish(slot, key, m, c); return; }
    var i = quiz.idx, mcq = c.mcqs[i];
    var html = '<div class="quiz-top">';
    html += '  <div class="dots">';
    for(var k=0;k<c.mcqs.length;k++){
      var cls = "dot";
      if(k < quiz.log.length){ cls += quiz.log[k].correct ? " done-correct" : " done-wrong"; }
      else if(k===i){ cls += " current"; }
      html += '<span class="'+cls+'"></span>';
    }
    html += '  </div>';
    html += '  <span class="timer" id="quiz-timer">0:00</span>';
    html += '</div>';

    html += '<div class="q-card">';
    html += '  <div class="q-num">'+m.quizQPrefix+(i+1)+m.quizQSep+c.mcqs.length+'</div>';
    html += '  <div class="q-text">'+esc(mcq.q)+'</div>';
    html += '  <div class="opts">';
    var labels = ["A","B","C","D"];
    mcq.options.forEach(function(opt, oi){
      var cls = "opt" + (quiz.answered ? " locked" : "");
      if(quiz.answered){
        if(oi===mcq.correct) cls += " correct";
        else if(oi===quiz.selected) cls += " wrong";
      }
      html += '<button type="button" class="'+cls+'" data-oi="'+oi+'" '+(quiz.answered?"disabled":"")+'><span class="lab">'+labels[oi]+'</span><span>'+esc(opt)+'</span></button>';
    });
    html += '  </div>';
    if(quiz.answered){
      html += '  <div class="explain-box"><b>'+(quiz.selected===mcq.correct? m.correctPrefix : m.wrongPrefix)+'</b>'+esc(mcq.explain)+'</div>';
    }
    html += '  <div class="q-actions">';
    if(quiz.answered){
      html += '<button type="button" class="btn btn-primary" id="next-btn">'+(i===c.mcqs.length-1? m.lastBtn : m.nextBtn)+'</button>';
    }
    html += '  </div>';
    html += '</div>';
    slot.innerHTML = html;

    slot.querySelectorAll(".opt").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(quiz.answered) return;
        var oi = parseInt(btn.getAttribute("data-oi"),10);
        quiz.selected = oi;
        quiz.answered = true;
        var correct = oi === mcq.correct;
        if(correct) quiz.correctCount++;
        quiz.log.push({ q: mcq.q, chosen: mcq.options[oi], correctText: mcq.options[mcq.correct], correct: correct, explain: mcq.explain });
        drawQuiz(slot, key, m, c);
      });
    });
    var nextBtn = document.getElementById("next-btn");
    if(nextBtn){
      nextBtn.addEventListener("click", function(){
        if(quiz.idx < c.mcqs.length-1){
          quiz.idx++; quiz.selected=null; quiz.answered=false;
          drawQuiz(slot, key, m, c);
        } else {
          finishQuiz(key, c);
          drawQuiz(slot, key, m, c);
        }
      });
    }
  }

  function finishQuiz(key, c){
    quiz.finished = true;
    quiz.timeSec = Math.round((Date.now()-quiz.start)/1000);
    var accuracy = Math.round((quiz.correctCount / c.mcqs.length) * 100);
    var progress = progOf(key);
    var prev = progress[c.id];
    var better = !prev || quiz.correctCount > prev.score || (quiz.correctCount === prev.score && quiz.timeSec < prev.timeSec);
    if(better){
      progress[c.id] = { score: quiz.correctCount, accuracy: accuracy, timeSec: quiz.timeSec, at: Date.now() };
    } else {
      progress[c.id].at = Date.now();
    }
    saveAllProgress(allProgress);
  }

  function drawFinish(slot, key, m, c){
    var accuracy = Math.round((quiz.correctCount / c.mcqs.length) * 100);
    var tier = m.tiers[m.tiers.length-1];
    for(var t=0;t<m.tiers.length;t++){ if(accuracy>=m.tiers[t].min){ tier = m.tiers[t]; break; } }

    var html = '<div class="finish-card">';
    html += '  <div class="score-ring" style="--pct:'+accuracy+'"><div class="inner"><b>'+quiz.correctCount+'/'+c.mcqs.length+'</b><span>'+accuracy+m.accSuffix+'</span></div></div>';
    html += '  <div class="finish-msg">'+tier.emoji+' '+tier.msg+'</div>';
    html += '  <div class="finish-meta">'+esc(tmpl(m.finishMeta,{t:fmtTime(quiz.timeSec)}))+'</div>';
    html += '  <div class="finish-actions">';
    html += '    <button type="button" class="btn btn-saffron" id="retry-btn">'+m.retryBtn+'</button>';
    html += '    <button type="button" class="btn btn-ghost" id="review-btn">'+(quiz.showReview? m.reviewHide : m.reviewShow)+'</button>';
    html += '    <a class="btn btn-primary" href="#s/'+key+'/chapter/'+c.id+'/practice">'+m.tryPracticeBtn+'</a>';
    html += '  </div>';
    if(quiz.showReview){
      html += '  <div class="review-list">';
      quiz.log.forEach(function(l, i){
        html += '<div class="review-item '+(l.correct?"correct":"wrong")+'"><div class="qt">'+(i+1)+'. '+esc(l.q)+'</div><div class="rt">'+m.yourAnswerLabel+esc(l.chosen)+(l.correct?"":m.correctAnswerLabel+esc(l.correctText))+'<br>'+esc(l.explain)+'</div></div>';
      });
      html += '  </div>';
    }
    html += '</div>';
    slot.innerHTML = html;

    document.getElementById("retry-btn").addEventListener("click", function(){
      quiz = { subject:key, chapterId:c.id, idx:0, selected:null, answered:false, correctCount:0, log:[], start:Date.now(), finished:false };
      drawQuiz(slot, key, m, c);
    });
    document.getElementById("review-btn").addEventListener("click", function(){
      quiz.showReview = !quiz.showReview;
      drawFinish(slot, key, m, c);
    });
  }

  /* ================= ticking timer ================= */
  setInterval(function(){
    if(quiz && !quiz.finished){
      var el = document.getElementById("quiz-timer");
      if(el){ el.textContent = fmtTime(Math.round((Date.now()-quiz.start)/1000)); }
    }
  }, 1000);

  /* ================= router ================= */
  function route(){
    var hash = location.hash.replace(/^#/,"") || "home";
    var parts = hash.split("/");
    if(parts[0]==="home" || !parts[0]){ renderHub(); }
    else if(parts[0]==="s" && parts[1] && parts[2]==="cheatsheet"){ renderCheatSheet(parts[1]); }
    else if(parts[0]==="s" && parts[1] && parts[2]==="chapter" && parts[3]){ renderChapterPage(parts[1], parts[3], parts[4]); }
    else if(parts[0]==="s" && parts[1]){ renderSubjectHome(parts[1]); }
    else { renderHub(); }
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
